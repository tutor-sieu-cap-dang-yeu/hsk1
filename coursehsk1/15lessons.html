vi": "Tôi định đi siêu thị."}], "texts": [{"num": 1, "title": "在路上 · Tìm nhà hàng", "role": "Cốt lõi", "focus": "正在找呢 · 开车没开车？(chính phản) · 坐车呢", "scene": "Ở trên đường, Lý Văn đang tìm nhà hàng, Vương Nhất Phi gọi điện thoại cho anh ấy.", "dialogue": [{"speaker": "王一飞", "zh": "喂，李文。你什么时候能到饭店？", "py": "Wèi, Lǐ Wén. Nǐ shénme shíhou néng dào fàndiàn?", "vi": "Alo, Lý Văn. Khi nào em có thể đến nhà hàng?"}, {"speaker": "李文", "zh": "我还不知道，正在找呢。", "py": "Wǒ hái bù zhīdào, zhèngzài zhǎo ne.", "vi": "Em vẫn chưa biết, đang tìm đây ạ."}, {"speaker": "王一飞", "zh": "你开车没开车？", "py": "Nǐ kāichē méi kāichē?", "vi": "Em có lái xe không?"}, {"speaker": "李文", "zh": "我没开车，坐车呢。", "py": "Wǒ méi kāichē, zuòchē ne.", "vi": "Em không lái xe, đang đi xe đây ạ."}], "tip": "💡 <b>车</b> chỉ chung các loại xe. <b>开车</b> = tự mình lái xe; <b>坐车</b> = đi/ngồi xe, không tự lái."}, {"num": 2, "title": "在饭店里 · Vẫn là sinh viên", "role": "Mở rộng mẫu", "focus": "还在读大学吗 · 读大学呢 · 学习忙不忙？(chính phản)", "scene": "Tại nhà hàng, Vương Nhất Phi và Lý Văn gặp nhau rồi trò chuyện.", "dialogue": [{"speaker": "王一飞", "zh": "你还在读大学吗？", "py": "Nǐ hái zài dú dàxué ma?", "vi": "Em vẫn đang học đại học à?"}, {"speaker": "李文", "zh": "对，我读大学呢，还是大学生。", "py": "Duì, wǒ dú dàxué ne, hái shì dàxuéshēng.", "vi": "Vâng, em đang học đại học, vẫn là sinh viên ạ."}, {"speaker": "王一飞", "zh": "你们学习忙不忙？", "py": "Nǐmen xuéxí máng bu máng?", "vi": "Các em học tập có bận không?"}, {"speaker": "李文", "zh": "非常忙，我学医，我们的课很多。", "py": "Fēicháng máng, wǒ xué yī, wǒmen de kè hěn duō.", "vi": "Vô cùng bận ạ. Em học y, các tiết học của chúng em rất nhiều."}]}, {"num": 3, "title": "星期六早上 · Em trai dậy chưa", "role": "Tái sử dụng", "focus": "起床没起床呢？· 还在睡觉呢 · 要去超市 · 去不去？· 要在家...玩", "scene": "Sáng thứ Bảy, Lưu Minh định đi bệnh viện làm thêm giờ. Trước khi ra khỏi nhà, ông nói chuyện với con gái.", "dialogue": [{"speaker": "刘明", "zh": "弟弟起床没起床呢？", "py": "Dìdi qǐchuáng méi qǐchuáng ne?", "vi": "Em trai đã ngủ dậy chưa con?"}, {"speaker": "小雪", "zh": "没起床呢，还在睡觉呢。", "py": "Méi qǐchuáng ne, hái zài shuìjiào ne.", "vi": "Chưa ngủ dậy đâu bố, em vẫn đang ngủ ạ."}, {"speaker": "刘明", "zh": "我要去超市，他去不去？", "py": "Wǒ yào qù chāoshì, tā qù bu qù?", "vi": "Bố định đi siêu thị, em có đi không?"}, {"speaker": "小雪", "zh": "我昨天问他，他对我说，他今天不去，他要在家里和小朋友玩。", "py": "Wǒ zuótiān wèn tā, tā duì wǒ shuō, tā jīntiān bú qù, tā yào zài jiā lǐ hé xiǎopéngyǒu wán.", "vi": "Hôm qua con đã hỏi em. Em nói với con là hôm nay em không đi, em định ở nhà chơi với các bạn nhỏ."}]}], "hanzi_chars": ["时", "候", "知", "道", "正", "找", "开", "车", "读", "医", "弟", "起", "床", "睡", "觉", "哪", "昨", "问", "对", "说", "要"], "grammar": [{"title": "正反问句 · Câu hỏi chính phản", "structure": "动词+不+动词？　·　动词+没+动词？　·　形容词+不+形容词？", "exp": "Câu hỏi chính phản đặt dạng khẳng định + phủ định của động từ/tính từ cạnh nhau để hỏi, không cần thêm 吗.", "examples": [{"zh": "你们学习忙不忙？", "py": "Nǐmen xuéxí máng bu máng?", "vi": "Các em học có bận không?"}, {"zh": "你开车没开车？", "py": "Nǐ kāichē méi kāichē?", "vi": "Em có lái xe không?"}, {"zh": "弟弟起床没起床？", "py": "Dìdi qǐchuáng méi qǐchuáng?", "vi": "Em trai đã ngủ dậy chưa?"}]}, {"title": "“在 / 正在” + “呢” · Hành động đang diễn ra", "structure": "① 主语+正在+动词+呢　② 主语+在+动词+呢　③ 主语+动词+呢", "exp": "在 và 正在 đứng trước động từ để biểu thị hành động đang diễn ra; 呢 đứng cuối câu nhấn mạnh trạng thái đang tiếp diễn. Có 3 cấu trúc thường gặp.", "examples": [{"zh": "我正在找车呢。", "py": "Wǒ zhèngzài zhǎo chē ne.", "vi": "Tôi đang tìm xe đây."}, {"zh": "弟弟还在睡觉呢。", "py": "Dìdi hái zài shuìjiào ne.", "vi": "Em trai vẫn đang ngủ."}, {"zh": "我读大学呢。", "py": "Wǒ dú dàxué ne.", "vi": "Tôi đang học đại học đấy."}]}, {"title": "能愿动词 “要” · Động từ năng nguyện 要", "structure": "主语 + 要 + 动词 + 宾语　(phủ định: 主语 + 不要 + 动词)", "exp": "要 đứng trước động từ để biểu thị mong muốn, dự定, ý định/kế hoạch làm gì.", "examples": [{"zh": "我要去超市。", "py": "Wǒ yào qù chāoshì.", "vi": "Tôi định đi siêu thị."}, {"zh": "他今天不要去。", "py": "Tā jīntiān bú yào qù.", "vi": "Hôm nay anh ấy không muốn/không định đi."}, {"zh": "明天我要学医。", "py": "Míngtiān wǒ yào xué yī.", "vi": "Ngày mai tôi định học y khoa."}], "note": "⚠️ Trong giao tiếp, 不要 có thể mang nghĩa \"không muốn / không định / đừng\" tùy ngữ cảnh."}], "exercises": [{"type": 1, "title": "1. 找不同类词 · Chọn từ khác loại", "prompt": "Trong 4 từ sau, từ nào KHÔNG phải động từ hành động?", "options": [{"hz": "睡觉", "py": "shuìjiào", "correct": false}, {"hz": "开车", "py": "kāichē", "correct": false}, {"hz": "饭店", "py": "fàndiàn", "correct": true}, {"hz": "找", "py": "zhǎo", "correct": false}], "ok_msg": "Chính xác! 饭店 (nhà hàng) là nơi chốn, còn lại là động từ hành động.", "bad_msg": "Chưa đúng. 饭店 là nơi chốn, khác nhóm với 睡觉/开车/找."}, {"type": 2, "title": "2. 判断逻辑正误 · Đúng hay sai", "prompt": "“正在 + động từ + 呢” dùng để nói hành động đang diễn ra. Nhận định này đúng hay sai?", "stem": "“正在 + 动词 + 呢” 表示动作正在进行：我正在学习呢。", "stem_py": "“Zhèngzài + dòngcí + ne” biǎoshì dòngzuò zhèngzài jìnxíng: wǒ zhèngzài xuéxí ne.", "options": [{"hz": "对", "py": "duì", "correct": true}, {"hz": "错", "py": "cuò", "correct": false}], "ok_msg": "Chính xác! 正在+V+呢 = đang làm gì đó: 我正在学习呢.", "bad_msg": "Chưa đúng — 正在+V+呢 diễn tả hành động đang diễn ra."}, {"type": 3, "title": "3. 选词填空 · Chọn từ điền vào chỗ trống", "prompt": "Chọn từ thích hợp điền vào chỗ trống:", "stem": "她没在看电视，____ 学习呢。", "stem_py": "Tā méi zài kàn diànshì, ____ xuéxí ne.", "options": [{"hz": "正在", "py": "zhèngzài", "correct": true}, {"hz": "那里", "py": "nàli", "correct": false}, {"hz": "要", "py": "yào", "correct": false}], "ok_msg": "Chính xác! ...正在学习呢 — đang học đấy.", "bad_msg": "Chưa đúng. Diễn tả đang làm gì dùng 正在: 正在学习呢."}, {"type": 4, "title": "4. 连词成句 · Sắp xếp câu từ thẻ Pinyin", "prompt": "Nghĩa cần diễn đạt: \"Tôi đang học đại học đấy.\" — Bấm các mảnh Pinyin theo thứ tự đúng:", "tokens": ["Wǒ", "dú", "dàxué", "ne", "。"], "correct_order": ["Wǒ", "dú", "dàxué", "ne", "。"], "ok_msg": "Rất tốt! 我读大学呢。"}, {"type": 5, "title": "5. 看文本回答 · Đọc đoạn văn trả lời", "prompt": "Đọc đoạn hội thoại rồi trả lời câu hỏi:", "passage_lines": [{"zh": "刘明：弟弟起床没起床呢？", "py": "Liú Míng: Dìdi qǐchuáng méi qǐchuáng ne?"}, {"zh": "小雪：没起床呢，还在睡觉呢。", "py": "Xiǎoxuě: Méi qǐchuáng ne, hái zài shuìjiào ne."}], "question": "Em trai lúc này đang làm gì?", "options": [{"hz": "在睡觉", "py": "zài shuìjiào", "correct": true}, {"hz": "在开车", "py": "zài kāichē", "correct": false}, {"hz": "在读书", "py": "zài dúshū", "correct": false}], "ok_msg": "Chính xác! 还在睡觉呢 — em ấy vẫn đang ngủ.", "bad_msg": "Đọc lại: \"还在睡觉呢\" — đang ngủ."}, {"type": 6, "title": "6. 完成对话 · Hoàn thành hội thoại", "prompt": "Chọn câu phù hợp để hoàn thành hội thoại:", "stem": "A：你在做什么？<br>B：____", "stem_py": "A: Nǐ zài zuò shénme?  B: ____", "options": [{"hz": "我在学中文呢。", "py": "Wǒ zài xué Zhōngwén ne.", "correct": true}, {"hz": "我开车没开车？", "py": "Wǒ kāichē méi kāichē?", "correct": false}, {"hz": "你什么时候能到？", "py": "Nǐ shénme shíhou néng dào?", "correct": false}], "ok_msg": "Chính xác! Trả lời 在做什么 bằng: 我在学中文呢 (在+V+呢).", "bad_msg": "Chưa đúng. Câu hỏi 你在做什么？ cần trả lời việc đang làm: 我在...呢."}], "recall": [{"hz": "时候", "py": "shíhou", "vi": "lúc, khi"}, {"hz": "知道", "py": "zhīdào", "vi": "biết"}, {"hz": "正在", "py": "zhèngzài", "vi": "đang"}, {"hz": "找", "py": "zhǎo", "vi": "tìm"}, {"hz": "开车", "py": "kāichē", "vi": "lái xe"}, {"hz": "读", "py": "dú", "vi": "học, đọc"}, {"hz": "大学生", "py": "dàxuéshēng", "vi": "sinh viên"}, {"hz": "起床", "py": "qǐchuáng", "vi": "ngủ dậy"}, {"hz": "睡觉", "py": "shuìjiào", "vi": "ngủ"}, {"hz": "昨天", "py": "zuótiān", "vi": "hôm qua"}, {"hz": "说", "py": "shuō", "vi": "nói"}, {"hz": "要", "py": "yào", "vi": "muốn, định"}], "final_use": {"intro": "Ghép lại thành một màn hỏi–đáp về việc đang làm và dự định, dùng 正在/在/V+呢 · 正反问句 · 要.", "dialogue": [{"who": "A", "zh": "你在做什么？", "py": "Nǐ zài zuò shénme?"}, {"who": "B", "zh": "我正在学习中文呢。你去不去吃午饭？", "py": "Wǒ zhèngzài xuéxí Zhōngwén ne. Nǐ qù bu qù chī wǔfàn?"}, {"who": "A", "zh": "我不去，我要看书。你明天要做什么？", "py": "Wǒ bú qù, wǒ yào kàn shū. Nǐ míngtiān yào zuò shénme?"}, {"who": "B", "zh": "我明天要去学校学习。", "py": "Wǒ míngtiān yào qù xuéxiào xuéxí."}], "task": "Thay bằng thông tin thật: nói bạn đang làm gì (正在/在...呢), hỏi bạn cùng học bằng câu chính phản (去不去/忙不忙), và nói dự định ngày mai bằng 要+V. Đọc to cả đoạn."}}, "12": {"id": 12, "title_vi": "Hôm qua tuyết rơi rồi", "title_zh": "昨天下雪了", "can_do": "Sau bài học này, bạn có thể miêu tả thời tiết (下雨/下雪 + 了), mô tả đơn giản tình trạng sức khỏe (生病了, 有点儿冷), dùng 太……了 để cảm thán, và phân biệt 有点儿 / 一点儿.", "goals": ["天气 · Nghe hiểu và miêu tả tình hình thời tiết (下雨/下雪, 冷/热).", "病情 · Nghe hiểu và mô tả đơn giản tình trạng sức khỏe (生病了, 看病, 吃药).", "太……了 · Nắm cách dùng cấu trúc cảm thán 太 + tính từ + 了.", "文化 · Hiểu lời khuyên 多喝热水 (uống nhiều nước ấm) thường gặp khi ốm ở Trung Quốc."], "core_patterns": [{"zh": "下雨了 / 下雪了", "py": "xiàyǔ le / xiàxuě le", "vi": "Câu thời tiết (không cần chủ ngữ)"}, {"zh": "S + 了 (trạng thái mới)", "py": "... le", "vi": "...rồi (thay đổi trạng thái)"}, {"zh": "太 + 形容词 + 了", "py": "tài ... le", "vi": "...quá! (cảm thán)"}, {"zh": "有点儿 + 形容词 / 一点儿 + 名词", "py": "yǒudiǎnr... / yìdiǎnr...", "vi": "hơi... / một chút..."}], "preview_vocab": [{"hz": "下雨", "vi": "trời mưa"}, {"hz": "下雪", "vi": "tuyết rơi"}, {"hz": "天气", "vi": "thời tiết"}, {"hz": "生病", "vi": "bị ốm"}, {"hz": "有点儿", "vi": "hơi"}, {"hz": "药", "vi": "thuốc"}, {"hz": "热水", "vi": "nước ấm"}], "warmup_type": "matching", "warmup": [{"zh": "下雨 · 冷 · 生病", "py": "xiàyǔ · lěng · shēngbìng", "vi": "trời mưa · lạnh · bị ốm"}, {"zh": "看病 · 雪 · 水", "py": "kànbìng · xuě · shuǐ", "vi": "khám bệnh · tuyết · nước"}], "warmup_preview": [{"zh": "昨天下雪了。", "py": "Zuótiān xiàxuě le.", "vi": "Hôm qua tuyết rơi rồi."}, {"zh": "我觉得有点儿冷。", "py": "Wǒ juéde yǒudiǎnr lěng.", "vi": "Tôi thấy hơi lạnh."}, {"zh": "太冷了！", "py": "Tài lěng le!", "vi": "Lạnh quá!"}], "texts": [{"num": 1, "title": "打电话 · Hỏi thời tiết", "role": "Cốt lõi", "focus": "天气怎么样？ · 下雪了/下雨了 (了) · 有点儿冷", "scene": "Vương Nhất Tuyết gọi điện cho Vương Nhất Phi để hỏi tình hình thời tiết chỗ Nhất Phi.", "dialogue": [{"speaker": "一雪", "zh": "一飞，你那里的天气怎么样？", "py": "Yīfēi, nǐ nàli de tiānqì zěnmeyàng?", "vi": "Nhất Phi, thời tiết chỗ em thế nào?"}, {"speaker": "一飞", "zh": "昨天下雪了，今天天气不太好，下雨了。", "py": "Zuótiān xiàxuě le, jīntiān tiānqì bú tài hǎo, xiàyǔ le.", "vi": "Hôm qua tuyết rơi rồi, hôm nay thời tiết không tốt lắm, trời mưa rồi."}, {"speaker": "一雪", "zh": "雨大吗？", "py": "Yǔ dà ma?", "vi": "Mưa có to không?"}, {"speaker": "一飞", "zh": "雨不大。我觉得有点儿冷。", "py": "Yǔ bú dà. Wǒ juéde yǒudiǎnr lěng.", "vi": "Mưa không to. Em thấy hơi lạnh."}]}, {"num": 2, "title": "在医院 · Khám bệnh", "role": "Mở rộng mẫu", "focus": "你怎么了？ · 生病了 · 吃一点儿药吧 · 吃几天？", "scene": "Hôm qua Dương Đồng Nhạc bị ốm, bác sĩ Hồ khám bệnh cho anh ấy ở bệnh viện.", "dialogue": [{"speaker": "医生", "zh": "你怎么了？", "py": "Nǐ zěnme le?", "vi": "Anh sao thế? / Anh thấy không khỏe ở đâu?"}, {"speaker": "同乐", "zh": "我觉得有点儿冷，生病了。", "py": "Wǒ juéde yǒudiǎnr lěng, shēngbìng le.", "vi": "Tôi thấy hơi lạnh, tôi bị ốm rồi."}, {"speaker": "医生", "zh": "我看看。你病了，吃一点儿药吧。", "py": "Wǒ kànkan. Nǐ bìng le, chī yìdiǎnr yào ba.", "vi": "Để tôi xem nào. Anh bị ốm rồi, uống một ít thuốc đi."}, {"speaker": "同乐", "zh": "谢谢医生。这个药吃几天？", "py": "Xièxie yīshēng. Zhège yào chī jǐ tiān?", "vi": "Cảm ơn bác sĩ. Thuốc này uống mấy ngày ạ?"}, {"speaker": "医生", "zh": "吃三天。", "py": "Chī sān tiān.", "vi": "Uống ba ngày."}], "tip": "💡 <b>你怎么了？</b> (Nǐ zěnme le?) là câu hỏi thăm khi thấy ai đó có vẻ không ổn — \"bạn sao thế?\"."}, {"num": 3, "title": "看完病 · Lời dặn của bác sĩ", "role": "Tái sử dụng", "focus": "回家后再吃药 · 喝一些热水 · 不要工作了 · 休息一天", "scene": "Bác sĩ Hồ khám xong cho Dương Đồng Nhạc, anh chuẩn bị về nhà.", "dialogue": [{"speaker": "医生", "zh": "回家后再吃药，喝一些热水。", "py": "Huíjiā hòu zài chī yào, hē yìxiē rè shuǐ.", "vi": "Về nhà rồi hãy uống thuốc, uống thêm một ít nước ấm nhé."}, {"speaker": "同乐", "zh": "好的。", "py": "Hǎo de.", "vi": "Vâng ạ."}, {"speaker": "医生", "zh": "不要工作了，明天在家休息一天。", "py": "Búyào gōngzuò le, míngtiān zài jiā xiūxi yì tiān.", "vi": "Đừng làm việc nữa, ngày mai hãy ở nhà nghỉ một ngày."}, {"speaker": "同乐", "zh": "好的，谢谢医生。", "py": "Hǎo de, xièxie yīshēng.", "vi": "Vâng, cảm ơn bác sĩ ạ."}], "tip": "💡 Văn hóa: khi ai đó nói 我生病了, người Trung thường khuyên <b>多喝热水</b> (uống nhiều nước ấm) và 回家休息吧 (về nhà nghỉ đi)."}], "hanzi_chars": ["下", "雨", "雪", "了", "天", "气", "这", "觉", "得", "冷", "病", "药", "回", "再", "喝", "热", "水"], "grammar": [{"title": "非主谓句 · Câu phi chủ-vị (thời tiết)", "structure": "下 + hiện tượng thời tiết (下雨 / 下雪)", "exp": "Khi nói về hiện tượng tự nhiên/thời tiết, tiếng Trung có thể dùng câu không có chủ ngữ rõ ràng. Không cần thêm 天气 làm chủ ngữ.", "examples": [{"zh": "下雪了。", "py": "Xiàxuě le.", "vi": "Tuyết rơi rồi."}, {"zh": "下雨了。", "py": "Xiàyǔ le.", "vi": "Trời mưa rồi."}]}, {"title": "语气助词 “了” · Trợ từ 了 (thay đổi trạng thái)", "structure": "... + 了 (cuối câu)", "exp": "了 ở cuối câu biểu thị một tình huống mới xuất hiện hoặc trạng thái đã thay đổi (trước đó chưa, bây giờ đã).", "examples": [{"zh": "下雨了。", "py": "Xiàyǔ le.", "vi": "Trời mưa rồi. (trước chưa mưa, giờ đã mưa)"}, {"zh": "我有电脑了。", "py": "Wǒ yǒu diànnǎo le.", "vi": "Tôi có máy tính rồi. (trước chưa có, giờ đã có)"}]}, {"title": "“太……了” · Cấu trúc cảm thán", "structure": "太 + 形容词 + 了", "exp": "Dùng để biểu thị mức độ rất cao, mang sắc thái cảm thán (...quá!).", "examples": [{"zh": "太冷了！", "py": "Tài lěng le!", "vi": "Lạnh quá!"}, {"zh": "这个杯子太小了。", "py": "Zhège bēizi tài xiǎo le.", "vi": "Cái cốc này bé quá."}, {"zh": "我们今天太高兴了！", "py": "Wǒmen jīntiān tài gāoxìng le!", "vi": "Hôm nay chúng tôi vui quá!"}]}, {"title": "“有点儿” vs “一点儿” · Phân biệt", "structure": "有点儿 + 形容词 (thường nghĩa tiêu cực)　·　一点儿 + 名词 / sau 形容词", "exp": "有点儿 + tính từ = \"hơi..., có chút...\" (thường dùng với cảm nhận không tích cực). 一点儿 = \"một chút\" (số lượng/mức độ), đứng trước danh từ hoặc sau tính từ.", "examples": [{"zh": "有点儿冷。", "py": "Yǒudiǎnr lěng.", "vi": "Hơi lạnh."}, {"zh": "吃一点儿药。", "py": "Chī yìdiǎnr yào.", "vi": "Uống một ít thuốc."}, {"zh": "冷一点儿。", "py": "Lěng yìdiǎnr.", "vi": "Lạnh hơn một chút."}], "note": "🧠 Mẹo nhớ: 有点儿 = hơi... (than phiền); 一点儿 = một chút (số lượng)."}], "exercises": [{"type": 1, "title": "1. 找不同类词 · Chọn từ khác loại", "prompt": "Trong 4 từ sau, từ nào KHÔNG liên quan tới thời tiết?", "options": [{"hz": "下雨", "py": "xiàyǔ", "correct": false}, {"hz": "下雪", "py": "xiàxuě", "correct": false}, {"hz": "吃药", "py": "chī yào", "correct": true}, {"hz": "冷", "py": "lěng", "correct": false}], "ok_msg": "Chính xác! 吃药 (uống thuốc) thuộc chủ đề sức khỏe, còn lại là thời tiết.", "bad_msg": "Chưa đúng. 吃药 liên quan sức khỏe, khác nhóm với 下雨/下雪/冷."}, {"type": 2, "title": "2. 判断逻辑正误 · Đúng hay sai", "prompt": "Cấu trúc cảm thán là “太 + tính từ + 了”. Nhận định này đúng hay sai?", "stem": "感叹格式：太 + 形容词 + 了，例如 “太冷了！”。", "stem_py": "Gǎntàn géshì: tài + xíngróngcí + le, lìrú “tài lěng le!”.", "options": [{"hz": "对", "py": "duì", "correct": true}, {"hz": "错", "py": "cuò", "correct": false}], "ok_msg": "Chính xác! 太 + tính từ + 了: 太冷了！太小了。", "bad_msg": "Chưa đúng — cảm thán dùng 太...了: 太冷了！"}, {"type": 3, "title": "3. 选词填空 · Chọn từ điền vào chỗ trống", "prompt": "Chọn từ thích hợp điền vào chỗ trống:", "stem": "我觉得 ____ 冷。", "stem_py": "Wǒ juéde ____ lěng.", "options": [{"hz": "有点儿", "py": "yǒudiǎnr", "correct": true}, {"hz": "一点儿", "py": "yìdiǎnr", "correct": false}, {"hz": "太", "py": "tài", "correct": false}], "ok_msg": "Chính xác! 有点儿 + tính từ (cảm nhận): 我觉得有点儿冷。", "bad_msg": "Chưa đúng. \"Hơi lạnh\" (cảm nhận) dùng 有点儿: 有点儿冷。"}, {"type": 4, "title": "4. 连词成句 · Sắp xếp câu từ thẻ Pinyin", "prompt": "Nghĩa cần diễn đạt: \"Hôm qua tuyết rơi rồi.\" — Bấm các mảnh Pinyin theo thứ tự đúng:", "tokens": ["Zuótiān", "xiàxuě", "le", "。"], "correct_order": ["Zuótiān", "xiàxuě", "le", "。"], "ok_msg": "Rất tốt! 昨天下雪了。"}, {"type": 5, "title": "5. 看文本回答 · Đọc đoạn văn trả lời", "prompt": "Đọc đoạn hội thoại rồi trả lời câu hỏi:", "passage_lines": [{"zh": "同乐：谢谢医生。这个药吃几天？", "py": "Tónglè: Xièxie yīshēng. Zhège yào chī jǐ tiān?"}, {"zh": "医生：吃三天。", "py": "Yīshēng: Chī sān tiān."}], "question": "Thuốc này cần uống mấy ngày?", "options": [{"hz": "三天", "py": "sān tiān", "correct": true}, {"hz": "一天", "py": "yì tiān", "correct": false}, {"hz": "五天", "py": "wǔ tiān", "correct": false}], "ok_msg": "Chính xác! 吃三天 — uống ba ngày.", "bad_msg": "Đọc lại: \"吃三天\" — ba ngày."}, {"type": 6, "title": "6. 完成对话 · Hoàn thành hội thoại", "prompt": "Chọn câu phù hợp để hoàn thành hội thoại:", "stem": "医生：你怎么了？<br>病人：____", "stem_py": "Yīshēng: Nǐ zěnme le?  Bìngrén: ____", "options": [{"hz": "我觉得有点儿冷，生病了。", "py": "Wǒ juéde yǒudiǎnr lěng, shēngbìng le.", "correct": true}, {"hz": "昨天下雪了。", "py": "Zuótiān xiàxuě le.", "correct": false}, {"hz": "这个药吃几天？", "py": "Zhège yào chī jǐ tiān?", "correct": false}], "ok_msg": "Chính xác! Trả lời 你怎么了 bằng tình trạng: 我觉得有点儿冷，生病了。", "bad_msg": "Chưa đúng. Câu hỏi 你怎么了？ cần mô tả tình trạng sức khỏe."}], "recall": [{"hz": "下雨", "py": "xiàyǔ", "vi": "trời mưa"}, {"hz": "下雪", "py": "xiàxuě", "vi": "tuyết rơi"}, {"hz": "天气", "py": "tiānqì", "vi": "thời tiết"}, {"hz": "了", "py": "le", "vi": "rồi (trạng thái mới)"}, {"hz": "觉得", "py": "juéde", "vi": "cảm thấy"}, {"hz": "有点儿", "py": "yǒudiǎnr", "vi": "hơi"}, {"hz": "冷", "py": "lěng", "vi": "lạnh"}, {"hz": "生病", "py": "shēngbìng", "vi": "bị ốm"}, {"hz": "药", "py": "yào", "vi": "thuốc"}, {"hz": "回", "py": "huí", "vi": "trở về"}, {"hz": "喝", "py": "hē", "vi": "uống"}, {"hz": "热水", "py": "rè shuǐ", "vi": "nước ấm"}], "final_use": {"intro": "Ghép lại thành một màn hỏi thời tiết + khám bệnh, dùng 下雨/下雪+了 · 有点儿 · 太……了 · lời khuyên 多喝热水.", "dialogue": [{"who": "A", "zh": "你那里的天气怎么样？", "py": "Nǐ nàli de tiānqì zěnmeyàng?"}, {"who": "B", "zh": "下雨了，太冷了！我觉得有点儿不舒服。", "py": "Xiàyǔ le, tài lěng le! Wǒ juéde yǒudiǎnr bù shūfu."}, {"who": "A", "zh": "你生病了吗？多喝热水，回家休息吧。", "py": "Nǐ shēngbìng le ma? Duō hē rè shuǐ, huíjiā xiūxi ba."}, {"who": "B", "zh": "好的，谢谢。", "py": "Hǎo de, xièxie."}], "task": "Đóng vai hỏi thời tiết nơi bạn (下雨/下雪 + 了), than một câu bằng 太……了, mô tả sức khỏe bằng 有点儿, rồi đáp lại lời ốm của bạn cùng học bằng 多喝热水. Đọc to cả đoạn."}, "summary": {"title": "Tóm tắt & tự đánh giá sau Bài 12", "review_table": [{"item": "非主谓句 · Câu thời tiết không chủ ngữ", "example": "下雪了。"}, {"item": "语气助词 “了” · Thay đổi trạng thái", "example": "下雨了。"}, {"item": "“太……了” · Cảm thán", "example": "太冷了！"}, {"item": "有点儿 · Hơi... (cảm nhận)", "example": "有点儿冷。"}, {"item": "一点儿 · Một chút (số lượng)", "example": "吃一点儿药。"}, {"item": "病情 · Mô tả sức khỏe", "example": "我生病了。"}], "can_do": [{"label": "天气 · Mô tả thời tiết", "zh": "昨天下雪了，今天下雨了。", "py": "Zuótiān xiàxuě le, jīntiān xiàyǔ le.", "vi": "Hôm qua tuyết rơi, hôm nay trời mưa rồi."}, {"label": "感叹 · Cảm thán", "zh": "太冷了！", "py": "Tài lěng le!", "vi": "Lạnh quá!"}, {"label": "病情 · Nói bị ốm", "zh": "我觉得有点儿冷，生病了。", "py": "Wǒ juéde yǒudiǎnr lěng, shēngbìng le.", "vi": "Tôi thấy hơi lạnh, bị ốm rồi."}, {"label": "建议 · Lời khuyên", "zh": "多喝热水，回家休息吧。", "py": "Duō hē rè shuǐ, huíjiā xiūxi ba.", "vi": "Uống nhiều nước ấm, về nhà nghỉ nhé."}], "checklist": ["Tôi mô tả được thời tiết bằng 下雨/下雪 + 了.", "Tôi dùng được 太……了 để cảm thán và phân biệt 有点儿 / 一点儿.", "Tôi mô tả được tình trạng ốm và đáp lời khuyên 多喝热水."]}}, "13": {"id": 13, "title_vi": "Làm ơn cho tôi một tách trà", "title_zh": "请给我一杯茶", "can_do": "Sau bài học này, bạn có thể dùng câu song tân ngữ (给/问 + người + vật/câu hỏi) để đưa đồ hoặc hỏi, dùng 可以 để xin phép, và dùng V + 一下 để làm lời đề nghị nhẹ nhàng — áp dụng vào gọi món.", "goals": ["双宾语句 · Dùng câu song tân ngữ (动词 + người + vật) để hỏi hoặc đưa/cho đồ.", "能愿动词 “可以” · Dùng 可以 để biểu thị được phép / xin phép làm gì.", "动词 + 一下 · Dùng V + 一下 để diễn tả hành động ngắn / làm thử, khiến lời nói nhẹ nhàng hơn.", "点餐 · Sử dụng các mẫu câu thường dùng khi gọi món ăn, đồ uống."], "core_patterns": [{"zh": "请给我 + 数量 + 物", "py": "Qǐng gěi wǒ ...", "vi": "Làm ơn cho tôi... (song tân ngữ)"}, {"zh": "S + 可以 + V (吗)？", "py": "... kěyǐ ...", "vi": "Có thể / được phép làm gì"}, {"zh": "动词 + 一下", "py": "... yíxià", "vi": "Làm thử / một chút (nhẹ nhàng)"}, {"zh": "我要 + 数量 + 物", "py": "Wǒ yào ...", "vi": "Tôi gọi/lấy... (gọi món)"}], "preview_vocab": [{"hz": "可以", "vi": "có thể, được phép"}, {"hz": "给", "vi": "cho, đưa cho"}, {"hz": "请", "vi": "mời, làm ơn"}, {"hz": "一下", "vi": "một chút, thử"}, {"hz": "问题", "vi": "câu hỏi"}, {"hz": "茶", "vi": "trà"}, {"hz": "面包", "vi": "bánh mì"}], "warmup_type": "matching", "warmup": [{"zh": "面包 · 说 · 给", "py": "miànbāo · shuō · gěi", "vi": "bánh mì · nói · cho"}, {"zh": "茶 · 一半 · 请", "py": "chá · yíbàn · qǐng", "vi": "trà · một nửa · mời"}], "warmup_preview": [{"zh": "请给我一杯茶。", "py": "Qǐng gěi wǒ yì bēi chá.", "vi": "Làm ơn cho tôi một cốc trà."}, {"zh": "我可以坐这里吗？", "py": "Wǒ kěyǐ zuò zhèlǐ ma?", "vi": "Tôi có thể ngồi ở đây không?"}, {"zh": "你可以打电话问一下。", "py": "Nǐ kěyǐ dǎ diànhuà wèn yíxià.", "vi": "Bạn có thể gọi điện hỏi thử xem."}], "texts": [{"num": 1, "title": "在教室里 · Xin hỏi cô", "role": "Cốt lõi", "focus": "我可以再问您...吗？(可以) · 卖不卖...？· 问一下 (V+一下)", "scene": "Trong lớp học, sau giờ học, Bạch Gia Nguyệt hỏi cô Vương một câu hỏi.", "dialogue": [{"speaker": "家月", "zh": "王老师，我可以再问您一个问题吗？", "py": "Wáng lǎoshī, wǒ kěyǐ zài wèn nín yí gè wèntí ma?", "vi": "Cô Vương ơi, em có thể hỏi cô thêm một câu hỏi nữa không ạ?"}, {"speaker": "老师", "zh": "可以。你有什么问题？", "py": "Kěyǐ. Nǐ yǒu shénme wèntí?", "vi": "Được chứ. Em có câu hỏi gì?"}, {"speaker": "家月", "zh": "那个小店卖不卖手机？", "py": "Nàge xiǎodiàn mài bú mài shǒujī?", "vi": "Cửa hàng nhỏ kia có bán điện thoại không ạ?"}, {"speaker": "老师", "zh": "我不知道。你可以打电话问一下。", "py": "Wǒ bù zhīdào. Nǐ kěyǐ dǎ diànhuà wèn yíxià.", "vi": "Cô không biết. Em có thể gọi điện thoại hỏi thử xem."}], "tip": "💡 <b>我可以再问您一个问题吗？</b> là câu xin phép lịch sự; <b>问一下</b> (hỏi thử) khiến lời nói mềm hơn."}, {"num": 2, "title": "在咖啡馆 · Gọi bữa sáng", "role": "Mở rộng mẫu", "focus": "请给我一杯... (song tân ngữ) · 还要什么？· 再要...吧", "scene": "Trong quán cà phê, Vương Nhất Tuyết muốn ăn sáng.", "dialogue": [{"speaker": "服务员", "zh": "女士，请坐！您喝什么？", "py": "Nǚshì, qǐng zuò! Nín hē shénme?", "vi": "Thưa cô, mời ngồi! Cô dùng gì ạ?"}, {"speaker": "一雪", "zh": "请给我一杯牛奶。", "py": "Qǐng gěi wǒ yì bēi niúnǎi.", "vi": "Làm ơn cho tôi một ly sữa."}, {"speaker": "服务员", "zh": "好的。您还要什么？", "py": "Hǎo de. Nín hái yào shénme?", "vi": "Vâng ạ. Cô còn muốn gì nữa không?"}, {"speaker": "一雪", "zh": "我还没吃早饭，再要这个面包和鸡蛋吧。", "py": "Wǒ hái méi chī zǎofàn, zài yào zhège miànbāo hé jīdàn ba.", "vi": "Tôi vẫn chưa ăn sáng, lấy thêm bánh mì và trứng này nhé."}]}, {"num": 3, "title": "在餐馆里 · Gọi món", "role": "Tái sử dụng", "focus": "我要一斤... · 太多了 · 我要一半吧 · 请给我一杯茶吧", "scene": "Tại nhà hàng, Lưu Minh đang gọi món.", "dialogue": [{"speaker": "服务员", "zh": "先生，请坐！您要什么？", "py": "Xiānsheng, qǐng zuò! Nín yào shénme?", "vi": "Thưa ông, mời ngồi! Ông muốn dùng món gì ạ?"}, {"speaker": "明", "zh": "我要一斤饺子。", "py": "Wǒ yào yì jīn jiǎozi.", "vi": "Tôi muốn một cân sủi cảo."}, {"speaker": "服务员", "zh": "好的。一斤饺子四十个。", "py": "Hǎo de. Yì jīn jiǎozi sìshí gè.", "vi": "Vâng ạ. Một cân sủi cảo có 40 cái."}, {"speaker": "明", "zh": "四十个太多了，我要一半吧。", "py": "Sìshí gè tài duō le, wǒ yào yíbàn ba.", "vi": "40 cái nhiều quá, tôi lấy một nửa nhé."}, {"speaker": "服务员", "zh": "好的。您想喝什么？", "py": "Hǎo de. Nín xiǎng hē shénme?", "vi": "Vâng ạ. Ông muốn uống gì?"}, {"speaker": "明", "zh": "请给我一杯茶吧。", "py": "Qǐng gěi wǒ yì bēi chá ba.", "vi": "Làm ơn cho tôi một cốc trà nhé."}]}], "hanzi_chars": ["可", "以", "问", "题", "卖", "给", "请", "坐", "杯", "早", "包", "鸡", "蛋", "先", "生", "半", "饺", "茶"], "grammar": [{"title": "能愿动词 “可以” · Động từ năng nguyện 可以", "structure": "主语 + 可以 + 动词 + 宾语　(hỏi: ... 可以 ... 吗？)", "exp": "可以 đứng trước động từ để biểu thị được phép làm gì, xin phép làm gì, hoặc có thể thực hiện một hành động.", "examples": [{"zh": "我可以再问您一个问题吗？", "py": "Wǒ kěyǐ zài wèn nín yí gè wèntí ma?", "vi": "Tôi có thể hỏi ngài thêm một câu hỏi nữa không?"}, {"zh": "你们可以看这本书。", "py": "Nǐmen kěyǐ kàn zhè běn shū.", "vi": "Các bạn có thể đọc quyển sách này."}, {"zh": "我可以坐这里吗？", "py": "Wǒ kěyǐ zuò zhèlǐ ma?", "vi": "Tôi có thể ngồi ở đây không?"}]}, {"title": "“动词 + 一下” · V + 一下 (làm thử/một chút)", "structure": "动词 + 一下", "exp": "一下 đứng sau động từ để diễn tả hành động trong thời gian ngắn, mang sắc thái \"thử xem\", làm lời đề nghị nhẹ nhàng, lịch sự hơn.", "examples": [{"zh": "坐一下。", "py": "Zuò yíxià.", "vi": "Ngồi một lát."}, {"zh": "看一下吧。", "py": "Kàn yíxià ba.", "vi": "Xem thử nhé."}, {"zh": "你可以打电话问一下。", "py": "Nǐ kěyǐ dǎ diànhuà wèn yíxià.", "vi": "Bạn có thể gọi điện hỏi thử xem."}]}, {"title": "双宾语句（1）· Câu song tân ngữ", "structure": "主语 + 动词 + 人 (tân ngữ 1) + 物/问题 (tân ngữ 2)", "exp": "Một số động từ (给, 问...) đi với hai tân ngữ: tân ngữ 1 = người nhận/người được hỏi, tân ngữ 2 = đồ vật/thông tin. Mẹo: 给 + người + vật; 问 + người + câu hỏi.", "examples": [{"zh": "请给我一杯茶。", "py": "Qǐng gěi wǒ yì bēi chá.", "vi": "Làm ơn cho tôi một cốc trà. (我=người nhận, 一杯茶=vật)"}, {"zh": "我想问老师一个问题。", "py": "Wǒ xiǎng wèn lǎoshī yí gè wèntí.", "vi": "Tôi muốn hỏi giáo viên một câu hỏi."}, {"zh": "老师给我们两本书。", "py": "Lǎoshī gěi wǒmen liǎng běn shū.", "vi": "Giáo viên cho chúng tôi hai quyển sách."}]}], "exercises": [{"type": 1, "title": "1. 找不同类词 · Chọn từ khác loại", "prompt": "Trong 4 từ sau, từ nào KHÔNG phải đồ ăn/thức uống?", "options": [{"hz": "茶", "py": "chá", "correct": false}, {"hz": "面包", "py": "miànbāo", "correct": false}, {"hz": "问题", "py": "wèntí", "correct": true}, {"hz": "鸡蛋", "py": "jīdàn", "correct": false}], "ok_msg": "Chính xác! 问题 (câu hỏi) không phải đồ ăn/uống, còn lại đều là.", "bad_msg": "Chưa đúng. 问题 là \"câu hỏi\", khác nhóm với 茶/面包/鸡蛋."}, {"type": 2, "title": "2. 判断逻辑正误 · Đúng hay sai", "prompt": "“可以” đứng trước động từ để xin phép/được phép. Nhận định này đúng hay sai?", "stem": "“可以 + 动词” 表示允许或请求许可：我可以坐这里吗？", "stem_py": "“Kěyǐ + dòngcí” biǎoshì yǔnxǔ huò qǐngqiú xǔkě: wǒ kěyǐ zuò zhèlǐ ma?", "options": [{"hz": "对", "py": "duì", "correct": true}, {"hz": "错", "py": "cuò", "correct": false}], "ok_msg": "Chính xác! 可以 + động từ = được phép/xin phép: 我可以坐这里吗？", "bad_msg": "Chưa đúng — 可以 + động từ dùng để xin phép/được phép."}, {"type": 3, "title": "3. 选词填空 · Chọn từ điền vào chỗ trống", "prompt": "Chọn từ thích hợp điền vào chỗ trống:", "stem": "请 ____ 我一杯茶。", "stem_py": "Qǐng ____ wǒ yì bēi chá.", "options": [{"hz": "给", "py": "gěi", "correct": true}, {"hz": "可以", "py": "kěyǐ", "correct": false}, {"hz": "一下", "py": "yíxià", "correct": false}], "ok_msg": "Chính xác! 请给我一杯茶 — song tân ngữ (给 + người + vật).", "bad_msg": "Chưa đúng. \"Cho tôi...\" dùng 给: 请给我一杯茶。"}, {"type": 4, "title": "4. 连词成句 · Sắp xếp câu từ thẻ Pinyin", "prompt": "Nghĩa cần diễn đạt: \"Làm ơn cho tôi một cốc trà.\" — Bấm các mảnh Pinyin theo thứ tự đúng:", "tokens": ["Qǐng", "gěi", "wǒ", "yì bēi", "chá", "。"], "correct_order": ["Qǐng", "gěi", "wǒ", "yì bēi", "chá", "。"], "ok_msg": "Rất tốt! 请给我一杯茶。"}, {"type": 5, "title": "5. 看文本回答 · Đọc đoạn văn trả lời", "prompt": "Đọc đoạn hội thoại rồi trả lời câu hỏi:", "passage_lines": [{"zh": "服务员：一斤饺子四十个。", "py": "Fúwùyuán: Yì jīn jiǎozi sìshí gè."}, {"zh": "明：四十个太多了，我要一半吧。", "py": "Míng: Sìshí gè tài duō le, wǒ yào yíbàn ba."}], "question": "Lưu Minh cuối cùng gọi bao nhiêu sủi cảo?", "options": [{"hz": "一半", "py": "yíbàn", "correct": true}, {"hz": "四十个", "py": "sìshí gè", "correct": false}, {"hz": "一杯", "py": "yì bēi", "correct": false}], "ok_msg": "Chính xác! 我要一半吧 — anh ấy lấy một nửa (vì 40 cái quá nhiều).", "bad_msg": "Đọc lại: \"四十个太多了，我要一半吧\" — lấy một nửa."}, {"type": 6, "title": "6. 完成对话 · Hoàn thành hội thoại", "prompt": "Chọn câu phù hợp để hoàn thành hội thoại:", "stem": "服务员：您喝什么？<br>顾客：____", "stem_py": "Fúwùyuán: Nín hē shénme?  Gùkè: ____", "options": [{"hz": "请给我一杯牛奶。", "py": "Qǐng gěi wǒ yì bēi niúnǎi.", "correct": true}, {"hz": "那个小店卖不卖手机？", "py": "Nàge xiǎodiàn mài bú mài shǒujī?", "correct": false}, {"hz": "我可以坐这里吗？", "py": "Wǒ kěyǐ zuò zhèlǐ ma?", "correct": false}], "ok_msg": "Chính xác! Trả lời 您喝什么 bằng: 请给我一杯牛奶 (gọi đồ uống).", "bad_msg": "Chưa đúng. Câu hỏi 您喝什么？ cần gọi đồ uống: 请给我一杯..."}], "recall": [{"hz": "可以", "py": "kěyǐ", "vi": "có thể, được phép"}, {"hz": "再", "py": "zài", "vi": "lại, nữa"}, {"hz": "问题", "py": "wèntí", "vi": "câu hỏi"}, {"hz": "卖", "py": "mài", "vi": "bán"}, {"hz": "一下", "py": "yíxià", "vi": "một chút, thử"}, {"hz": "请", "py": "qǐng", "vi": "mời, làm ơn"}, {"hz": "给", "py": "gěi", "vi": "cho, đưa"}, {"hz": "杯", "py": "bēi", "vi": "cốc, ly"}, {"hz": "面包", "py": "miànbāo", "vi": "bánh mì"}, {"hz": "鸡蛋", "py": "jīdàn", "vi": "trứng gà"}, {"hz": "一半", "py": "yíbàn", "vi": "một nửa"}, {"hz": "茶", "py": "chá", "vi": "trà"}], "final_use": {"intro": "Ghép lại thành một màn gọi món hoàn chỉnh, dùng 可以 (xin phép) · 给+人+物 (song tân ngữ) · V+一下 · 要 (gọi món).", "dialogue": [{"who": "NV", "zh": "先生，请坐！您要什么？", "py": "Xiānsheng, qǐng zuò! Nín yào shénme?"}, {"who": "Khách", "zh": "我可以看一下吗？请给我一杯茶。", "py": "Wǒ kěyǐ kàn yíxià ma? Qǐng gěi wǒ yì bēi chá."}, {"who": "NV", "zh": "好的。您还要什么？", "py": "Hǎo de. Nín hái yào shénme?"}, {"who": "Khách", "zh": "再要一斤饺子吧。", "py": "Zài yào yì jīn jiǎozi ba."}], "task": "Đóng vai khách và nhân viên: xin phép bằng 可以...吗, xem thực đơn bằng 看一下, gọi đồ uống bằng 请给我..., và gọi món bằng 我要.... Đọc to cả đoạn, rồi đổi vai."}}, "14": {"id": 14, "title_vi": "Tôi đã xem một bộ phim", "title_zh": "我看了一个电影", "can_do": "Sau bài học này, bạn có thể dùng 了 để nói việc đã hoàn thành, dùng 想 để nói mong muốn, dùng 觉得 để nêu cảm nhận/ý kiến, và kể lại đơn giản một việc đã làm.", "goals": ["动作完成 · Dùng 了 (sau động từ) để biểu thị hành động đã hoàn thành/đã xảy ra.", "表达愿望 · Dùng 想 + 动词 để nói mong muốn làm gì.", "表达看法 · Dùng 觉得 để nêu cảm nhận, ý kiến, đánh giá.", "叙述 · Kể lại đơn giản một việc đã làm (xem phim, đi chơi...)."], "core_patterns": [{"zh": "S + V + 了 + (数量) + 宾语", "py": "... V le ...", "vi": "Đã làm gì (hoàn thành)"}, {"zh": "S + 想 + V", "py": "... xiǎng ...", "vi": "Muốn làm gì"}, {"zh": "S + 觉得 + [nhận xét]", "py": "... juéde ...", "vi": "Cảm thấy / cho rằng..."}, {"zh": "V + 了 吗？ / 没 + V", "py": "... le ma? / méi ...", "vi": "Đã...chưa? / chưa..."}], "preview_vocab": [{"hz": "了", "vi": "rồi (đã xong)"}, {"hz": "觉得", "vi": "cảm thấy"}, {"hz": "有意思", "vi": "thú vị"}, {"hz": "电影", "vi": "bộ phim"}, {"hz": "想", "vi": "muốn"}, {"hz": "跟", "vi": "cùng với"}, {"hz": "一起", "vi": "cùng nhau"}], "warmup_type": "matching", "warmup": [{"zh": "电影 · 有意思 · 一起", "py": "diànyǐng · yǒuyìsi · yìqǐ", "vi": "phim · thú vị · cùng nhau"}, {"zh": "跟 · 觉得 · 好玩儿", "py": "gēn · juéde · hǎowánr", "vi": "cùng với · cảm thấy · vui/hay"}], "warmup_preview": [{"zh": "我看了一个电影。", "py": "Wǒ kàn le yí gè diànyǐng.", "vi": "Tôi đã xem một bộ phim."}, {"zh": "我觉得很有意思。", "py": "Wǒ juéde hěn yǒuyìsi.", "vi": "Tôi thấy rất thú vị."}, {"zh": "我想跟你一起去。", "py": "Wǒ xiǎng gēn nǐ yìqǐ qù.", "vi": "Tôi muốn đi cùng bạn."}], "texts": [{"num": 1, "title": "在学校 · Kể chuyện xem phim", "role": "Cốt lõi", "focus": "昨天...做什么了？· 看了一个电影 (了) · 觉得...有意思", "scene": "Trên sân trường, Bạch Gia Nguyệt và Lý Văn nói về chuyện cuối tuần.", "dialogue": [{"speaker": "家月", "zh": "李文，你昨天做什么了？", "py": "Lǐ Wén, nǐ zuótiān zuò shénme le?", "vi": "Lý Văn, hôm qua bạn đã làm gì?"}, {"speaker": "李文", "zh": "我看了一个电影。", "py": "Wǒ kàn le yí gè diànyǐng.", "vi": "Mình đã xem một bộ phim."}, {"speaker": "家月", "zh": "电影怎么样？", "py": "Diànyǐng zěnmeyàng?", "vi": "Phim thế nào?"}, {"speaker": "李文", "zh": "我觉得很有意思。", "py": "Wǒ juéde hěn yǒuyìsi.", "vi": "Mình thấy rất thú vị."}], "tip": "💡 <b>做什么了？</b> và <b>看了</b> — trợ từ 了 cho biết hành động đã hoàn thành/đã xảy ra."}, {"num": 2, "title": "在教室里 · Rủ đi cùng", "role": "Mở rộng mẫu", "focus": "想不想...？· 我也想看 · 跟...一起去 (跟…一起)", "scene": "Trong lớp học, Bạch Gia Nguyệt rủ Trần Thiên Trung đi xem phim.", "dialogue": [{"speaker": "家月", "zh": "天中，你想不想看电影？", "py": "Tiānzhōng, nǐ xiǎng bù xiǎng kàn diànyǐng?", "vi": "Thiên Trung, bạn có muốn xem phim không?"}, {"speaker": "天中", "zh": "想，我也想看。", "py": "Xiǎng, wǒ yě xiǎng kàn.", "vi": "Có, mình cũng muốn xem."}, {"speaker": "家月", "zh": "那我们晚上一起去吧。", "py": "Nà wǒmen wǎnshang yìqǐ qù ba.", "vi": "Vậy tối nay chúng mình đi cùng nhau nhé."}, {"speaker": "天中", "zh": "好，我跟你一起去。", "py": "Hǎo, wǒ gēn nǐ yìqǐ qù.", "vi": "Được, mình đi cùng bạn."}], "tip": "💡 <b>跟 + người + 一起 + động từ</b> = làm gì cùng với ai: 我跟你一起去 (mình đi cùng bạn)."}, {"num": 3, "title": "看电影后 · Sau khi xem phim", "role": "Tái sử dụng", "focus": "电影好看吗？· 我觉得... · 你呢？· 也觉得...", "scene": "Sau khi xem phim, Bạch Gia Nguyệt và Trần Thiên Trung trò chuyện về bộ phim.", "dialogue": [{"speaker": "家月", "zh": "这个电影好看吗？", "py": "Zhège diànyǐng hǎokàn ma?", "vi": "Bộ phim này có hay không?"}, {"speaker": "天中", "zh": "我觉得很好看，很有意思。你呢？", "py": "Wǒ juéde hěn hǎokàn, hěn yǒuyìsi. Nǐ ne?", "vi": "Mình thấy rất hay, rất thú vị. Còn bạn?"}, {"speaker": "家月", "zh": "我也觉得很好看。", "py": "Wǒ yě juéde hěn hǎokàn.", "vi": "Mình cũng thấy rất hay."}, {"speaker": "天中", "zh": "下次我们再一起来吧。", "py": "Xiàcì wǒmen zài yìqǐ lái ba.", "vi": "Lần sau chúng mình lại đi cùng nhau nhé."}]}], "hanzi_chars": ["了", "看", "电", "影", "觉", "得", "意", "思", "想", "跟", "一", "起", "次", "再", "来", "好", "玩"], "grammar": [{"title": "动态助词 “了” · Trợ từ 了 (hành động hoàn thành)", "structure": "主语 + 动词 + 了 (+ 数量 + 宾语)　·　phủ định: 主语 + 没 + 动词", "exp": "了 đặt SAU động từ biểu thị hành động đã hoàn thành/đã xảy ra. Phủ định dùng 没 + động từ (bỏ 了): 我没看电影.", "examples": [{"zh": "我看了一个电影。", "py": "Wǒ kàn le yí gè diànyǐng.", "vi": "Tôi đã xem một bộ phim."}, {"zh": "我买了两斤苹果。", "py": "Wǒ mǎi le liǎng jīn píngguǒ.", "vi": "Tôi đã mua hai cân táo."}, {"zh": "我没看电影。", "py": "Wǒ méi kàn diànyǐng.", "vi": "Tôi chưa/không xem phim."}]}, {"title": "动词 “觉得” · Động từ 觉得", "structure": "主语 + 觉得 + [cụm chủ-vị / tính từ]", "exp": "觉得 dùng để nêu cảm nhận, ý kiến, đánh giá chủ quan của người nói về một sự việc.", "examples": [{"zh": "我觉得很有意思。", "py": "Wǒ juéde hěn yǒuyìsi.", "vi": "Tôi thấy rất thú vị."}, {"zh": "我觉得这个电影很好看。", "py": "Wǒ juéde zhège diànyǐng hěn hǎokàn.", "vi": "Tôi thấy bộ phim này rất hay."}, {"zh": "我觉得有点儿贵。", "py": "Wǒ juéde yǒudiǎnr guì.", "vi": "Tôi thấy hơi đắt."}]}, {"title": "“跟……一起” · Cùng với ai làm gì", "structure": "主语 + 跟 + người + 一起 + 动词", "exp": "跟 + người + 一起 + động từ biểu thị cùng làm một việc với ai đó.", "examples": [{"zh": "我跟你一起去。", "py": "Wǒ gēn nǐ yìqǐ qù.", "vi": "Tôi đi cùng bạn."}, {"zh": "他跟朋友一起看电影。", "py": "Tā gēn péngyou yìqǐ kàn diànyǐng.", "vi": "Anh ấy xem phim cùng bạn bè."}, {"zh": "我想跟你们一起学习。", "py": "Wǒ xiǎng gēn nǐmen yìqǐ xuéxí.", "vi": "Tôi muốn học cùng các bạn."}]}], "exercises": [{"type": 1, "title": "1. 找不同类词 · Chọn từ khác loại", "prompt": "Trong 4 từ sau, từ nào KHÔNG phải động từ?", "options": [{"hz": "看", "py": "kàn", "correct": false}, {"hz": "想", "py": "xiǎng", "correct": false}, {"hz": "有意思", "py": "yǒuyìsi", "correct": true}, {"hz": "觉得", "py": "juéde", "correct": false}], "ok_msg": "Chính xác! 有意思 (thú vị) là tính từ, còn lại là động từ.", "bad_msg": "Chưa đúng. 有意思 là tính từ, khác nhóm với 看/想/觉得."}, {"type": 2, "title": "2. 判断逻辑正误 · Đúng hay sai", "prompt": "“了” đặt sau động từ để nói hành động đã hoàn thành. Nhận định này đúng hay sai?", "stem": "动词 + 了 表示动作完成：我看了一个电影。", "stem_py": "Dòngcí + le biǎoshì dòngzuò wánchéng: wǒ kàn le yí gè diànyǐng.", "options": [{"hz": "对", "py": "duì", "correct": true}, {"hz": "错", "py": "cuò", "correct": false}], "ok_msg": "Chính xác! 动词 + 了 = đã hoàn thành: 我看了一个电影。", "bad_msg": "Chưa đúng — 了 sau động từ biểu thị hành động đã hoàn thành."}, {"type": 3, "title": "3. 选词填空 · Chọn từ điền vào chỗ trống", "prompt": "Chọn từ thích hợp điền vào chỗ trống:", "stem": "我 ____ 这个电影很有意思。", "stem_py": "Wǒ ____ zhège diànyǐng hěn yǒuyìsi.", "options": [{"hz": "觉得", "py": "juéde", "correct": true}, {"hz": "跟", "py": "gēn", "correct": false}, {"hz": "一起", "py": "yìqǐ", "correct": false}], "ok_msg": "Chính xác! 我觉得这个电影很有意思 — nêu cảm nhận dùng 觉得.", "bad_msg": "Chưa đúng. Nêu cảm nhận/ý kiến dùng 觉得: 我觉得..."}, {"type": 4, "title": "4. 连词成句 · Sắp xếp câu từ thẻ Pinyin", "prompt": "Nghĩa cần diễn đạt: \"Tôi đã xem một bộ phim.\" — Bấm các mảnh Pinyin theo thứ tự đúng:", "tokens": ["Wǒ", "kàn", "le", "yí gè", "diànyǐng", "。"], "correct_order": ["Wǒ", "kàn", "le", "yí gè", "diànyǐng", "。"], "ok_msg": "Rất tốt! 我看了一个电影。"}, {"type": 5, "title": "5. 看文本回答 · Đọc đoạn văn trả lời", "prompt": "Đọc đoạn hội thoại rồi trả lời câu hỏi:", "passage_lines": [{"zh": "家月：李文，你昨天做什么了？", "py": "Jiāyuè: Lǐ Wén, nǐ zuótiān zuò shénme le?"}, {"zh": "李文：我看了一个电影，觉得很有意思。", "py": "Lǐ Wén: Wǒ kàn le yí gè diànyǐng, juéde hěn yǒuyìsi."}], "question": "Hôm qua Lý Văn đã làm gì?", "options": [{"hz": "看了一个电影", "py": "kàn le yí gè diànyǐng", "correct": true}, {"hz": "买了苹果", "py": "mǎi le píngguǒ", "correct": false}, {"hz": "去了超市", "py": "qù le chāoshì", "correct": false}], "ok_msg": "Chính xác! 我看了一个电影 — đã xem một bộ phim.", "bad_msg": "Đọc lại: \"我看了一个电影\" — xem phim."}, {"type": 6, "title": "6. 完成对话 · Hoàn thành hội thoại", "prompt": "Chọn câu phù hợp để hoàn thành hội thoại:", "stem": "A：你想不想看电影？<br>B：____", "stem_py": "A: Nǐ xiǎng bù xiǎng kàn diànyǐng?  B: ____", "options": [{"hz": "想，我也想看。", "py": "Xiǎng, wǒ yě xiǎng kàn.", "correct": true}, {"hz": "我看了一个电影。", "py": "Wǒ kàn le yí gè diànyǐng.", "correct": false}, {"hz": "这个电影多少钱？", "py": "Zhège diànyǐng duōshao qián?", "correct": false}], "ok_msg": "Chính xác! Trả lời 想不想 bằng: 想，我也想看 (câu chính phản với 想).", "bad_msg": "Chưa đúng. Câu hỏi 想不想看？ cần trả lời 想 / 不想."}], "recall": [{"hz": "了", "py": "le", "vi": "rồi (đã xong)"}, {"hz": "看", "py": "kàn", "vi": "xem"}, {"hz": "电影", "py": "diànyǐng", "vi": "bộ phim"}, {"hz": "觉得", "py": "juéde", "vi": "cảm thấy"}, {"hz": "有意思", "py": "yǒuyìsi", "vi": "thú vị"}, {"hz": "想", "py": "xiǎng", "vi": "muốn"}, {"hz": "跟", "py": "gēn", "vi": "cùng với"}, {"hz": "一起", "py": "yìqǐ", "vi": "cùng nhau"}, {"hz": "好看", "py": "hǎokàn", "vi": "hay, đẹp"}, {"hz": "下次", "py": "xiàcì", "vi": "lần sau"}, {"hz": "再", "py": "zài", "vi": "lại, nữa"}, {"hz": "来", "py": "lái", "vi": "đến"}], "final_use": {"intro": "Ghép lại thành một màn kể chuyện + rủ đi cùng, dùng 了 (đã làm) · 觉得 (cảm nhận) · 想 · 跟…一起.", "dialogue": [{"who": "A", "zh": "你昨天做什么了？", "py": "Nǐ zuótiān zuò shénme le?"}, {"who": "B", "zh": "我看了一个电影，觉得很有意思。", "py": "Wǒ kàn le yí gè diànyǐng, juéde hěn yǒuyìsi."}, {"who": "A", "zh": "我也想看！", "py": "Wǒ yě xiǎng kàn!"}, {"who": "B", "zh": "那下次我们一起去吧。", "py": "Nà xiàcì wǒmen yìqǐ qù ba."}], "task": "Kể một việc bạn ĐÃ làm hôm qua bằng 了 (我...了), nêu cảm nhận bằng 觉得, rồi rủ bạn cùng học đi làm gì đó bằng 跟…一起. Đọc to cả đoạn."}}, "15": {"id": 15, "title_vi": "Hẹn gặp ở sân bay Đại Hưng!", "title_zh": "大兴机场见！", "can_do": "Sau bài học này, bạn có thể nói về nguyện vọng và kế hoạch du lịch, dùng câu phức song song ……，还/也…… để bổ sung/liệt kê, dùng 爱 để nói sở thích, và dùng 都 để khái quát cả nhóm.", "goals": ["旅行计划 · Nghe hiểu và dùng từ vựng chủ đề du lịch để bày tỏ nguyện vọng, kế hoạch đi chơi.", "并列复句 · Nắm cách dùng câu phức song song ……，也…… và ……，还…… (bổ sung/liệt kê).", "文化 · Hiểu văn hóa bàn ăn, nghi thức đón khách và đôi nét về thủ đô Bắc Kinh."], "core_patterns": [{"zh": "……，(S) + 也 + V", "py": "..., ... yě ...", "vi": "..., cũng... (tương đồng)"}, {"zh": "……，(S) + 还 + V", "py": "..., ... hái ...", "vi": "..., còn... nữa (bổ sung)"}, {"zh": "S + 爱 + V/N", "py": "... ài ...", "vi": "Rất thích / yêu thích"}, {"zh": "S(nhóm) + 都 + ...", "py": "... dōu ...", "vi": "Đều... (khái quát cả nhóm)"}], "preview_vocab": [{"hz": "爱", "vi": "yêu, rất thích"}, {"hz": "飞机", "vi": "máy bay"}, {"hz": "机场", "vi": "sân bay"}, {"hz": "好玩儿", "vi": "vui, thú vị"}, {"hz": "去年", "vi": "năm ngoái"}, {"hz": "小时", "vi": "tiếng đồng hồ"}, {"hz": "住", "vi": "ở, cư trú"}], "warmup_type": "matching", "warmup": [{"zh": "北京 · 飞机 · 好玩儿", "py": "Běijīng · fēijī · hǎowánr", "vi": "Bắc Kinh · máy bay · thú vị"}, {"zh": "早饭 · 男朋友 · 早", "py": "zǎofàn · nánpéngyou · zǎo", "vi": "bữa sáng · bạn trai · sớm"}], "warmup_preview": [{"zh": "今年我想去北京。", "py": "Jīnnián wǒ xiǎng qù Běijīng.", "vi": "Năm nay tôi muốn đi Bắc Kinh."}, {"zh": "我喜欢吃这个，也喜欢吃那个。", "py": "Wǒ xǐhuan chī zhège, yě xǐhuan chī nàge.", "vi": "Tôi thích ăn món này, cũng thích món kia."}, {"zh": "我们在大兴机场见！", "py": "Wǒmen zài Dàxīng Jīchǎng jiàn!", "vi": "Hẹn gặp ở sân bay Đại Hưng!"}], "texts": [{"num": 1, "title": "在李文家 · Thưởng thức món Trung", "role": "Cốt lõi", "focus": "爱吃哪个菜？· 喜欢...，也喜欢... (并列 也) · 都很好吃", "scene": "Tại nhà Lý Văn, Lý Văn mời các bạn thưởng thức món ăn Trung Hoa.", "dialogue": [{"speaker": "李文", "zh": "你们爱吃哪个菜？", "py": "Nǐmen ài chī nǎge cài?", "vi": "Các bạn thích ăn món nào?"}, {"speaker": "家月", "zh": "我喜欢吃这个，也喜欢吃那个。", "py": "Wǒ xǐhuan chī zhège, yě xǐhuan chī nàge.", "vi": "Mình thích ăn món này, cũng thích ăn món kia nữa."}, {"speaker": "天中", "zh": "这些菜都很好吃，都很漂亮。", "py": "Zhèxiē cài dōu hěn hǎochī, dōu hěn piàoliang.", "vi": "Những món này đều rất ngon, cũng đều rất đẹp mắt."}, {"speaker": "李文", "zh": "我爱吃中国菜，也喜欢做。大家多吃点儿。", "py": "Wǒ ài chī Zhōngguócài, yě xǐhuan zuò. Dàjiā duō chī diǎnr.", "vi": "Mình rất thích ăn món Trung Quốc, cũng thích nấu nữa. Mọi người ăn nhiều một chút nhé."}], "tip": "💡 <b>爱</b> (ài) biểu thị sự yêu thích/hứng thú sâu sắc với sự vật, hoạt động — mạnh hơn 喜欢."}, {"num": 2, "title": "在李文家 · Kế hoạch kỳ nghỉ", "role": "Mở rộng mẫu", "focus": "都想去哪儿？· 去了西安 (了) · 今年也想去... · 都是北京人 (都)", "scene": "Tại nhà Lý Văn, mọi người vừa ăn cơm vừa trò chuyện về kế hoạch kỳ nghỉ.", "dialogue": [{"speaker": "李文", "zh": "你们都想去哪儿？", "py": "Nǐmen dōu xiǎng qù nǎr?", "vi": "Các bạn đều muốn đi đâu?"}, {"speaker": "安妮", "zh": "去年我和男朋友去了西安，今年我想去北京。", "py": "Qùnián wǒ hé nánpéngyou qùle Xī'ān, jīnnián wǒ xiǎng qù Běijīng.", "vi": "Năm ngoái mình và bạn trai đã đi Tây An, năm nay mình muốn đi Bắc Kinh."}, {"speaker": "家月", "zh": "前几年我去了西安，非常好玩儿。今年我也想去北京。", "py": "Qián jǐ nián wǒ qùle Xī'ān, fēichá /* AUDIO & SYNTHESIS */
const AUDIO_BASE = "https://static.xiehanzi.com/word_audios/";
let zhVoice = null;
function pickVoice() {
  if (window.speechSynthesis) {
    const vs = speechSynthesis.getVoices();
    zhVoice = vs.find(v => /zh(-|_)?(CN)?/i.test(v.lang)) || vs.find(v => /zh/i.test(v.lang)) || null;
  }
}
if (window.speechSynthesis) {
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;
}
function speak(text) {
  if (!window.speechSynthesis) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-CN';
    u.rate = 0.85;
    if (zhVoice) u.voice = zhVoice;
    speechSynthesis.speak(u);
  } catch(e) {}
}
function playAudio(text) {
  const clean = text.replace(/[，。！？、\s]/g, '');
  const a = new Audio(AUDIO_BASE + encodeURIComponent(clean) + ".mp3");
  let done = false;
  a.addEventListener('playing', () => done = true);
  a.addEventListener('error', () => { if (!done) speak(clean); });
  const p = a.play();
  if (p && p.catch) p.catch(() => { if (!done) speak(clean); });
  setTimeout(() => { if (!done) speak(clean); }, 1200);
}

/* PINYIN COLORING */
const TONE_MARKS = {'\u0304': 1, '\u0301': 2, '\u030c': 3, '\u0300': 4};
function sylTone(syl) {
  for (const ch of syl.normalize('NFD')) if (TONE_MARKS[ch]) return TONE_MARKS[ch];
  return 5;
}
function colorPy(pyStr) {
  if (!pyStr) return '';
  return pyStr.trim().split(/\s+/).map(s => `<span class="tone${sylTone(s)}">${s}</span>`).join(' ');
}

/* SIDEBAR & NAVIGATION */
function buildNav() {
  const nl = document.getElementById('nav-lessons');
  nl.innerHTML = '';
  DATA.lessons.forEach((l, idx) => {
    const item = document.createElement('div');
    item.className = 'nav-item' + (l.id === currentLessonId ? ' active' : '');
    item.onclick = () => selectLesson(l.id);
    item.innerHTML = `<span class="nav-num">${l.id}</span>
      <div class="nav-txt">${l.tv}</div>
      <span class="nav-count">${l.words.length} từ</span>`;
    nl.appendChild(item);
  });

  const nt = document.getElementById('nav-topics');
  nt.innerHTML = '';
  DATA.topics.forEach((tp, idx) => {
    const item = document.createElement('div');
    item.className = 'nav-item';
    item.onclick = () => selectTopic(tp.slug);
    item.innerHTML = `<span class="nav-num">${idx + 1}</span>
      <div class="nav-txt">${tp.title}</div>
      <span class="nav-count">${tp.words.length}</span>`;
    nt.appendChild(item);
  });

  const ng = document.getElementById('nav-grammar');
  ng.innerHTML = '';
  const item = document.createElement('div');
  item.className = 'nav-item active';
  item.onclick = selectGrammar;
  item.innerHTML = `<span class="nav-num">★</span>
    <div class="nav-txt">Toàn bộ 40 Ngữ pháp</div>
    <span class="nav-count">40</span>`;
  ng.appendChild(item);

  updateProgress();
}

function switchTab(sec) {
  currentSec = sec;
  document.querySelectorAll('.sec-tab').forEach(t => t.classList.toggle('active', t.dataset.sec === sec));
  document.querySelectorAll('.nav-list').forEach(l => l.classList.remove('active'));
  document.getElementById('nav-' + sec).classList.add('active');

  if (sec === 'lessons') selectLesson(currentLessonId);
  else if (sec === 'topics') selectTopic(DATA.topics[0].slug);
  else if (sec === 'grammar') selectGrammar();
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('backdrop').classList.toggle('show');
}

function selectLesson(id) {
  currentLessonId = id;
  document.querySelectorAll('#nav-lessons .nav-item').forEach((item, idx) => {
    item.classList.toggle('active', DATA.lessons[idx].id === id);
  });
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('backdrop').classList.remove('show');
  renderLesson(id);
}

function selectTopic(slug) {
  currentTopicSlug = slug;
  document.querySelectorAll('#nav-topics .nav-item').forEach((item, idx) => {
    item.classList.toggle('active', DATA.topics[idx].slug === slug);
  });
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('backdrop').classList.remove('show');
  renderTopic(slug);
}

function selectGrammar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('backdrop').classList.remove('show');
  renderGrammarAll();
}

/* PROGRESS TRACKING */
function toggleLearned(hz) {
  if (learnedWords.has(hz)) learnedWords.delete(hz);
  else learnedWords.add(hz);
  updateProgress();
}
function updateProgress() {
  const l = DATA.lessons.find(x => x.id === currentLessonId);
  if (!l) return;
  const total = l.words.length;
  let count = 0;
  l.words.forEach(w => { if (learnedWords.has(w.hz)) count++; });
  const pct = total ? Math.round(count / total * 100) : 0;
  document.getElementById('progText').textContent = `${count}/${total} · ${pct}%`;
  document.getElementById('progFill').style.width = pct + '%';
}

/* HANZI WRITER HELPERS */
const writers = {};
function initWriter(id, char) {
  if (writers[id]) return writers[id];
  const el = document.getElementById(id);
  if (!el) return null;
  el.innerHTML = '';
  writers[id] = HanziWriter.create(id, char, {
    width: 100,
    height: 100,
    padding: 4,
    showOutline: true,
    strokeAnimationSpeed: 1,
    delayBetweenStrokes: 200,
    strokeColor: '#013220',
    radicalColor: '#006D6F',
    outlineColor: '#E3DED0',
    drawingColor: '#007A74'
  });
  return writers[id];
}
function writerAction(id, char, act) {
  const w = initWriter(id, char);
  if (!w) return;
  if (act === 'animate') w.animateCharacter();
  else if (act === 'quiz') w.quiz();
  else { w.showOutline(); w.hideCharacter(); }
}

/* MODAL WRITER FOR MULTI-CHAR WORDS */
function cjkChars(str) { return Array.from(str).filter(c => /[\u3400-\u9FFF]/.test(c)); }
function openWriterModal(hz, py, vi) {
  document.getElementById('mZh').textContent = hz;
  document.getElementById('mPy').textContent = py;
  document.getElementById('mVi').textContent = vi;
  const row = document.getElementById('writerRow');
  row.innerHTML = '';
  const chars = cjkChars(hz);
  chars.forEach((c, idx) => {
    const d = document.createElement('div');
    d.className = 'writer-cell';
    d.id = `m-wc-${idx}`;
    row.appendChild(d);
    initWriter(`m-wc-${idx}`, c);
  });
  document.getElementById('mAnimate').onclick = () => { chars.forEach((c, idx) => writerAction(`m-wc-${idx}`, c, 'animate')); };
  document.getElementById('mQuiz').onclick = () => { chars.forEach((c, idx) => writerAction(`m-wc-${idx}`, c, 'quiz')); };
  document.getElementById('mReset').onclick = () => { chars.forEach((c, idx) => writerAction(`m-wc-${idx}`, c, 'reset')); };
  document.getElementById('modalBack').classList.add('show');
}
function closeWriterModal() { document.getElementById('modalBack').classList.remove('show'); }
document.getElementById('modalBack').onclick = (e) => { if (e.target === document.getElementById('modalBack')) closeWriterModal(); };

/* EXERCISES HELPERS */
function checkChoiceEx(btn, isOk, okMsg, badMsg, fbId) {
  const fb = document.getElementById(fbId);
  const grp = btn.parentElement;
  grp.querySelectorAll('.choice-chip').forEach(c => c.style.pointerEvents = 'none');

  } else {

const orderingState = {};
function initOrderingEx(exi, tokens, correctOrder) {
  orderingState[exi] = { picked: [], correctOrder: correctOrder, tokens: tokens };
  const tbox = document.getElementById(`tokens-ex-${exi}`);
  if (!tbox) return;
  tbox.innerHTML = '';
  const shuffled = tokens.slice().sort(() => Math.random() - 0.5);
  shuffled.forEach((tok, pos) => {
    const c = document.createElement('div');
    c.className = 'token-chip';
    c.textContent = tok;
    c.onclick = () => {
      if (!c.classList.contains('used')) {
        orderingState[exi].picked.push({ tok, pos });
        c.classList.add('used');
        renderOrderingZone(exi);
      }
    };
    tbox.appendChild(c);
  });
  renderOrderingZone(exi);
}
function renderOrderingZone(exi) {
  const z = document.getElementById(`zone-ex-${exi}`);
  if (!z) return;
  z.innerHTML = '';
  orderingState[exi].picked.forEach((p, i) => {
    const s = document.createElement('span');
    s.className = 'answer-slot';
    s.textContent = p.tok;
    s.onclick = () => {
      orderingState[exi].picked.splice(i, 1);
      const chips = document.querySelectorAll(`#tokens-ex-${exi} .token-chip`);
      chips.forEach(c => { if (c.textContent === p.tok && c.classList.contains('used')) c.classList.remove('used'); });
      renderOrderingZone(exi);
    };
    z.appendChild(s);
  });
}
function checkOrderingEx(exi) {
  const st = orderingState[exi];
  const fb = document.getElementById(`fb-ex-${exi}`);
  const user = st.picked.map(p => p.tok).join(' ');
  const target = st.correctOrder.join(' ');
  if (user === target) {
    fb.className = 'fb ok';
    fb.innerHTML = '✓ Chính xác! Rất tốt.';
  } else {
    fb.className = 'fb bad';
    fb.innerHTML = `✗ Chưa đúng. Đáp án: <b>${target}</b>`;
  }
}
function resetOrderingEx(exi) {
  const st = orderingState[exi];
  initOrderingEx(exi, st.tokens, st.correctOrder);
  const fb = document.getElementById(`fb-ex-${exi}`);
  if (fb) fb.style.display = 'none';
}

function scoreBar(st) {
  return `<div class="pr-scorebar">
    <span class="stat">Đúng: <b>${st.correct}</b></span>
    <span class="stat">Tổng: <b>${st.total}</b></span>
    <span class="stat">Độ chính xác: <b>${st.total ? Math.round(st.correct / st.total * 100) : 0}%</b></span>
  </div>`;
}

function renderPractice() {
  const L = DATA.lessons[prLessonIdx];
  const words = L.words;
  const sb = DATA.sentences[String(L.id)];
  prBody.innerHTML = '';

  if (prMode === 'type') return renderPrType(words);
  if (prMode === 'listen') return renderPrListen(words);
  if (prMode === 'tone') return renderPrTone(words);
  if (prMode === 'match') return renderPrMatch(words);
  if (prMode === 'choice') return renderPrChoice(sb, words);
  if (prMode === 'order') return renderPrOrder(sb);
  if (prMode === 'qa') return renderPrQA(sb);
}

function stripTones(s) { return s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, ' ').trim().toLowerCase(); }
function pyPlain(parts) { return parts.map(p => stripTones(p[0])).join(' '); }

function renderPrType(words) {
  const items = words.slice().sort(() => Math.random() - 0.5).slice(0, 10);
  const st = { correct: 0, total: 0 };
  const wrap = document.createElement('div');
  wrap.innerHTML = scoreBar(st) + '<p class="pr-empty" style="padding:0 0 10px; font-size:13px; color:var(--text-soft)">Nhìn chữ Hán, gõ <b>pinyin không dấu</b> rồi nhấn Enter.</p>';
  const sc = wrap.querySelector('.pr-scorebar');

  items.forEach(w => {
    const q = document.createElement('div');
    q.className = 'pr-q';
    q.innerHTML = `
      <div class="q-prompt"><span class="big">${w.hz}</span>
      </div>
      <input class="pr-input" placeholder="gõ pinyin không dấu, vd: ni hao">
      <div class="fb"></div>
    `;
    const inp = q.querySelector('input'), fb = q.querySelector('.fb');
    let done = false;
    inp.addEventListener('keydown', e => {
      if (e.key !== 'Enter' || done) return;
      const ans = stripTones(inp.value), corr = pyPlain(w.py);
      st.total++; done = true; inp.disabled = true;
      if (ans === corr) {
        st.correct++; inp.classList.add('ok'); fb.className = 'fb ok';
        fb.textContent = '✓ Chính xác: ' + w.py.map(p => p[0]).join(' ');
      } else {
        inp.classList.add('bad'); fb.className = 'fb bad';
        fb.textContent = '✗ Đáp án: ' + w.py.map(p => p[0]).join(' ') + ' (' + corr + ')';
      }
      sc.outerHTML = scoreBar(st);
    });
    wrap.appendChild(q);
  });
  prBody.appendChild(wrap);
}

function renderPrMatch(words) {
  const pool = words.slice().sort(() => Math.random() - 0.5).slice(0, 6);
  const st = { correct: 0, total: pool.length };
  const wrap = document.createElement('div');
  wrap.innerHTML = scoreBar(st) + '<p class="pr-empty" style="padding:0 0 10px; font-size:13px; color:var(--text-soft)">Bấm 1 ô Pinyin, rồi bấm ô Chữ Hán tương ứng.</p>';
  const grid = document.createElement('div'); grid.className = 'pr-match';
  const cP = document.createElement('div'), cV = document.createElement('div');
  cP.innerHTML = '<div class="col-h">Pinyin</div>'; cV.innerHTML = '<div class="col-h">Chữ Hán</div>';

  const pinyins = pool.slice().sort(() => Math.random() - 0.5);
  const hanzis = pool.slice().sort(() => Math.random() - 0.5);

  pinyins.forEach(w => {
    const t = document.createElement('div'); t.className = 'pr-mtile';
    t.dataset.hz = w.hz; t.textContent = w.py.map(p => p[0]).join(' ');
    cP.appendChild(t);
  });
  hanzis.forEach(w => {
    const t = document.createElement('div'); t.className = 'pr-mtile';
    t.dataset.hz = w.hz; t.textContent = w.hz;
    cV.appendChild(t);
  });

  grid.append(cP, cV); wrap.appendChild(grid);
  const fb = document.createElement('div'); fb.className = 'fb'; wrap.appendChild(fb);
  prBody.appendChild(wrap);

  const sc = wrap.querySelector('.pr-scorebar');
  let target = null;
  grid.querySelectorAll('.pr-mtile').forEach(tile => {
    tile.onclick = () => {
      if (tile.classList.contains('done')) return;
      const isColP = tile.parentElement === cP;
      if (isColP) {
        target = tile.dataset.hz;
        cP.querySelectorAll('.pr-mtile').forEach(x => x.classList.remove('pick'));
        tile.classList.add('pick');
      } else {
        if (!target) { fb.className = 'fb bad'; fb.textContent = 'Hãy chọn ô Pinyin bên trái trước.'; return; }
        if (tile.dataset.hz === target) {
          tile.classList.add('done');
          const pTile = cP.querySelector(`.pr-mtile[data-hz="${target}"]`);
          if (pTile) { pTile.classList.remove('pick'); pTile.classList.add('done'); }
          st.correct++; sc.outerHTML = scoreBar(st);
          fb.className = 'fb ok'; fb.textContent = '✓ Đúng!';
          target = null;
        } else {
          fb.className = 'fb bad'; fb.textContent = '✗ Chưa đúng, hãy thử lại.';
        }
      }
    };
  });
}

function renderPrChoice(sb, words) {
  if (!sb || !sb.sents || !sb.sents.length) {
    prBody.innerHTML = '<div style="text-align:center; padding:30px; color:var(--text-soft)">Bài này sử dụng các bài tập trong mục 综合练习.</div>';
    return;
  }
  const items = sb.sents.slice().sort(() => Math.random() - 0.5).slice(0, 5);
  const st = { correct: 0, total: 0 };
  const wrap = document.createElement('div');
  wrap.innerHTML = scoreBar(st) + '<p class="pr-empty" style="padding:0 0 10px; font-size:13px; color:var(--text-soft)">Chọn từ đúng để điền vào chỗ trống:</p>';
  const sc = wrap.querySelector('.pr-scorebar');

  items.forEach(s => {
    const q = document.createElement('div'); q.className = 'pr-q';
    const blanked = s.zh.replace(s.blank, '____');
    const others = words.filter(w => w.hz !== s.blank).sort(() => Math.random() - 0.5).slice(0, 2).map(w => w.hz);
    const choices = [s.blank, ...others].sort(() => Math.random() - 0.5);

    q.innerHTML = `
      <div class="q-prompt"><span class="big">${blanked}</span><span class="py">${s.py}</span>
      </div>
      <div class="chip-group"></div>
      <div class="fb"></div>
    `;
    const cwrap = q.querySelector('.chip-group'), fb = q.querySelector('.fb');
    let done = false;

    choices.forEach(c => {
      const b = document.createElement('button'); b.className = 'choice-chip'; b.textContent = c;
      b.onclick = () => {
        if (done) return;
        done = true; st.total++;
        if (c === s.blank) {
          b.classList.add('correct'); st.correct++; fb.className = 'fb ok'; fb.textContent = '✓ ' + s.zh;
        } else {
          b.classList.add('wrong'); fb.className = 'fb bad'; fb.textContent = '✗ Đáp án: ' + s.blank + ' → ' + s.zh;
        }
        cwrap.querySelectorAll('.choice-chip').forEach(x => x.style.pointerEvents = 'none');
        sc.outerHTML = scoreBar(st);
      };
      cwrap.appendChild(b);
    });
    wrap.appendChild(q);
  });
  prBody.appendChild(wrap);
}

function renderPrOrder(sb) {
  if (!sb || !sb.sents || !sb.sents.length) {
    prBody.innerHTML = '<div style="text-align:center; padding:30px; color:var(--text-soft)">Bài này sử dụng phần sắp xếp câu trong mục 综合练习.</div>';
    return;
  }
  const items = sb.sents.slice().sort(() => Math.random() - 0.5).slice(0, 4);
  const st = { correct: 0, total: 0 };
  const wrap = document.createElement('div');
  wrap.innerHTML = scoreBar(st) + '<p class="pr-empty" style="padding:0 0 10px; font-size:13px; color:var(--text-soft)">Bấm các mảnh Pinyin theo đúng thứ tự để tạo câu:</p>';
  const sc = wrap.querySelector('.pr-scorebar');

  items.forEach(s => {
    const q = document.createElement('div'); q.className = 'pr-q';
    const segs = s.segs;
    const order = segs.map((_, i) => i).sort(() => Math.random() - 0.5);

    q.innerHTML = `
      <div class="answer-zone"></div>
      <div class="token-container"></div>
      <div style="display:flex; gap:8px; margin-top:6px;">
        <button class="btn btn-primary btn-chk" style="padding:5px 12px; font-size:12px;">Kiểm tra</button>
        <button class="btn btn-outline btn-rst" style="padding:5px 12px; font-size:12px;">Làm lại</button>
      </div>
      <div class="fb"></div>
    `;
    const line = q.querySelector('.answer-zone'), tokBox = q.querySelector('.token-container'), fb = q.querySelector('.fb');

    let picked = [];
    function render() {
      tokBox.innerHTML = '';
      order.forEach((segIdx, pos) => {
        const used = picked.includes(pos);
        const b = document.createElement('div'); b.className = 'token-chip' + (used ? ' used' : '');
        b.textContent = segs[segIdx][1];
        b.onclick = () => { if (!used) { picked.push(pos); render(); } };
        tokBox.appendChild(b);
      });
      line.innerHTML = '';
      picked.forEach((pos, slotOrder) => {
        const segIdx = order[pos];
        const sp = document.createElement('span'); sp.className = 'answer-slot'; sp.textContent = segs[segIdx][1];
        sp.onclick = () => { picked.splice(slotOrder, 1); render(); };
        line.appendChild(sp);
      });
    }
    render();

    q.querySelector('.btn-rst').onclick = () => { picked = []; fb.style.display = 'none'; render(); };
    let done = false;
    q.querySelector('.btn-chk').onclick = () => {
      if (done) return;
      const chosen = picked.map(pos => order[pos]);
      const correct = segs.map((_, i) => i);
      const ok = chosen.length === correct.length && chosen.every((v, i) => v === correct[i]);
      st.total++;
      if (ok) {
        done = true; st.correct++; fb.className = 'fb ok';
        fb.innerHTML = '✓ ' + s.zh + ' · ' + segs.map(x => x[1]).join(' ');
      } else {
        fb.className = 'fb bad';
        fb.innerHTML = '✗ Đáp án: ' + segs.map(x => x[1]).join(' ') + ' → ' + s.zh;
      }
      sc.outerHTML = scoreBar(st);
    };
    wrap.appendChild(q);
  });
  prBody.appendChild(wrap);
}

function renderPrTone(words) {
  const items = words.slice().sort(() => Math.random() - 0.5).slice(0, 8);
  const st = { correct: 0, total: 0 };
  const wrap = document.createElement('div');
  wrap.innerHTML = scoreBar(st) + '<p class="pr-empty" style="padding:0 0 10px; font-size:13px; color:var(--text-soft)">Chọn thanh điệu cho từng âm tiết:</p>';
  const sc = wrap.querySelector('.pr-scorebar');

  items.forEach(w => {
    const q = document.createElement('div'); q.className = 'pr-q';
    const syls = w.py.map(p => p[0]);
    let row = '<div style="display:flex; gap:10px; margin:8px 0;">';
    syls.forEach((s, i) => {
      row += `<div style="display:flex; flex-direction:column; gap:4px; align-items:center;">
        <span style="font-size:14px; font-style:italic;">${stripTones(s)}</span>
        <select data-i="${i}" style="padding:4px 8px; border-radius:6px; border:1px solid var(--border);">
          <option value="0">?</option><option value="1">1 ¯</option><option value="2">2 ´</option><option value="3">3 ˇ</option><option value="4">4 \`</option><option value="5">Nhẹ</option>
        </select>
      </div>`;
    });
    row += '</div>';

    q.innerHTML = `
      <div class="q-prompt"><span class="big">${w.hz}</span>
      </div>
      ${row}
      <div style="margin-top:6px;"><button class="btn btn-outline chk" style="padding:4px 10px; font-size:12px;">Kiểm tra</button></div>
      <div class="fb"></div>
    `;
    const fb = q.querySelector('.fb');
    let done = false;

    q.querySelector('.chk').onclick = () => {
      if (done) return;
      done = true; st.total++;
      let ok = true;
      const sels = q.querySelectorAll('select');
      sels.forEach((sel, i) => {
        const want = w.py[i][1], got = +sel.value;
        if (got !== want) ok = false;
        sel.disabled = true;
      });
      if (ok) {
        st.correct++; fb.className = 'fb ok'; fb.textContent = '✓ ' + w.py.map(p => p[0]).join(' ');
      } else {
        fb.className = 'fb bad'; fb.textContent = '✗ Đáp án: ' + w.py.map(p => p[0]).join(' ');
      }
      sc.outerHTML = scoreBar(st);
    };
    wrap.appendChild(q);
  });
  prBody.appendChild(wrap);
}

function renderPrQA(sb) {
  if (!sb || !sb.qa || !sb.qa.length) {
    prBody.innerHTML = '<div style="text-align:center; padding:30px; color:var(--text-soft)">Bài này sử dụng các bài tập trong mục 综合练习.</div>';
    return;
  }
  const pairs = sb.qa.slice(0, 4);
  const st = { correct: 0, total: pairs.length };
  const wrap = document.createElement('div');
  wrap.innerHTML = scoreBar(st) + '<p class="pr-empty" style="padding:0 0 10px; font-size:13px; color:var(--text-soft)">Bấm 1 câu hỏi bên trái, rồi bấm câu trả lời đúng bên phải (hán tự + pinyin):</p>';
  const sc = wrap.querySelector('.pr-scorebar');

  const grid = document.createElement('div'); grid.className = 'pr-match';
  const cQ = document.createElement('div'), cA = document.createElement('div');
  cQ.innerHTML = '<div class="col-h">Câu hỏi</div>'; cA.innerHTML = '<div class="col-h">Trả lời</div>';

  pairs.forEach((p, i) => {
    const t = document.createElement('div'); t.className = 'pr-mtile'; t.dataset.i = i;
    t.innerHTML = `<div style="font-weight:700; color:var(--forest);">${p.q_zh}</div><div class="tone-py" style="font-size:11px; color:var(--text-soft);">${colorPy(p.q_py)}</div>`;
    cQ.appendChild(t);
  });
  pairs.slice().sort(() => Math.random() - 0.5).forEach(p => {
    const origIdx = pairs.indexOf(p);
    const t = document.createElement('div'); t.className = 'pr-mtile'; t.dataset.i = origIdx;
    t.innerHTML = `<div style="font-weight:700; color:var(--forest);">${p.a_zh}</div><div class="tone-py" style="font-size:11px; color:var(--text-soft);">${colorPy(p.a_py)}</div>`;
    cA.appendChild(t);
  });

  grid.append(cQ, cA); wrap.appendChild(grid);
  const fb = document.createElement('div'); fb.className = 'fb'; wrap.appendChild(fb);
  prBody.appendChild(wrap);

  let pickQ = null;
  cQ.querySelectorAll('.pr-mtile').forEach(t => {
    t.onclick = () => {
      cQ.querySelectorAll('.pr-mtile').forEach(x => x.classList.remove('pick'));
      t.classList.add('pick');
      pickQ = t.dataset.i;
    };
  });
  cA.querySelectorAll('.pr-mtile').forEach(t => {
    t.onclick = () => {
      if (pickQ === null) { fb.className = 'fb bad'; fb.textContent = 'Hãy chọn câu hỏi bên trái trước.'; return; }
      if (t.dataset.i === pickQ) {
        t.classList.add('done');
        const qTile = cQ.querySelector(`.pr-mtile[data-i="${pickQ}"]`);
        if (qTile) { qTile.classList.remove('pick'); qTile.classList.add('done'); }
        st.correct++; sc.outerHTML = scoreBar(st);
        fb.className = 'fb ok'; fb.textContent = '✓ Đúng!';
        pickQ = null;
      } else {
        fb.className = 'fb bad'; fb.textContent = '✗ Chưa đúng, hãy thử lại.';
      }
    };
  });
}

/* PINYIN TOGGLE */
function togglePinyin() {
  pinyinVisible = !pinyinVisible;
  document.querySelectorAll('.py-row').forEach(el => {
    el.style.display = pinyinVisible ? '' : 'none';
  });
  document.getElementById('btnTogglePy')?.classList.toggle('on', !pinyinVisible);
}

/* SCROLL HELPER */
function scrollToSec(id) {
  const el = document.getElementById(id);
  if (el) el.scrollIntoView({ behavior: 'smooth' });
}

/* INITIALIZATION */
window.addEventListener('DOMContentLoaded', () => {
  buildNav();
  renderLesson(1);
});
</script>
