<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Khóa học Toàn diện New HSK 1 (3.0) · 15 Bài học</title>
<script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
<style>
:root {
  --forest: #013220; --moss: #006D6F; --teal: #007A74;
  --mint: #D8BFD8; --sage: #F5F5DC; --sand: #FFFAF0; --shell: #FFF5EE; --white: #FFFAFA;
  --blue: #2563EB; --blue-light: #EFF6FF;
  --amber: #D97706; --amber-light: #FFFBEB;
  --red: #DC2626; --red-light: #FEF2F2; --green-success: #16A34A; --green-light: #F0FDF4;
  --text-dark: #013220; --text-mid: #006D6F; --text-soft: #5F8A80;
  --border: #E3DED0;
  --shadow-sm: 0 1px 3px rgba(1,50,32,.08);
  --shadow-md: 0 4px 16px rgba(1,50,32,.12);
  --shadow-lg: 0 8px 32px rgba(1,50,32,.16);
  --radius: 12px; --radius-sm: 8px; --radius-lg: 20px;
  --t1: #c0392b; --t2: #d19a00; --t3: #1f8a4c; --t4: #2657c9; --t5: #8a8f99;
  font-size: 16px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  color: var(--text-dark);
  line-height: 1.6;
  background: var(--sand);
}
a { color: inherit; text-decoration: none; }

/* App Shell */
.app-shell { display: flex; min-height: 100vh; }

/* Sidebar */
.sidebar {
  width: 270px;
  flex-shrink: 0;
  background: var(--forest);
  color: var(--white);
  position: fixed;
  top: 0;
  left: 0;
  height: 100vh;
  display: flex;
  flex-direction: column;
  z-index: 100;
  transition: transform .25s ease;
}
.brand {
  padding: 20px 20px 14px;
  border-bottom: 1px solid rgba(255,255,255,.1);
}
.level-badge {
  display: inline-block;
  background: rgba(216,191,216,.2);
  color: var(--mint);
  border: 1px solid rgba(216,191,216,.3);
  font-size: 10px;
  font-weight: 800;
  letter-spacing: .5px;
  padding: 3px 9px;
  border-radius: 99px;
  text-transform: uppercase;
}
.brand h1 { font-size: 16px; font-weight: 800; margin-top: 8px; color: #fff; line-height: 1.3; }
.brand .cat { font-size: 12px; color: var(--mint); opacity: .85; margin-top: 2px; }

/* Section Tabs */
.sec-tabs { display: flex; gap: 2px; padding: 10px 12px 0; border-bottom: 1px solid rgba(255,255,255,.1); }
.sec-tab {
  flex: 1;
  text-align: center;
  font-size: 12px;
  font-weight: 700;
  padding: 8px 4px;
  color: rgba(255,255,255,.65);
  border-radius: 8px 8px 0 0;
  cursor: pointer;
  transition: all .2s;
}
.sec-tab.active { background: rgba(216,191,216,.18); color: #fff; border-bottom: 2px solid var(--mint); }
.sec-tab:hover:not(.active) { color: #fff; }

.nav { flex: 1; overflow-y: auto; padding: 8px 0 10px; }
.nav-list { display: none; }
.nav-list.active { display: block; }
.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 18px;
  font-size: 13px;
  font-weight: 500;
  color: rgba(255,255,255,.75);
  cursor: pointer;
  border-left: 3px solid transparent;
  transition: all .2s;
}
.nav-item:hover { background: rgba(216,191,216,.08); color: #fff; }
.nav-item.active {
  background: rgba(216,191,216,.15);
  color: #fff;
  border-left-color: var(--mint);
  font-weight: 700;
}
.nav-num {
  width: 24px;
  height: 24px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(255,255,255,.1);
  border-radius: 6px;
  font-size: 11px;
  font-weight: 800;
}
.nav-item.active .nav-num { background: var(--mint); color: var(--forest); }
.nav-txt { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav-count { font-size: 11px; color: rgba(216,191,216,.7); }

.progress-wrap { padding: 12px 20px; border-top: 1px solid rgba(255,255,255,.1); }
.progress-wrap .lbl { font-size: 11px; color: rgba(255,255,255,.7); margin-bottom: 6px; display: flex; justify-content: space-between; }
.progress-track { height: 6px; background: rgba(255,255,255,.1); border-radius: 99px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--mint); width: 0; transition: width .5s ease; }

/* Main Content Area */
.main { flex: 1; margin-left: 270px; min-width: 0; }
.topbar {
  display: none;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  background: var(--forest);
  color: #fff;
  position: sticky;
  top: 0;
  z-index: 90;
}
.hamburger { font-size: 22px; cursor: pointer; background: none; border: none; color: #fff; line-height: 1; }
.topbar .tt { font-size: 15px; font-weight: 700; }

/* Hero */
.hero {
  background: linear-gradient(135deg, var(--forest), var(--moss), var(--teal));
  color: #fff;
  padding: 36px 48px;
}
.hero .meta { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.hero .meta span {
  background: rgba(255,255,255,.15);
  color: #fff;
  font-size: 12px;
  font-weight: 600;
  padding: 4px 12px;
  border-radius: 99px;
}
.hero h2 { font-size: 28px; font-weight: 800; line-height: 1.25; }
.hero .zh { font-size: 22px; font-weight: 700; color: var(--mint); margin-top: 6px; }
.hero .sub-h { font-size: 14px; opacity: .92; margin-top: 12px; max-width: 680px; }
.hero-actions { margin-top: 16px; display: flex; gap: 10px; flex-wrap: wrap; }
.btn-hero-practice {
  background: var(--mint);
  color: var(--forest);
  font-weight: 800;
  padding: 9px 18px;
  border-radius: var(--radius-sm);
  border: none;
  cursor: pointer;
  font-size: 13px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: all .2s;
}
.btn-hero-practice:hover { background: #e8d4e8; transform: translateY(-1px); }

/* Toolbar */
.toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 12px;
  padding: 14px 48px;
  border-bottom: 1px solid var(--border);
  background: var(--white);
  position: sticky;
  top: 0;
  z-index: 80;
}
.btn {
  padding: 8px 16px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-weight: 700;
  border: none;
  cursor: pointer;
  transition: all .2s;
  font-family: inherit;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.btn-primary { background: var(--forest); color: #fff; }
.btn-primary:hover { background: var(--moss); transform: translateY(-1px); }
.btn-outline { background: transparent; color: var(--forest); border: 1.5px solid var(--border); }
.btn-outline:hover { border-color: var(--teal); background: var(--sage); }
.btn-outline.on { border-color: var(--moss); background: var(--sage); }
.spacer { flex: 1; }
.legend { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; font-size: 11px; color: var(--text-soft); }
.legend .tone { display: inline-flex; align-items: center; gap: 4px; }
.legend .dot { width: 10px; height: 10px; border-radius: 50%; }

/* Lesson Subnav Pills */
.subnav-bar {
  display: flex;
  gap: 8px;
  padding: 10px 48px;
  background: var(--shell);
  border-bottom: 1px solid var(--border);
  overflow-x: auto;
}
.subnav-pill {
  font-size: 12px;
  font-weight: 700;
  padding: 6px 12px;
  border-radius: 99px;
  background: var(--white);
  border: 1px solid var(--border);
  color: var(--text-mid);
  cursor: pointer;
  white-space: nowrap;
  transition: all .15s;
}
.subnav-pill:hover { background: var(--sage); border-color: var(--teal); }

/* Content Sections */
.section { padding: 32px 48px; border-bottom: 1px solid var(--border); }
.section:last-child { border-bottom: none; padding-bottom: 80px; }
.section-header { margin-bottom: 20px; }
.part-pill {
  display: inline-block;
  background: var(--forest);
  color: var(--mint);
  font-size: 11px;
  font-weight: 800;
  padding: 3px 10px;
  border-radius: 99px;
  margin-bottom: 6px;
  letter-spacing: .5px;
  text-transform: uppercase;
}
.section-title { font-size: 20px; font-weight: 800; color: var(--forest); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.section-desc { font-size: 13px; color: var(--text-soft); margin-top: 4px; }

.card {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px 22px;
  box-shadow: var(--shadow-sm);
  margin-bottom: 18px;
}
.card:hover { border-color: var(--teal); box-shadow: var(--shadow-md); }

.badge-compose {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 10px;
  font-weight: 800;
  color: var(--moss);
  background: var(--sage);
  border: 1px solid var(--border);
  padding: 3px 9px;
  border-radius: 99px;
  letter-spacing: .3px;
}

/* Tone Classes */
.tone1 { color: var(--t1); font-weight: 600; }
.tone2 { color: var(--t2); font-weight: 600; }
.tone3 { color: var(--t3); font-weight: 600; }
.tone4 { color: var(--t4); font-weight: 600; }
.tone5 { color: var(--t5); }

.icon-audio {
  background: var(--sage);
  border: none;
  color: var(--forest);
  width: 32px;
  height: 32px;
  border-radius: 50%;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  transition: all .2s;
  flex-shrink: 0;
}
.icon-audio:hover { background: var(--mint); transform: scale(1.08); }

/* Dialogue Boxes */
.dialogue-box {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  margin-bottom: 20px;
}
.dialogue-header {
  background: var(--shell);
  padding: 12px 18px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px;
}
.dialogue-title { font-size: 15px; font-weight: 800; color: var(--forest); }
.dialogue-scene { font-size: 13px; color: var(--text-soft); font-style: italic; }
.dialogue-lines { padding: 14px 18px; display: flex; flex-direction: column; gap: 10px; }
.d-line {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  background: var(--sand);
  transition: all .2s;
}
.d-line:hover { background: var(--shell); }
.d-speaker { font-weight: 800; color: var(--moss); font-size: 14px; min-width: 70px; flex-shrink: 0; padding-top: 2px; }
.d-content { flex: 1; }
.d-zh { font-size: 18px; font-weight: 700; color: var(--forest); line-height: 1.3; }
.d-py { font-size: 13px; font-style: italic; margin-top: 2px; }
.d-vi { font-size: 13px; color: var(--text-mid); margin-top: 2px; }

/* Vocab Grid & Cards */
.vocab-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.vcard {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 4px;
  transition: all .2s;
}
.vcard:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); border-color: var(--teal); }
.vcard .hz { font-size: 28px; font-weight: 700; color: var(--forest); line-height: 1.15; cursor: pointer; }
.vcard .py { font-size: 14px; font-style: italic; font-weight: 500; }
.vcard.hide-py .py { visibility: hidden; }
.vcard .vi { font-size: 13px; color: var(--text-mid); font-weight: 600; margin-top: 2px; }
.vcard .actions { position: absolute; top: 12px; right: 12px; display: flex; gap: 6px; }
.vcard.learned { border-color: var(--green-success); background: var(--green-light); }
.vcard .check { margin-top: 4px; font-size: 12px; color: var(--text-soft); display: flex; align-items: center; gap: 5px; user-select: none; cursor: pointer; }
.vcard .check input { accent-color: var(--forest); width: 14px; height: 14px; }

/* Tables */
.v-table { width: 100%; border-collapse: collapse; font-size: 14px; text-align: left; }
.v-table th { background: var(--forest); color: #fff; padding: 10px 14px; font-weight: 700; font-size: 12px; }
.v-table td { padding: 10px 14px; border-bottom: 1px solid var(--border); background: var(--white); }
.v-table tr:hover td { background: var(--shell); }
.v-table .zh-col { font-size: 17px; font-weight: 700; color: var(--forest); cursor: pointer; }
.v-table .zh-col:hover { color: var(--teal); }

/* Grammar Cards */
.gcard {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px 22px;
  margin-bottom: 18px;
}
.g-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
.g-num {
  background: var(--forest);
  color: #fff;
  font-size: 12px;
  font-weight: 800;
  width: 26px;
  height: 26px;
  border-radius: 7px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.g-title { font-size: 16px; font-weight: 800; color: var(--forest); }
.g-structure {
  background: var(--forest);
  color: var(--mint);
  font-family: monospace, sans-serif;
  font-size: 13px;
  padding: 8px 12px;
  border-radius: var(--radius-sm);
  margin-bottom: 10px;
  font-weight: 600;
}
.g-exp { font-size: 14px; color: var(--text-dark); margin-bottom: 10px; }
.g-examples { background: var(--shell); border-radius: var(--radius-sm); padding: 10px 14px; margin-bottom: 10px; }
.g-ex { padding: 5px 0; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
.g-ex:last-child { border-bottom: none; }
.g-drill { background: var(--green-light); border: 1px solid #BBF7D0; border-radius: var(--radius-sm); padding: 10px 12px; font-size: 13px; color: #14532D; margin-top: 8px; }

/* Tip & Info Boxes */
.tip-box { background: var(--amber-light); border: 1px solid #FDE68A; border-radius: var(--radius-sm); padding: 10px 14px; font-size: 13px; color: #92400E; margin-top: 10px; }
.info-box { background: var(--blue-light); border: 1px solid #BFDBFE; border-radius: var(--radius-sm); padding: 10px 14px; font-size: 13px; color: #1E40AF; margin-top: 10px; }

/* Hanzi Writer Cards */
.writer-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; margin-top: 12px; }
.stroke-card {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 6px;
  transition: all .2s;
}
.stroke-card:hover { border-color: var(--teal); box-shadow: var(--shadow-md); transform: translateY(-2px); }
.stroke-zh { font-size: 26px; font-weight: 700; color: var(--forest); }
.stroke-py { font-size: 13px; font-style: italic; font-weight: 600; }
.stroke-vi { font-size: 11px; color: var(--text-soft); }
.writer-box { width: 100px; height: 100px; background: var(--shell); border: 1px solid var(--border); border-radius: var(--radius-sm); }
.stroke-actions { display: flex; gap: 4px; width: 100%; margin-top: 4px; }
.btn-stroke {
  flex: 1;
  padding: 5px 6px;
  font-size: 11px;
  font-weight: 700;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--sage);
  color: var(--forest);
  cursor: pointer;
  transition: all .15s;
}
.btn-stroke:hover { background: var(--mint); }

/* Exercise Widgets */
.ex-card {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px 22px;
  margin-bottom: 20px;
}
.ex-title { font-size: 16px; font-weight: 800; color: var(--forest); margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
.ex-prompt { font-size: 13px; color: var(--text-soft); margin-bottom: 12px; }
.chip-group { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.choice-chip {
  padding: 8px 14px;
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--white);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all .15s;
  font-family: inherit;
  color: var(--text-dark);
}
.choice-chip:hover { border-color: var(--teal); background: var(--sage); }
.choice-chip.correct { border-color: var(--green-success); background: var(--green-light); color: var(--green-success); }
.choice-chip.wrong { border-color: var(--red); background: var(--red-light); color: var(--red); }
.choice-chip-py { display:inline-flex; flex-direction:column; align-items:center; gap:2px; line-height:1.25; }
.choice-chip-py .cc-hz { font-size:17px; font-weight:700; }
.choice-chip-py .cc-py { font-size:12px; font-weight:600; }
.fb { margin-top: 10px; padding: 10px 14px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 600; display: none; }
.fb.ok { display: block; background: var(--green-light); color: var(--green-success); border: 1px solid #BBF7D0; }
.fb.bad { display: block; background: var(--red-light); color: var(--red); border: 1px solid #FECACA; }

.token-container { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
.token-chip {
  padding: 7px 12px;
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--white);
  cursor: pointer;
  font-size: 15px;
  font-weight: 600;
  color: var(--forest);
  user-select: none;
}
.token-chip:hover { border-color: var(--moss); }
.token-chip.used { opacity: .3; pointer-events: none; }
.answer-zone {
  min-height: 44px;
  border: 1.5px dashed var(--border);
  border-radius: var(--radius-sm);
  padding: 6px 10px;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
  background: var(--shell);
  margin-bottom: 6px;
}
.answer-slot { padding: 5px 10px; background: var(--forest); color: #fff; border-radius: 6px; font-size: 14px; cursor: pointer; }

/* Modal Hanzi Writer */
.modal-back {
  position: fixed;
  inset: 0;
  background: rgba(1,50,32,.45);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 300;
  padding: 16px;
}
.modal-back.show { display: flex; }
.modal {
  background: var(--white);
  border-radius: var(--radius-lg);
  max-width: 440px;
  width: 100%;
  padding: 24px;
  box-shadow: var(--shadow-lg);
  position: relative;
  max-height: 94vh;
  overflow-y: auto;
}
.modal .close {
  position: absolute;
  top: 14px;
  right: 16px;
  background: none;
  border: none;
  font-size: 22px;
  color: var(--text-soft);
  cursor: pointer;
}
.modal .m-word { text-align: center; margin: 8px 0; }
.modal .m-word .zh { font-size: 32px; font-weight: 700; color: var(--forest); }
.modal .m-word .py { font-size: 15px; font-style: italic; color: var(--blue); margin-top: 2px; }
.modal .m-word .vi { font-size: 13px; color: var(--text-soft); margin-top: 2px; }
.writer-row { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin: 12px 0; }
.writer-cell { width: 120px; height: 120px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--shell); }

/* Full Practice Modal */
.pr-back { position: fixed; inset: 0; background: rgba(1,50,32,.55); display: none; z-index: 400; }
.pr-back.show { display: block; }
.pr-modal { background: var(--sand); position: absolute; inset: 0; display: flex; flex-direction: column; }
.pr-top { display: flex; align-items: center; gap: 14px; padding: 14px 24px; background: var(--forest); color: #fff; flex-shrink: 0; }
.pr-top .pr-title { font-size: 16px; font-weight: 800; }
.pr-top .pr-sub { font-size: 12px; color: var(--mint); opacity: .9; }
.pr-top .close { margin-left: auto; background: rgba(255,255,255,.12); border: none; color: #fff; width: 34px; height: 34px; border-radius: 8px; font-size: 20px; cursor: pointer; }
.pr-tabs { display: flex; gap: 6px; padding: 10px 24px; background: var(--white); border-bottom: 1px solid var(--border); overflow-x: auto; flex-shrink: 0; }
.pr-tab {
  white-space: nowrap;
  font-size: 12px;
  font-weight: 700;
  padding: 7px 12px;
  border-radius: 99px;
  border: 1.5px solid var(--border);
  color: var(--text-mid);
  background: transparent;
  cursor: pointer;
  transition: all .2s;
}
.pr-tab.active { background: var(--forest); color: #fff; border-color: var(--forest); }
.pr-body { flex: 1; overflow-y: auto; padding: 24px; max-width: 820px; margin: 0 auto; width: 100%; }
.pr-scorebar { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
.pr-scorebar .stat { font-size: 13px; color: var(--text-soft); }

Trung."}, {"zh": "我叫白家月。", "py": "wǒ jiào bái jiā yuè", "vi": "Tôi tên là Bạch Gia Nguyệt."}, {"zh": "我是学生。", "py": "wǒ shì xué shēng", "vi": "Tôi là học sinh."}]}, {"lesson": 3, "title": "Câu chữ 是 (shì) – Câu khẳng định", "structure": "S + 是 + Danh từ/Đại từ", "explanation": "从 是 đóng vai trò như động từ \"là\", nối chủ ngữ với danh từ hoặc cụm danh từ, dùng để xác định danh tính, nghề nghiệp, quốc tịch hoặc sự vật.", "tip": "Muốn phủ định, thêm 不 trước 是 thành 不是 (không phải là).", "note": "Không dùng 是 đứng trước tính từ (không nói 是好 mà nói 很好).", "examples": [{"zh": "我是学生。", "py": "wǒ shì xué shēng", "vi": "Tôi là học sinh."}, {"zh": "他是中国人。", "py": "tā shì zhōng guó rén", "vi": "Anh ấy là người Trung Quốc."}]}, {"lesson": 3, "title": "Trợ từ kết cấu 的", "structure": "Định ngữ + 的 + Trung tâm ngữ", "explanation": "Trợ từ 的 nối định ngữ và trung tâm ngữ, biểu thị quan hệ sở hữu hoặc tính chất. Đặt từ chỉ sở hữu/đặc điểm lên trước, thêm 的 rồi mới đến danh từ chính.", "tip": "Nếu định ngữ là người thân hoặc đơn vị công tác, có thể lược bỏ 的.", "note": "Đừng quên 的 khi định ngữ là danh từ/đại từ chỉ người khác.", "examples": [{"zh": "我的中文老师", "py": "wǒ de zhōng wén lǎo shī", "vi": "Giáo viên tiếng Trung của tôi"}, {"zh": "她的中文老师", "py": "tā de zhōng wén lǎo shī", "vi": "Giáo viên tiếng Trung của cô ấy"}]}, {"lesson": 3, "title": "Câu hỏi nghi vấn với 吗", "structure": "Câu trần thuật + 吗?", "explanation": "Để biến câu trần thuật thành câu hỏi Có/Không, thêm trợ từ ngữ khí 吗 vào cuối câu, không cần đổi trật tự từ.", "tip": "Trả lời câu hỏi 吗 bằng cách lặp lại động từ hoặc dùng 是/不是, 有/没有.", "note": "Không dùng 吗 khi câu đã có từ nghi vấn khác như 什么, 谁, 哪儿.", "examples": [{"zh": "你是学生吗？", "py": "nǐ shì xué shēng ma", "vi": "Bạn có phải là học sinh không?"}, {"zh": "你工作还忙吗？", "py": "nǐ gōng zuò hái máng ma", "vi": "Công việc của bạn vẫn bận chứ?"}]}, {"lesson": 4, "title": "Câu chữ 有 (biểu thị sở hữu)", "structure": "S + 有 + Tân ngữ", "explanation": "Câu chữ 有 biểu thị sự sở hữu người/vật, dịch là 'có'. 有 là động từ chính của câu.", "tip": "Phủ định (không có) thì thay 有 bằng 没有.", "note": "Phủ định tuyệt đối không dùng 不有, phải dùng 没有.", "examples": [{"zh": "她有十个学生。", "py": "tā yǒu shí gè xué shēng", "vi": "Cô ấy có mười học sinh."}, {"zh": "她有一个姐姐。", "py": "tā yǒu yī gè jiě jiě", "vi": "Cô ấy có một người chị gái."}]}, {"lesson": 4, "title": "Cách đọc và biểu đạt con số", "structure": "Số đếm + (Lượng từ/Danh từ) đơn vị", "explanation": "Số đếm 1-10 là nền tảng tạo số lớn hơn. Khi biểu đạt con số kèm đơn vị, đặt số đếm trước lượng từ hoặc danh từ đơn vị (thời gian, tiền tệ, tuổi tác).", "tip": "Số tiền lớn thường lấy mốc 4 số 0 là 万 (vạn); 100.000 đọc là 十万.", "note": "Thứ tự thời gian đi từ lớn đến nhỏ: Năm → Tháng → Ngày → Thứ → Giờ → Phút.", "examples": [{"zh": "二十二", "py": "èr shí èr", "vi": "Hai mươi hai"}, {"zh": "九百九十九", "py": "jiǔ bǎi jiǔ shí jiǔ", "vi": "Chín trăm chín mươi chín"}]}, {"lesson": 4, "title": "Trợ từ nghi vấn 呢 (hỏi lại tình huống)", "structure": "A..., B 呢? (câu hỏi tỉnh lược)", "explanation": "呢 đặt cuối câu để hỏi lại một tình huống đã nhắc trước đó, là cách nói tắt giúp câu ngắn gọn, tự nhiên hơn.", "tip": "Dùng khi muốn hỏi ngược lại cùng chủ đề: '我吃了，你呢？'", "note": "Không dùng 呢 thay 吗; 呢 chỉ dùng cho câu hỏi tỉnh lược/liệt kê.", "examples": [{"zh": "我是学生, 你呢？", "py": "wǒ shì xué shēng nǐ ne", "vi": "Tôi là học sinh, còn bạn thì sao?"}, {"zh": "我是中国人, 你呢？", "py": "wǒ shì zhōng guó rén nǐ ne", "vi": "Tôi là người Trung Quốc, còn bạn?"}]}, {"lesson": 4, "title": "Cấu trúc Số từ + Lượng từ + Danh từ", "structure": "[Số từ] + [Lượng từ] + [Danh từ]", "explanation": "Muốn chỉ số lượng của vật, phải thêm lượng từ giữa số từ và danh từ. Lượng từ 个 phổ biến nhất, dùng cho nhiều danh từ khi chưa biết lượng từ riêng.", "tip": "Chưa thuộc lượng từ chuyên biệt thì dùng tạm 个.", "note": "Đừng bỏ qua lượng từ khi đi kèm số đếm; danh từ không đứng ngay sau số từ.", "examples": [{"zh": "一个", "py": "yī gè", "vi": "Một cái/chiếc"}, {"zh": "五口人", "py": "wǔ kǒu rén", "vi": "Năm người (dùng trong gia đình)"}]}, {"lesson": 5, "title": "Thứ tự biểu đạt thời gian", "structure": "Năm (年) + Tháng (月) + Ngày (日/号) + Thứ (星期)", "explanation": "Khi diễn đạt thời gian, luôn đi từ đơn vị lớn nhất đến nhỏ nhất: 年 → 月 → 日/号 → 星期.", "tip": "Ghi nhớ quy tắc 'từ lớn đến bé', ngược với tiếng Việt.", "note": "Khẩu ngữ thường dùng 号, văn viết dùng 日.", "examples": [{"zh": "2025年1月1日, 星期三", "py": "nián yuè rì xīng qī sān", "vi": "Thứ Tư, ngày 1 tháng 1 năm 2025"}, {"zh": "今天9月8号。", "py": "jīn tiān yuè hào", "vi": "Hôm nay ngày 8 tháng 9."}]}, {"lesson": 5, "title": "Câu vị ngữ danh từ", "structure": "S + Danh từ/Cụm danh từ (vị ngữ)", "explanation": "Vị ngữ là danh từ/cụm danh từ (không phải động từ hay tính từ), thường dùng chỉ ngày tháng, thời gian, tuổi tác, giá tiền.", "tip": "Nói ngày tháng nhớ quy tắc lớn đến nhỏ: Năm → Tháng → Ngày → Thứ.", "note": "Không thêm 是 vào giữa chủ ngữ và vị ngữ.", "examples": [{"zh": "今天星期四。", "py": "jīn tiān xīng qī sì", "vi": "Hôm nay là thứ Năm."}, {"zh": "明天是2024年8月18号。", "py": "míng tiān shì nián yuè hào", "vi": "Ngày mai là ngày 18 tháng 8 năm 2024."}]}, {"lesson": 5, "title": "Động từ năng nguyện 会 (biết)", "structure": "S + 会 + Động từ (+ Tân ngữ)", "explanation": "会 diễn tả năng lực/kỹ năng có được thông qua học tập, rèn luyện. Ví dụ 我会说汉语 (Tôi biết nói tiếng Trung).", "tip": "会 nhấn mạnh khả năng biết làm nhờ học hỏi.", "note": "Đừng nhầm 会 với 能; 能 chỉ khả năng dựa trên điều kiện thực tế.", "examples": [{"zh": "我会做饭。", "py": "wǒ huì zuò fàn", "vi": "Tôi biết nấu ăn."}, {"zh": "你会做饭吗？", "py": "nǐ huì zuò fàn ma", "vi": "Bạn biết nấu ăn không?"}]}, {"lesson": 6, "title": "Động từ năng nguyện 想 (muốn)", "structure": "S + 想 + Động từ + (Tân ngữ)", "explanation": "想 biểu thị nguyện vọng, mong muốn hoặc dự định làm gì, đứng trước động từ chính.", "tip": "Phủ định thêm 不 trước 想 (不想 - không muốn).", "note": "Không dùng 想 như tính từ; chỉ dùng để biểu thị ý định làm việc.", "examples": [{"zh": "我想去超市。", "py": "wǒ xiǎng qù chāo shì", "vi": "Tôi muốn đi siêu thị."}, {"zh": "我哥哥不想休息。", "py": "wǒ gē gē bù xiǎng xiū xī", "vi": "Anh trai tôi không muốn nghỉ ngơi."}]}, {"lesson": 6, "title": "Câu liên động", "structure": "S + V1 + O1 + V2 + O2", "explanation": "Câu có từ hai động từ trở lên cùng làm vị ngữ, thường diễn tả mục đích/trình tự; động từ thứ hai giải thích lý do làm động từ thứ nhất.", "tip": "Hành động xảy ra trước đứng trước, hành động mục đích đứng sau.", "note": "Không dùng từ liên kết như 和 hay 然后 giữa hai động từ.", "examples": [{"zh": "我去超市买东西。", "py": "wǒ qù chāo shì mǎi dōng xī", "vi": "Tôi đi siêu thị mua đồ."}, {"zh": "我们坐出租车去西安饭店。", "py": "wǒ men zuò chū zū chē qù xī ān fàn diàn", "vi": "Chúng tôi đi taxi đến nhà hàng Tây An."}]}, {"lesson": 6, "title": "Đại từ nghi vấn 怎么 (làm thế nào)", "structure": "S + 怎么 + V + (O)?", "explanation": "怎么 dùng trước động từ để hỏi phương thức/cách thức thực hiện hành động, tương đương 'làm thế nào', 'làm sao'.", "tip": "Hỏi cách làm/cách dùng: 这个字怎么写？(Chữ này viết thế nào?).", "note": "Phân biệt 怎么 (hỏi cách làm) với 什么 (hỏi sự vật, sự việc).", "examples": [{"zh": "你怎么去超市？", "py": "nǐ zěn me qù chāo shì", "vi": "Bạn đi siêu thị bằng cách nào?"}, {"zh": "我们怎么去？", "py": "wǒ men zěn me qù", "vi": "Chúng ta đi bằng cách nào?"}]}, {"lesson": 7, "title": "Cách nói giờ giấc cụ thể", "structure": "Số + 点 (giờ) + Số + 分 (phút)", "explanation": "Đặt số đếm trước 点 (giờ) và 分 (phút), thứ tự từ lớn đến nhỏ. Ví dụ 八点三十分 (8 giờ 30).", "tip": "30 phút có thể dùng 半: 8 giờ rưỡi là 八点半.", "note": "Dùng 两 thay 二 khi nói '2 giờ' (两点), không dùng 二点.", "examples": [{"zh": "上午十点", "py": "shàng wǔ shí diǎn", "vi": "Mười giờ sáng"}, {"zh": "我晚上六点半下班。", "py": "wǒ wǎn shàng liù diǎn bàn xià bān", "vi": "Tôi tan làm lúc 6 giờ rưỡi tối."}]}, {"lesson": 7, "title": "Trợ từ ngữ khí 吧 (đề nghị)", "structure": "Câu + 吧", "explanation": "吧 đứng cuối câu để đưa ra lời đề nghị, gợi ý hoặc yêu cầu nhẹ nhàng, giúp câu lịch sự hơn.", "tip": "Dùng 吧 khi rủ ai làm gì cùng: 我们走吧 (Chúng ta đi thôi).", "note": "Không dùng 吧 trong câu hỏi cần xác nhận như câu hỏi 吗.", "examples": [{"zh": "我们上课吧。", "py": "wǒ men shàng kè ba", "vi": "Chúng ta lên lớp thôi."}, {"zh": "我们中午下课吧。", "py": "wǒ men zhōng wǔ xià kè ba", "vi": "Trưa nay chúng ta tan học đi."}]}, {"lesson": 7, "title": "Vị trí của trạng ngữ trong câu", "structure": "Trạng ngữ + Động từ/Tính từ", "explanation": "Từ chỉ thời gian hoặc phó từ thường đứng trước động từ/tính từ để bổ nghĩa. Nhớ quy tắc 'thời gian đứng trước hành động'.", "tip": "Trạng ngữ thời gian có thể đặt đầu câu trước chủ ngữ hoặc ngay sau chủ ngữ.", "note": "Không đặt trạng ngữ thời gian sau động từ như tiếng Việt.", "examples": [{"zh": "我下午不去学校。", "py": "wǒ xià wǔ bù qù xué xiào", "vi": "Chiều nay tôi không đi học."}, {"zh": "妹妹很高兴。", "py": "mèi mèi hěn gāo xīng", "vi": "Em gái rất vui."}]}, {"lesson": 7, "title": "Trợ từ ngữ khí 呢 (xác nhận sự thật)", "structure": "Câu trần thuật + 呢", "explanation": "呢 đặt cuối câu trần thuật để nhấn mạnh, xác nhận một sự thật/tình trạng đang diễn ra, tương đương 'nhỉ', 'đấy', 'cơ'.", "tip": "Dùng 呢 giúp câu bớt khô khan, thể hiện thái độ khẳng định.", "note": "Phân biệt với 呢 trong câu hỏi tỉnh lược ('Còn tôi thì sao?').", "examples": [{"zh": "我下午还有课呢。", "py": "wǒ xià wǔ hái yǒu kè ne", "vi": "Chiều nay tôi vẫn còn tiết học đấy."}, {"zh": "李文晚上还有事呢。", "py": "lǐ wén wǎn shàng hái yǒu shì ne", "vi": "Lý Văn buổi tối vẫn còn việc đấy."}]}, {"lesson": 8, "title": "Danh từ chỉ phương hướng và vị trí", "structure": "[Danh từ/Đại từ] + [Danh từ phương vị: 上, 下, 前, 后, 里, 外...]", "explanation": "Để chỉ vị trí một vật, đặt danh từ chỉ vật đó trước từ chỉ phương vị. 上 (trên), 下 (dưới), 里 (trong) luôn đứng sau danh từ gốc.", "tip": "Từ chỉ phương vị như 'vệ tinh' luôn bám sau danh từ chính.", "note": "Danh từ luôn đứng trước từ phương vị, ngược với tiếng Việt.", "examples": [{"zh": "在桌子上", "py": "zài zhuō zi shàng", "vi": "Ở trên bàn"}, {"zh": "房间外有一只小猫。", "py": "fáng jiān wài yǒu yī zhǐ xiǎo māo", "vi": "Bên ngoài phòng có một chú mèo nhỏ."}]}, {"lesson": 8, "title": "Giới từ chỉ địa điểm 在", "structure": "S + 在 + Địa điểm + Động từ", "explanation": "在 chỉ nơi chốn hành động diễn ra. Đặt 在 cùng địa điểm ngay trước động từ.", "tip": "Trả lời cho câu hỏi 'làm gì ở đâu': 我在学校学习 (Tôi học ở trường).", "note": "Đặt 在 trước động từ, tránh đặt sau động từ như tiếng Việt.", "examples": [{"zh": "我在学校学习。", "py": "wǒ zài xué xiào xué xí", "vi": "Tôi học ở trường."}, {"zh": "我爸爸也在医院工作。", "py": "wǒ bà bà yě zài yī yuàn gōng zuò", "vi": "Bố tôi cũng làm việc ở bệnh viện."}]}, {"lesson": 8, "title": "Động từ năng nguyện 能", "structure": "S + 能 + Động từ + (Tân ngữ)", "explanation": "能 đứng trước động từ để biểu thị khả năng hoặc sự cho phép làm việc gì, tương đương 'có thể'.", "tip": "Phủ định thêm 不 thành 不能 (không thể).", "note": "Khác 会 (biết nhờ học tập), 能 thiên về khả năng khách quan/sự cho phép.", "examples": [{"zh": "我能去。", "py": "wǒ néng qù", "vi": "Tôi có thể đi."}, {"zh": "星期五前能回家吗？", "py": "xīng qī wǔ qián néng huí jiā ma", "vi": "Trước thứ Sáu có thể về nhà không?"}]}, {"lesson": 9, "title": "Câu tồn tại với 有 và 是", "structure": "[Địa điểm] + 有/是 + [Danh từ]", "explanation": "Diễn tả sự tồn tại của người/vật tại địa điểm. 有 nghĩa 'có cái gì ở đâu', 是 mang nghĩa 'là'/sự hiện diện.", "tip": "Đặt từ chỉ vị trí lên đầu câu để xác định phạm vi tồn tại.", "note": "Phủ định với 有 bắt buộc dùng 没有, không dùng 不有.", "examples": [{"zh": "桌子上有/是一本书。", "py": "zhuō zi shàng yǒu shì yī běn shū", "vi": "Trên bàn có một quyển sách."}, {"zh": "学校前边有一家电影院。", "py": "xué xiào qián biān yǒu yī jiā diàn yǐng yuàn", "vi": "Phía trước trường học có một rạp chiếu phim."}]}, {"lesson": 9, "title": "Thứ tự trạng ngữ thời gian và địa điểm", "structure": "S + Trạng ngữ thời gian + Trạng ngữ địa điểm + Động từ", "explanation": "Khi nói cả thời gian và địa điểm, đặt trạng ngữ thời gian trước trạng ngữ địa điểm.", "tip": "Nhớ mẹo 'Thời gian đi trước, nơi chốn theo sau'.", "note": "Không đặt trạng ngữ thời gian ở cuối câu như tiếng Việt.", "examples": [{"zh": "我们上午十点在书店见吧。", "py": "wǒ men shàng wǔ shí diǎn zài shū diàn jiàn ba", "vi": "Mười giờ sáng chúng ta gặp ở nhà sách nhé."}, {"zh": "我明天上午在学校学习。", "py": "wǒ míng tiān shàng wǔ zài xué xiào xué xí", "vi": "Tôi học ở trường vào sáng mai."}]}, {"lesson": 9, "title": "Số thứ tự với 第", "structure": "第 + Số đếm + (Lượng từ) + Danh từ", "explanation": "Thêm tiền tố 第 vào trước số đếm để thành số thứ tự. 第一 (thứ nhất), 第二 (thứ hai). Dùng chỉ thứ tự, xếp hạng.", "tip": "Nói về số lần thêm lượng từ 次 sau số: 第一次 (lần thứ nhất).", "note": "第 chỉ dùng cho số đếm, không dùng cho số ước chừng 几.", "examples": [{"zh": "第一, 第一个, 第一个学生", "py": "dì yī dì yī gè dì yī gè xué shēng", "vi": "Thứ nhất, cái đầu tiên, học sinh đầu tiên"}, {"zh": "这是我的第二本中文书。", "py": "zhè shì wǒ de dì èr běn zhōng wén shū", "vi": "Đây là quyển sách tiếng Trung thứ hai của tôi."}]}, {"lesson": 10, "title": "Cách đọc tiền tệ trong tiếng Trung", "structure": "Số + Đơn vị (元/角/分 hoặc 块/毛/分)", "explanation": "Đơn vị chính là 元, 角, 分. Khẩu ngữ thường dùng 块 thay 元 và 毛 thay 角. 分 giữ nguyên cả nói và viết.", "tip": "Quy đổi: 1 元 (块) = 10 角 (毛) = 100 分.", "note": "Không dùng lẫn đơn vị văn viết và văn nói trong cùng cụm.", "examples": [{"zh": "三块", "py": "sān kuài", "vi": "Ba tệ"}, {"zh": "三块二", "py": "sān kuài èr", "vi": "Ba tệ hai hào"}]}, {"lesson": 10, "title": "Câu vị ngữ tính từ", "structure": "S + (phó từ mức độ) + Tính từ", "explanation": "Tính từ làm vị ngữ thay động từ. Thường thêm phó từ mức độ như 很 (rất) trước tính từ cho tự nhiên.", "tip": "Tiếng Việt không dịch 很 nhưng nên thêm để câu không bị cụt.", "note": "Không thêm động từ 是 trước tính từ.", "examples": [{"zh": "这个苹果很好吃。", "py": "zhè gè píng guǒ hěn hǎo chī", "vi": "Quả táo này rất ngon."}, {"zh": "我的房间不大。", "py": "wǒ de fáng jiān bù dà", "vi": "Phòng của tôi không lớn."}]}, {"lesson": 10, "title": "Đại từ nghi vấn 怎么样", "structure": "S + 怎么样？", "explanation": "怎么样 hỏi về tính chất, tình trạng của người/vật, hoặc dùng hỏi ý kiến, đưa đề xuất.", "tip": "Dịch là 'như thế nào', 'thế nào'.", "note": "Không dùng 怎么样 hỏi số lượng/giá cả (vốn dùng 多少).", "examples": [{"zh": "这件衣服怎么样？", "py": "zhè jiàn yī fú zěn me yàng", "vi": "Bộ quần áo này thế nào?"}, {"zh": "这个杯子怎么样？", "py": "zhè gè bēi zi zěn me yàng", "vi": "Cái ly này thế nào?"}]}, {"lesson": 11, "title": "Câu hỏi chính phản", "structure": "Động từ/Tính từ + 不 + Động từ/Tính từ", "explanation": "Dùng hình thức khẳng định và phủ định cạnh nhau tạo câu hỏi, không cần 吗 cuối câu. Ví dụ 你去不去？(Bạn có đi không?).", "tip": "Cấu trúc này trực diện, tự nhiên hơn so với dùng 吗.", "note": "Không thêm 吗 cuối câu khi đã dùng dạng chính phản.", "examples": [{"zh": "好不好？", "py": "hǎo bù hǎo", "vi": "Tốt không?"}, {"zh": "你去不去学校？", "py": "nǐ qù bù qù xué xiào", "vi": "Bạn có đi học không?"}]}, {"lesson": 11, "title": "Diễn tả hành động đang tiếp diễn", "structure": "S + (正/正在/在) + Động từ + (呢)", "explanation": "正, 正在 hoặc 在 đặt trước động từ diễn tả hành động đang xảy ra. Thêm 呢 cuối câu để nhấn mạnh trạng thái tiếp diễn.", "tip": "Nhấn mạnh thời điểm chính xác thì ưu tiên 正在 hoặc 正...呢.", "note": "Phân biệt 在 (đang) với 在 (ở): 我在家 khác 我正在看书.", "examples": [{"zh": "他在休息呢。", "py": "tā zài xiū xī ne", "vi": "Anh ấy đang nghỉ ngơi."}, {"zh": "我正在看电视。", "py": "wǒ zhèng zài kàn diàn shì", "vi": "Tôi đang xem tivi."}]}, {"lesson": 11, "title": "Động từ năng nguyện 要", "structure": "S + 要 + Động từ + (Tân ngữ)", "explanation": "要 diễn tả mong muốn, ý định hoặc dự định làm gì. Ngoài ra còn thể hiện yêu cầu bắt buộc hoặc dự báo việc sắp xảy ra.", "tip": "Phủ định thêm 不 trước 要 thành 不要 (không muốn/không cần).", "note": "Phân biệt 要 với 想; 要 mang sắc thái quyết tâm/yêu cầu mạnh hơn.", "examples": [{"zh": "我要睡觉。", "py": "wǒ yào shuì jué", "vi": "Tôi muốn đi ngủ."}, {"zh": "他今天要和小朋友玩。", "py": "tā jīn tiān yào hé xiǎo péng yǒu wán", "vi": "Hôm nay nó muốn chơi với các bạn nhỏ."}]}, {"lesson": 12, "title": "Câu phi chủ vị", "structure": "Danh từ/Động từ/Tính từ (không cần chủ ngữ)", "explanation": "Câu ngắn gọn không có chủ ngữ rõ ràng, dùng mô tả hiện tượng tự nhiên (下雨了) hoặc lời chào, cảm thán (你好).", "tip": "Tập trung ghi nhớ các cụm cố định trong giao tiếp vì thường không cần chủ ngữ.", "note": "Đừng cố thêm chủ ngữ vào câu cảm thán/miêu tả hiện tượng tự nhiên.", "examples": [{"zh": "下雨了。", "py": "xià yǔ le", "vi": "Mưa rồi."}, {"zh": "对不起！", "py": "duì bù qǐ", "vi": "Xin lỗi!"}]}, {"lesson": 12, "title": "Trợ từ ngữ khí 了 (le)", "structure": "Câu + 了", "explanation": "了 đặt cuối câu biểu thị tình huống đã thay đổi hoặc trạng thái mới vừa xuất hiện; cũng nhấn mạnh hành động đã xảy ra/hoàn thành.", "tip": "了 như dấu hiệu cho thấy tình hình hiện tại đã khác trước đây.", "note": "Phân biệt 了 trạng thái (cuối câu) và 了 hoàn thành (sau động từ).", "examples": [{"zh": "我去上课了。", "py": "wǒ qù shàng kè le", "vi": "Tôi đi học đây."}, {"zh": "下雨了。", "py": "xià yǔ le", "vi": "Mưa rồi - tình trạng đã thay đổi."}]}, {"lesson": 12, "title": "Cấu trúc cảm thán 太...了", "structure": "太 + [tính từ/động từ tâm lý] + 了", "explanation": "Biểu thị mức độ cao vượt bình thường hoặc cảm thán, nghĩa 'quá', 'lắm', 'thật là'. Ví dụ 太好了 (Tốt quá rồi).", "tip": "Thêm 真 hoặc 实在 trước 太 để tăng sắc thái biểu cảm.", "note": "Câu khẳng định 太...了 nhất định phải có 了 cuối câu.", "examples": [{"zh": "太冷了！", "py": "tài lěng le", "vi": "Lạnh quá!"}, {"zh": "这个杯子太小了。", "py": "zhè gè bēi zi tài xiǎo le", "vi": "Cái ly này nhỏ quá."}]}, {"lesson": 13, "title": "Động từ năng nguyện 可以", "structure": "S + 可以 + Động từ + (Tân ngữ)", "explanation": "可以 biểu thị sự cho phép hoặc khả năng thực hiện hành động, đứng ngay trước động từ chính.", "tip": "Phủ định thêm 不 thành 不可以 (không được phép).", "note": "Đừng nhầm 可以 (cho phép) với 会 (biết do học) hoặc 能 (năng lực/điều kiện).", "examples": [{"zh": "我可以吃吗？", "py": "wǒ kě yǐ chī ma", "vi": "Tôi có thể ăn không?"}, {"zh": "你可以看这本书。", "py": "nǐ kě yǐ kàn zhè běn shū", "vi": "Bạn có thể xem quyển sách này."}]}, {"lesson": 13, "title": "Động từ + 一下 (hành động ngắn)", "structure": "Động từ + 一下 (yíxià)", "explanation": "Diễn tả hành động diễn ra trong thời gian rất ngắn hoặc mang tính thử nghiệm. Thêm 一下 giúp câu nhẹ nhàng, lịch sự hơn.", "tip": "Giảm sự cứng nhắc của câu mệnh lệnh: 看一下 (xem một chút) thay vì 看.", "note": "Không dùng 一下 sau động từ trạng thái tâm lý như 爱, 喜欢, 知道.", "examples": [{"zh": "看一下", "py": "kàn yī xià", "vi": "Xem một chút"}, {"zh": "你可以打电话问一下。", "py": "nǐ kě yǐ dǎ diàn huà wèn yī xià", "vi": "Bạn có thể gọi điện hỏi một chút."}]}, {"lesson": 13, "title": "Câu có hai tân ngữ", "structure": "S + Động từ + Tân ngữ gián tiếp (người) + Tân ngữ trực tiếp (vật)", "explanation": "Một số động từ như 给 (đưa cho), 问 (hỏi) mang cùng lúc hai tân ngữ; tân ngữ chỉ người đứng trước, tân ngữ chỉ vật đứng sau.", "tip": "Nhớ quy tắc: người đứng trước, vật đứng sau.", "note": "Chỉ động từ biểu thị trao đổi/cung cấp thông tin mới dùng được cấu trúc này.", "examples": [{"zh": "给我一杯水。", "py": "gěi wǒ yī bēi shuǐ", "vi": "Cho tôi một ly nước."}, {"zh": "白家月给安妮一个苹果。", "py": "bái jiā yuè gěi ān nī yī gè píng guǒ", "vi": "Bạch Gia Nguyệt cho Annie một quả táo."}]}, {"lesson": 14, "title": "Trợ từ động thái 了 (biểu thị hoàn thành)", "structure": "Động từ + 了 + (tân ngữ)", "explanation": "了 đặt ngay sau động từ nhấn mạnh hành động đã hoàn thành/đã xảy ra. Câu mang ý khẳng định việc gì đó đã thực hiện xong.", "tip": "Nếu có số lượng từ/tân ngữ cụ thể đi kèm, bắt buộc dùng 了 để chỉ rõ hoàn tất.", "note": "Phủ định không dùng 了, phải bỏ đi và thay bằng 没(有) trước động từ.", "examples": [{"zh": "读了一本书", "py": "dú le yī běn shū", "vi": "Đã đọc một quyển sách"}, {"zh": "我看了一个电影。", "py": "wǒ kàn le yī gè diàn yǐng", "vi": "Tôi đã xem một bộ phim."}]}, {"lesson": 14, "title": "Động từ ly hợp (Separable Verbs)", "structure": "Động từ (A) + Thành phần chèn + Tân ngữ (B)", "explanation": "Một số động từ có cấu trúc Động từ + Tân ngữ. Muốn thêm bổ ngữ thời lượng, số lượng hay trạng từ, có thể tách hai phần chèn vào giữa.", "tip": "Với 睡觉, có thể nói 睡了一个小时觉 (ngủ một tiếng đồng hồ).", "note": "Không đặt bổ ngữ/tân ngữ sau toàn bộ cụm ly hợp mà phải tách ra.", "examples": [{"zh": "吃了饭, 睡一觉", "py": "chī le fàn shuì yī jué", "vi": "Ăn cơm rồi, ngủ một giấc"}, {"zh": "睡了觉", "py": "shuì le jué", "vi": "Đã ngủ"}]}, {"lesson": 14, "title": "Phó từ chỉ phạm vi 都 (đều)", "structure": "S + 都 + Động từ/Tính từ", "explanation": "都 nhấn mạnh tất cả đối tượng trong phạm vi đều có chung đặc điểm/hành động, đặt ngay trước động từ/tính từ.", "tip": "Cấu trúc 每 + lượng từ + 都 rất phổ biến: 每天都 (ngày nào cũng).", "note": "Phủ định: 不 trước 都 (không phải cái nào cũng) hoặc sau 都 (cái nào cũng không).", "examples": [{"zh": "我们都来了。", "py": "wǒ men dōu lái le", "vi": "Chúng tôi đều đến rồi."}]}, {"lesson": 15, "title": "Câu phức song song với 还/也", "structure": "S1 + V1 + O1, (S1) + 还/也 + V2 + O2", "explanation": "Diễn tả một người/vật đồng thời có hai trạng thái hoặc thực hiện hai hành động. 还 hoặc 也 nhấn mạnh sự bổ sung thêm tính chất/hành động mới.", "tip": "Có thể bỏ chủ ngữ ở vế thứ hai nếu chủ ngữ hai vế giống nhau.", "note": "还/也 phải đặt trước động từ của vế thứ hai, không đặt trước chủ ngữ.", "examples": [{"zh": "我喜欢看书, 也喜欢看电影。", "py": "wǒ xǐ huān kàn shū yě xǐ huān kàn diàn yǐng", "vi": "Tôi thích đọc sách, cũng thích xem phim."}, {"zh": "王老师是北京人, 李文也是北京人。", "py": "wáng lǎo shī shì běi jīng rén lǐ wén yě shì běi jīng rén", "vi": "Thầy Vương là người Bắc Kinh, Lý Văn cũng là người Bắc Kinh."}]}], "sentences": {"1": {"sents": [{"zh": "老师好！", "py": "lǎo shī hǎo", "vi": "Chào thầy/cô!", "blank": "老师", "segs": [["老师", "lǎo shī"], ["好", "hǎo"]]}, {"zh": "你好，同学。", "py": "nǐ hǎo tóng xué", "vi": "Chào bạn học.", "blank": "同学", "segs": [["你好", "nǐ hǎo"], ["同学", "tóng xué"]]}, {"zh": "谢谢你们。", "py": "xiè xie nǐ men", "vi": "Cảm ơn các bạn.", "blank": "谢谢", "se ", "。"], "correct_order": ["wǒ", "bú shì", "Ānní", "，", "wǒ", "shì", "Bái Jiāyuè", "。"], "ok_msg": "Rất tốt! 我不是安妮，我是白家月。"}, {"type": 5, "title": "5. 看文本回答 · Đọc đoạn văn trả lời", "prompt": "Đọc đoạn hội thoại rồi trả lời câu hỏi:", "question": "李文 tên là gì?", "options": [{"hz": "李文", "correct": true, "py": "Lǐ Wén"}, {"hz": "白家月", "correct": false, "py": "Bái Jiāyuè"}, {"hz": "安妮", "correct": false, "py": "Ānní"}], "ok_msg": "Chính xác! 我叫李文 — anh ấy tên là Lý Văn.", "bad_msg": "Đọc lại: \"我叫李文\" — Lý Văn.", "passage_lines": [{"zh": "李文：你好！我叫李文。", "py": "Lǐ Wén: Nǐ hǎo! Wǒ jiào Lǐ Wén."}, {"zh": "白家月：很高兴认识你。", "py": "Bái Jiāyuè: Hěn gāoxìng rènshi nǐ."}, {"zh": "李文：认识你我也很高兴。", "py": "Lǐ Wén: Rènshi nǐ wǒ yě hěn gāoxìng."}]}, {"type": 6, "title": "6. 完成对话 · Hoàn thành hội thoại", "prompt": "Chọn câu phù hợp để hoàn thành hội thoại:", "options": [{"hz": "认识你我也很高兴。", "correct": true, "py": "Rènshi nǐ wǒ yě hěn gāoxìng."}, {"hz": "对不起！", "correct": false, "py": "Duìbuqǐ!"}, {"hz": "你叫什么名字？", "correct": false, "py": "Nǐ jiào shénme míngzi?"}], "ok_msg": "Chính xác! 认识你我也很高兴 = Quen biết bạn mình cũng rất vui.", "bad_msg": "Chưa đúng. Đáp lại 很高兴认识你 bằng: 认识你我也很高兴。", "stem": "A：很高兴认识你。<br>B：____", "stem_py": "A: Hěn gāoxìng rènshi nǐ.  B: ____"}], "recall": [{"hz": "请问", "py": "qǐngwèn", "vi": "xin hỏi"}, {"hz": "叫", "py": "jiào", "vi": "gọi là, tên là"}, {"hz": "什么", "py": "shénme", "vi": "cái gì"}, {"hz": "名字", "py": "míngzi", "vi": "tên"}, {"hz": "我", "py": "wǒ", "vi": "tôi"}, {"hz": "不", "py": "bù", "vi": "không"}, {"hz": "是", "py": "shì", "vi": "là"}, {"hz": "对不起", "py": "duìbuqǐ", "vi": "xin lỗi"}, {"hz": "没关系", "py": "méi guānxi", "vi": "không sao"}, {"hz": "很", "py": "hěn", "vi": "rất"}, {"hz": "高兴", "py": "gāoxìng", "vi": "vui mừng"}, {"hz": "认识", "py": "rènshi", "vi": "quen biết"}], "final_use": {"intro": "Ghép lại tất cả thành một màn làm quen hoàn chỉnh: chào → giới thiệu tên → nói vui được quen.", "dialogue": [{"who": "A", "zh": "你好！请问，你叫什么名字？", "py": "Nǐ hǎo! Qǐngwèn, nǐ jiào shénme míngzi?"}, {"who": "B", "zh": "你好！我叫白家月。", "py": "Nǐ hǎo! Wǒ jiào Bái Jiāyuè."}, {"who": "A", "zh": "很高兴认识你。", "py": "Hěn gāoxìng rènshi nǐ."}, {"who": "B", "zh": "认识你我也很高兴。", "py": "Rènshi nǐ wǒ yě hěn gāoxìng."}], "task": "Thay tên B bằng chính tên bạn (\"我叫...\"). Nói to cả đoạn, rồi đổi vai. Thử thêm tình huống gọi nhầm tên: \"我不是..., 我是...\" → \"对不起!\" → \"没关系!\"."}}, "3": {"id": 3, "title_vi": "Tôi là người Trung Quốc", "title_zh": "我是中国人", "can_do": "Sau bài học này, bạn có thể dùng câu chữ 是 để nói quốc tịch/thân phận, dùng trợ từ 的 để biểu thị sở hữu, và dùng 吗 để đặt câu hỏi Có/Không.", "goals": ["“是” 字句 · Dùng câu chữ 是 để biểu thị sự tương đương hoặc thuộc về một nhóm/loại.", "结构助词 “的” · Nắm vững cách dùng trợ từ kết cấu 的 (sở hữu / bổ nghĩa).", "“吗” 是非问句 · Nắm vững câu hỏi Có/Không với 吗."], "core_patterns": [{"zh": "我是 + [quốc tịch/thân phận]", "py": "Wǒ shì ...", "vi": "Nói mình là ai/người nước nào"}, {"zh": "定语 + 的 + 中心语", "py": "... de ...", "vi": "Sở hữu: ...của..."}, {"zh": "你是哪国人？", "py": "Nǐ shì nǎ guó rén?", "vi": "Bạn là người nước nào?"}, {"zh": "... 吗？", "py": "... ma?", "vi": "Câu hỏi Có/Không"}], "preview_vocab": [{"hz": "是", "vi": "là"}, {"hz": "人", "vi": "người"}, {"hz": "的", "vi": "của"}, {"hz": "哪", "vi": "nào"}, {"hz": "谁", "vi": "ai"}, {"hz": "吗", "vi": "không?"}, {"hz": "工作", "vi": "công việc"}], "warmup_type": "twister", "warmup": [{"zh": "四是四，十是十。", "py": "Sì shì sì, shí shì shí.", "vi": "Bốn là bốn, mười là mười.", "audio": "四是四十是十"}, {"zh": "十四是十四，四十是四十。", "py": "Shísì shì shísì, sìshí shì sìshí.", "vi": "Mười bốn là mười bốn, bốn mươi là bốn mươi.", "audio": "十四是十四四十是四十"}], "warmup_preview": [{"zh": "我是中国人。", "py": "Wǒ shì Zhōngguórén.", "vi": "Tôi là người Trung Quốc."}, {"zh": "你是哪国人？", "py": "Nǐ shì nǎ guó rén?", "vi": "Bạn là người nước nào?"}, {"zh": "你工作忙吗？", "py": "Nǐ gōngzuò máng ma?", "vi": "Công việc của bạn bận không?"}], "texts": [{"num": 1, "title": "国籍与身份 · Quốc tịch & thân phận", "role": "Cốt lõi", "focus": "我是 + [quốc tịch] · 我的 + N (的)", "scene": "Trên sân trường, Lý Văn và Bạch Gia Nguyệt lần đầu gặp nhau và tiếp tục trò chuyện.", "dialogue": [{"speaker": "李文", "zh": "我是中国人。", "py": "Wǒ shì Zhōngguórén.", "vi": "Tôi là người Trung Quốc."}, {"speaker": "白家月", "zh": "我是法国人。我的中文老师也是中国人。", "py": "Wǒ shì Fǎguórén. Wǒ de Zhōngwén lǎoshī yě shì Zhōngguórén.", "vi": "Tôi là người Pháp. Giáo viên tiếng Trung của tôi cũng là người Trung Quốc."}], "hint": "🌍 Từ mới: 人 (rén) người · 的 (de) của · và tên riêng 中国 (Trung Quốc), 法国 (Pháp), 中文 (tiếng Trung)."}, {"num": 2, "title": "介绍别人 · Giới thiệu người khác", "role": "Mở rộng mẫu", "focus": "这是谁？ · 这是我 + N · 她也是 + [quốc tịch]", "scene": "Trong lớp học, sau giờ tan học, Annie đang xem ảnh trong điện thoại của Trần Thiên Trung.", "dialogue": [{"speaker": "安妮", "zh": "这是谁？", "py": "Zhè shì shéi?", "vi": "Đây là ai?"}, {"speaker": "陈天中", "zh": "这是我女朋友。", "py": "Zhè shì wǒ nǚpéngyou.", "vi": "Đây là bạn gái tôi."}, {"speaker": "安妮", "zh": "你女朋友是哪国人？", "py": "Nǐ nǚpéngyou shì nǎ guó rén?", "vi": "Bạn gái bạn là người nước nào?"}, {"speaker": "陈天中", "zh": "她也是泰国人。", "py": "Tā yě shì Tàiguórén.", "vi": "Cô ấy cũng là người Thái Lan."}], "tip": "💡 <b>谁</b> có hai cách đọc thường gặp: <b>shéi</b> và <b>shuí</b>."}, {"num": 3, "title": "视频电话 · Gọi điện video", "role": "Tái sử dụng", "focus": "你...忙吗？ · 还很忙 · 不太忙 · 想你/你们", "scene": "Ở nhà, Vương Nhất Tuyết gọi điện video cho Vương Nhất Phi.", "dialogue": [{"speaker": "王一雪", "zh": "喂，一飞！", "py": "Wèi, Yīfēi!", "vi": "Alo, Nhất Phi!"}, {"speaker": "王一飞", "zh": "姐姐！", "py": "Jiějie!", "vi": "Chị ơi!"}, {"speaker": "王一雪", "zh": "你工作忙吗？", "py": "Nǐ gōngzuò máng ma?", "vi": "Công việc của em bận không?"}, {"speaker": "王一飞", "zh": "对，还很忙。你也忙吗？", "py": "Duì, hái hěn máng. Nǐ yě máng ma?", "vi": "Đúng vậy, vẫn rất bận. Chị cũng bận chứ?"}, {"speaker": "王一雪", "zh": "我不太忙。我们很想你。", "py": "Wǒ bú tài máng. Wǒmen hěn xiǎng nǐ.", "vi": "Chị không bận lắm. Cả nhà rất nhớ em."}, {"speaker": "王一飞", "zh": "我也想你们。", "py": "Wǒ yě xiǎng nǐmen.", "vi": "Em cũng nhớ mọi người."}], "tip": "💡 <b>喂</b> đọc <b>wèi</b> (thanh 4) khi nghe máy; cũng có cách đọc <b>wéi</b>."}], "hanzi_chars": ["人", "的", "中", "国", "法", "文", "这", "谁", "女", "朋", "友", "哪", "她", "泰", "喂", "姐", "工", "作", "还", "忙", "吗", "对", "太", "想"], "grammar": [{"title": "“是”字句 · Câu chữ 是", "structure": "主语 + 是 + Danh từ/Cụm danh từ　(phủ định: 主语 + 不是 + ...)", "exp": "是 dùng để biểu thị người/sự vật tương đương, đồng nhất với một đối tượng hoặc thuộc về một phạm trù. Dạng phủ định dùng 不是 (bú shì – không phải là).", "examples": [{"zh": "我是法国人。", "py": "Wǒ shì Fǎguórén.", "vi": "Tôi là người Pháp."}, {"zh": "她是中文老师。", "py": "Tā shì Zhōngwén lǎoshī.", "vi": "Cô ấy là giáo viên tiếng Trung."}, {"zh": "我老师不是法国人。", "py": "Wǒ lǎoshī bú shì Fǎguórén.", "vi": "Giáo viên của tôi không phải là người Pháp."}]}, {"title": "结构助词 “的” · Trợ từ kết cấu 的", "structure": "定语 Định ngữ + 的 + 中心语 Trung tâm ngữ", "exp": "的 đặt giữa định ngữ và trung tâm ngữ, biểu thị quan hệ sở hữu hoặc hạn định/bổ nghĩa.", "examples": [{"zh": "白家月的中文老师", "py": "Bái Jiāyuè de Zhōngwén lǎoshī", "vi": "Giáo viên tiếng Trung của Bạch Gia Nguyệt."}, {"zh": "你的名字", "py": "Nǐ de míngzi", "vi": "Tên của bạn."}], "note": "⚠️ Khi định ngữ là đại từ nhân xưng và trung tâm ngữ là người thân/quan hệ thân thiết, có thể bỏ 的: 我姐姐 (chị tôi), 我妈妈 (mẹ tôi), 我朋友 (bạn tôi)."}, {"title": "“吗” 是非问句 · Câu hỏi Có/Không với 吗", "structure": "Câu trần thuật + 吗？", "exp": "吗 là trợ từ ngữ khí đặt ở cuối câu trần thuật để biến thành câu hỏi Có/Không, không đổi trật tự từ.", "examples": [{"zh": "你工作忙吗？", "py": "Nǐ gōngzuò máng ma?", "vi": "Công việc của bạn bận không?"}, {"zh": "我工作很忙。", "py": "Wǒ gōngzuò hěn máng.", "vi": "Công việc của tôi rất bận. (trả lời khẳng định)"}, {"zh": "我不太忙。", "py": "Wǒ bú tài máng.", "vi": "Tôi không bận lắm. (trả lời phủ định)"}]}], "exercises": [{"type": 1, "title": "1. 找不同类词 · Chọn từ khác loại", "prompt": "Trong 4 từ sau, từ nào  {"item": "致谢语 · Cảm ơn", "example": "谢谢！"}, {"item": "告别语 · Tạm biệt", "example": "再见！"}, {"item": "致歉语 · Xin lỗi", "example": "对不起。"}, {"item": "自我介绍 · Tự giới thiệu", "example": "我叫李文。"}, {"item": "“是”字句 · Câu 是", "example": "我是学生。"}, {"item": "结构助词“的” · Trợ từ 的", "example": "我的中文老师。"}, {"item": "“吗”是非问句 · Câu hỏi Có/Không", "example": "你是学生吗？"}], "can_do": [{"label": "听懂 · Nghe hiểu", "zh": "你是哪国人？", "py": "Nǐ shì nǎ guó rén?", "vi": "Bạn là người nước nào?"}, {"label": "回答 · Trả lời", "zh": "我是越南人。", "py": "Wǒ shì Yuènánrén.", "vi": "Tôi là người Việt Nam."}, {"label": "询问 · Hỏi", "zh": "你是学生吗？", "py": "Nǐ shì xuésheng ma?", "vi": "Bạn là học sinh/sinh viên phải không?"}, {"label": "介绍 · Giới thiệu", "zh": "这是我的中文老师。", "py": "Zhè shì wǒ de Zhōngwén lǎoshī.", "vi": "Đây là giáo viên tiếng Trung của tôi."}, {"label": "表达 · Biểu đạt", "zh": "我也很高兴认识你。", "py": "Wǒ yě hěn gāoxìng rènshi nǐ.", "vi": "Tôi cũng rất vui được làm quen với bạn."}], "checklist": ["Tôi có thể hiểu và sử dụng tốt từ vựng bài 1-3.", "Tôi tự tin nói quốc tịch, giới thiệu người khác và hỏi–đáp với 吗.", "Tôi có thể đọc hiểu đoạn hội thoại ngắn và viết các chữ Hán trọng tâm."]}}, "4": {"id": 4, "title_vi": "Tôi có hai đứa con", "title_zh": "我有两个孩子", "can_do": "Sau bài học này, bạn có thể dùng câu chữ 有 để nói về sở hữu, dùng 呢 để hỏi ngược lại, dùng số từ + lượng từ (个/口), và hỏi–đáp tuổi bằng 几岁 / 多大.", "goals": ["“有”字句 · Dùng câu chữ 有 để biểu thị sở hữu người/vật (phủ định: 没有).", "“A……，B呢？” · Dùng 呢 để hỏi ngược lại đối phương.", "数词 & 量词 · Nắm cách dùng số từ và lượng từ (个, 口).", "年龄 · Hỏi và trả lời tuổi phù hợp với từng đối tượng (几岁 / 多大 / 多大年纪)."], "core_patterns": [{"zh": "S + 有 + (số + lượng từ) + N", "py": "... yǒu ...", "vi": "Sở hữu: có ..."}, {"zh": "S + 没有 + N", "py": "... méiyǒu ...", "vi": "Phủ định: không có"}, {"zh": "A……，你呢？", "py": "... nǐ ne?", "vi": "Hỏi ngược lại: còn bạn?"}, {"zh": "几岁？ / 多大？", "py": "jǐ suì? / duō dà?", "vi": "Hỏi tuổi (nhỏ / lớn)"}], "preview_vocab": [{"hz": "有", "vi": "có"}, {"hz": "没有", "vi": "không có"}, {"hz": "几", "vi": "mấy"}, {"hz": "口", "vi": "(lượng từ người nhà)"}, {"hz": "岁", "vi": "tuổi"}, {"hz": "呢", "vi": "còn...?"}, {"hz": "多大", "vi": "bao nhiêu tuổi"}], "warmup_type": "matching", "warmup": [{"zh": "五 · 哥哥 · 五个学生", "py": "wǔ · gēge · wǔ gè xuésheng", "vi": "năm · anh trai · năm học sinh"}, {"zh": "六十岁 · 我妈妈 · 我的老师", "py": "liùshí suì · wǒ māma · wǒ de lǎoshī", "vi": "sáu mươi tuổi · mẹ tôi · giáo viên của tôi"}], "warmup_preview": [{"zh": "我有两个孩子。", "py": "Wǒ yǒu liǎng gè háizi.", "vi": "Tôi có hai đứa con."}, {"zh": "你家有几口人？", "py": "Nǐ jiā yǒu jǐ kǒu rén?", "vi": "Nhà bạn có mấy người?"}, {"zh": "他今年五岁。", "py": "Tā jīnnián wǔ suì.", "vi": "Cậu bé năm nay năm tuổi."}], "texts": [{"num": 1, "title": "在家里 · Ở nhà", "role": "Cốt lõi", "focus": "S + 有 + 数 + 量 + N (她有二十个学生)", "scene": "Ở nhà, Lưu Minh và Vương Nhất Tuyết đang trò chuyện.", "dialogue": [{"speaker": "刘明", "zh": "一飞忙吗？", "py": "Yīfēi máng ma?", "vi": "Nhất Phi bận không?"}, {"speaker": "王一雪", "zh": "她很忙。", "py": "Tā hěn máng.", "vi": "Cô ấy rất bận."}, {"speaker": "刘明", "zh": "她有多少个学生？", "py": "Tā yǒu duōshao gè xuésheng?", "vi": "Cô ấy có bao nhiêu học sinh?"}, {"speaker": "王一雪", "zh": "她有二十个学生。", "py": "Tā yǒu èrshí gè xuésheng.", "vi": "Cô ấy có hai mươi học sinh."}], "tip": "🔑 Điểm cần chú ý: <b>她 + 有 + 二十 + 个 + 学生</b> = S + 有 + Số + Lượng từ + Danh từ."}, {"num": 2, "title": "在公司里 · Ở công ty", "role": "Mở rộng mẫu", "focus": "A……，你呢？ · 没有 · 几口人", "scene": "Ở công ty, Vương Nhất Tuyết và Dương Đồng Lạc trò chuyện lúc nghỉ.", "dialogue": [{"speaker": "王一雪", "zh": "我有两个哥哥，你呢？", "py": "Wǒ yǒu liǎng gè gēge, nǐ ne?", "vi": "Tôi có hai anh trai, còn bạn?"}, {"speaker": "杨同乐", "zh": "我没有哥哥。", "py": "Wǒ méiyǒu gēge.", "vi": "Tôi không có anh trai."}, {"speaker": "王一雪", "zh": "你家有几口人？", "py": "Nǐ jiā yǒu jǐ kǒu rén?", "vi": "Nhà bạn có mấy người?"}, {"speaker": "杨同乐", "zh": "我家有四口人，爸爸、妈妈、妹妹和我。", "py": "Wǒ jiā yǒu sì kǒu rén, bàba, māma, mèimei hé wǒ.", "vi": "Nhà tôi có bốn người: bố, mẹ, em gái và tôi."}], "tip": "🔑 <b>我有两个哥哥，你呢？</b> → cấu trúc <b>A……，B呢？</b> (nói về mình rồi hỏi lại đối phương)."}, {"num": 3, "title": "在街上 · Trên đường", "role": "Tái sử dụng", "focus": "两个孩子·一个儿子·一个女儿 · 几岁 / 多大", "scene": "Trên đường, Vương Nhất Tuyết dẫn con trai và tình cờ gặp Dương Đồng Lạc.", "dialogue": [{"speaker": "杨同乐", "zh": "这是您儿子吗？", "py": "Zhè shì nín érzi ma?", "vi": "Đây là con trai của chị phải không?"}, {"speaker": "王一雪", "zh": "是的。我有两个孩子，一个儿子，一个女儿。", "py": "Shì de. Wǒ yǒu liǎng gè háizi, yí gè érzi, yí gè nǚ'ér.", "vi": "Đúng vậy. Tôi có hai đứa con: một con trai, một con gái."}, {"speaker": "杨同乐", "zh": "您儿子几岁？", "py": "Nín érzi jǐ suì?", "vi": "Con trai chị mấy tuổi rồi?"}, {"speaker": "王一雪", "zh": "他今年五岁。", "py": "Tā jīnnián wǔ suì.", "vi": "Cậu bé năm nay năm tuổi."}, {"speaker": "杨同乐", "zh": "您女儿多大？", "py": "Nín nǚ'ér duō dà?", "vi": "Con gái chị bao nhiêu tuổi rồi?"}, {"speaker": "王一雪", "zh": "她今年十二。", "py": "Tā jīnnián shí'èr.", "vi": "Cháu năm nay mười hai tuổi."}], "tip": "💡 Dưới 10 tuổi hỏi bằng <b>几岁</b>; từ 10 tuổi trở lên thường không dùng 几岁 mà dùng <b>多大</b>."}], "hanzi_chars": ["有", "多", "少", "个", "哥", "呢", "没", "家", "几", "口", "爸", "妈", "妹", "和", "儿", "孩", "子", "岁", "他", "今", "年", "大", "刘", "明", "杨", "同", "乐", "零", "百", "千", "万"], "grammar": [{"title": "“有”字句（1）· Câu chữ 有", "structure": "主语 + 有 + 宾语　(phủ định: 主语 + 没有 + 宾语)", "exp": "有 biểu thị sự sở hữu / có người hoặc vật. Phủ định dùng 没有 (méiyǒu). ⚠️ Không dùng 不有 để phủ định 有.", "examples": [{"zh": "她有二十个学生。", "py": "Tā yǒu èrshí gè xuésheng.", "vi": "Cô ấy có 20 học sinh."}, {"zh": "她有一个姐姐。", "py": "Tā yǒu yí gè jiějie.", "vi": "Cô ấy có một người chị gái."}, {"zh": "我没有姐姐。", "py": "Wǒ méiyǒu jiějie.", "vi": "Tôi không có chị gái."}]}, {"title": "数字的表达 · Cách biểu đạt số", "structure": "Số hàng chục + 十 + Số hàng đơn vị　·　bỏ trống hàng giữa → dùng 零", "exp": "Số 0–10: 零一二三四五六七八九十. Số 11–99: hàng chục + 十 + hàng đơn vị (二十二 = 二+十+二 = 22). Số 100–9999: 一百 (100), 二百零八 (208 — dùng 零 nối khi hàng giữa trống), 一千 (1000), 一千五百二十八 (1528).", "examples": [{"zh": "二十二", "py": "èrshí'èr", "vi": "22 = 20 + 2"}, {"zh": "二百零八", "py": "èrbǎi líng bā", "vi": "208 (dùng 零 nối)"}, {"zh": "一千五百二十八", "py": "yìqiān wǔbǎi èrshí'bā", "vi": "1528"}], "note": "⭐ 二 vs 两: 二 dùng trong số đếm/số thứ tự (十二, 第二); 两 dùng trước lượng từ khi chỉ số lượng cụ thể (两个人, 两个学生, 两口人). Quy tắc: <b>二 + số/thứ tự</b>, <b>两 + lượng từ + danh từ</b>."}, {"title": "语气助词 “呢” · Trợ từ ngữ khí 呢", "structure": "A……，B呢？", "exp": "呢 đặt cuối câu để hỏi lại đối phương về thông tin vừa được đề cập (A nói về mình → hỏi lại B).", "examples": [{"zh": "我有两个哥哥，你呢？", "py": "Wǒ yǒu liǎng gè gēge, nǐ ne?", "vi": "Tôi có hai anh trai, còn bạn?"}, {"zh": "我叫白家月，你呢？", "py": "Wǒ jiào Bái Jiāyuè, nǐ ne?", "vi": "Tôi tên Bạch Gia Nguyệt, còn bạn?"}, {"zh": "我是中国人，你呢？", "py": "Wǒ shì Zhōngguórén, nǐ ne?", "vi": "Tôi là người Trung Quốc, còn bạn?"}]}, {"title": "名量词和名量结构 · Lượng từ & cấu trúc Số + Lượng từ + Danh từ", "structure": "数词 + 量词 + 名词 (Số từ + Lượng từ + Danh từ)", "exp": "Khi biểu đạt số lượng người/vật, cần lượng từ phù hợp sau số từ. Bài này: 个 (lượng từ chung — 两个学生), 口 (thành viên gia đình — 四口人).", "examples": [{"zh": "四口人", "py": "sì kǒu rén", "vi": "4 người trong gia đình"}, {"zh": "两个学生", "py": "liǎng gè xuésheng", "vi": "2 học sinh"}]}, {"title": "年龄的问法 · Cách hỏi tuổi", "structure": "几岁 (trẻ nhỏ) · 多大 (người trẻ/bạn bè) · 多大年纪 (lịch sự/người lớn tuổi)", "exp": "Hỏi tuổi phải chọn cách theo đối tượng: 👶 trẻ nhỏ → 几岁; 🧑 người trẻ/bạn bè → 多大; 👴 người lớn tuổi/lịch sự → 多大年纪.", "examples": [{"zh": "你今年几岁？", "py": "Nǐ jīnnián jǐ suì?", "vi": "Cháu năm nay mấy tuổi?"}, {"zh": "你今年多大？", "py": "Nǐ jīnnián duō dà?", "vi": "Bạn năm nay bao nhiêu tuổi?"}, {"zh": "您今年多大年纪？", "py": "Nín jīnnián duō dà niánjì?", "vi": "Ông/bà năm nay bao nhiêu tuổi rồi?"}]}], "exercises": [{"type": 1, "title": "1. 找不同类词 · Chọn từ khác loại", "prompt": "Trong 4 ái.)", "passage_lines": [{"zh": "王一雪：我有两个孩子，一个儿子，一个女儿。", "py": "Wáng Yīxuě: Wǒ yǒu liǎng gè háizi, yí gè érzi, yí gè nǚ'ér."}, {"zh": "杨同乐：您儿子几岁？", "py": "Yáng Tónglè: Nín érzi jǐ suì?"}, {"zh": "王一雪：他今年五岁。", "py": "Wáng Yīxuě: Tā jīnnián wǔ suì."}]}, {"type": 6, "title": "6. 完成对话 · Hoàn thành hội thoại", "prompt": "Chọn câu phù hợp để hoàn thành hội thoại:", "options": [{"hz": "我家有四口人。", "correct": true, "py": "Wǒ jiā yǒu sì kǒu rén."}, {"hz": "我今年五岁。", "correct": false, "py": "Wǒ jīnnián wǔ suì."}, {"hz": "我没有哥哥。", "correct": false, "py": "Wǒ méiyǒu gēge."}], "ok_msg": "Chính xác! Trả lời số người trong nhà: 我家有四口人。", "bad_msg": "Chưa đúng. Câu hỏi 几口人 cần trả lời số người: 我家有...口人。", "stem": "A：你家有几口人？<br>B：____", "stem_py": "A: Nǐ jiā yǒu jǐ kǒu rén?  B: ____"}], "recall": [{"hz": "有", "py": "yǒu", "vi": "có"}, {"hz": "多少", "py": "duōshao", "vi": "bao nhiêu"}, {"hz": "个", "py": "gè", "vi": "(lượng từ chung)"}, {"hz": "哥哥", "py": "gēge", "vi": "anh trai"}, {"hz": "呢", "py": "ne", "vi": "còn...?"}, {"hz": "没有", "py": "méiyǒu", "vi": "không có"}, {"hz": "家", "py": "jiā", "vi": "nhà"}, {"hz": "几", "py": "jǐ", "vi": "mấy"}, {"hz": "口", "py": "kǒu", "vi": "(lượng từ người nhà)"}, {"hz": "孩子", "py": "háizi", "vi": "con cái"}, {"hz": "岁", "py": "suì", "vi": "tuổi"}, {"hz": "多大", "py": "duō dà", "vi": "bao nhiêu tuổi"}], "final_use": {"intro": "Ghép lại thành một màn hỏi–đáp về gia đình và tuổi hoàn chỉnh, dùng 有 / 没有 / 呢 / 几岁 / 多大.", "dialogue": [{"who": "A", "zh": "你家有几口人？", "py": "Nǐ jiā yǒu jǐ kǒu rén?"}, {"who": "B", "zh": "我家有四口人。我有两个哥哥，你呢？", "py": "Wǒ jiā yǒu sì kǒu rén. Wǒ yǒu liǎng gè gēge, nǐ ne?"}, {"who": "A", "zh": "我没有哥哥。你今年多大？", "py": "Wǒ méiyǒu gēge. Nǐ jīnnián duō dà?"}, {"who": "B", "zh": "我今年二十岁。", "py": "Wǒ jīnnián èrshí suì."}], "task": "Thay bằng thông tin thật của bạn: số người trong nhà (...口人), anh/chị/em bạn có (有.../没有...), và tuổi (multiplechoice 几岁/多大 tùy đối tượng). Hỏi lại bạn cùng học bằng 你呢？."}}, "5": {"id": 5, "title_vi": "Hôm nay tôi h": "星期日。今天我休息。", "py": "Xīngqīrì. Jīntiān wǒ xiūxi.", "vi": "Chủ nhật. Hôm nay tôi nghỉ ngơi."}], "tip": "💡 <b>9月8号</b> cũng có thể nói <b>9月8日</b> (jiǔ yuè bā rì) — cách nói văn viết/trang trọng. <b>星期日</b> = <b>星期天</b> (xīngqītiān), đều là Chủ nhật."}, {"num": 2, "title": "在公司里 · Ở công ty (giờ nghỉ)", "role": "Mở rộng mẫu", "focus": "你会做饭吗？ · 你会做什么？ · 我会做...", "scene": "Ở công ty, Vương Nhất Tuyết và Dương Đồng Lạc trò chuyện lúc nghỉ ngơi.", "dialogue": [{"speaker": "王一雪", "zh": "你会做饭吗？", "py": "Nǐ huì zuòfàn ma?", "vi": "Bạn biết nấu ăn không?"}, {"speaker": "杨同乐", "zh": "我会做。", "py": "Wǒ huì zuò.", "vi": "Tôi biết làm."}, {"speaker": "王一雪", "zh": "你会做什么？", "py": "Nǐ huì zuò shénme?", "vi": "Bạn biết làm món gì?"}, {"speaker": "杨同乐", "zh": "我会做面条儿、饺子，也会做一些菜。星期日我也做饭。", "py": "Wǒ huì zuò miàntiáor, jiǎozi, yě huì zuò yìxiē cài. Xīngqīrì wǒ yě zuòfàn.", "vi": "Tôi biết làm mì sợi, sủi cảo, cũng biết nấu một vài món. Chủ nhật tôi cũng nấu cơm."}]}, {"num": 3, "title": "在公司里 · Ở công ty (tan làm)", "role": "Tái sử dụng", "focus": "下班吗？ · 这是你的新电脑吗？ · 真好看 · 我很喜欢它", "scene": "Ở công ty, Vương Nhất Tuyết và Dương Đồng Lạc trò chuyện lúc tan làm.", "dialogue": [{"speaker": "王一雪", "zh": "同乐，下班吗？", "py": "Tónglè, xiàbān ma?", "vi": "Đồng Lạc, tan làm à?"}, {"speaker": "杨同乐", "zh": "下班。", "py": "Xiàbān.", "vi": "Tan làm."}, {"speaker": "王一雪", "zh": "这是你的新电脑吗？", "py": "Zhè shì nǐ de xīn diànnǎo ma?", "vi": "Đây là máy tính mới của bạn phải không?"}, {"speaker": "杨同乐", "zh": "是的，是我的新电脑。", "py": "Shì de, shì wǒ de xīn diànnǎo.", "vi": "Đúng vậy, đây là máy tính mới của tôi."}, {"speaker": "王一雪", "zh": "真好看！", "py": "Zhēn hǎokàn!", "vi": "Đẹp thật đấy!"}, {"speaker": "杨同乐", "zh": "我也很喜欢它。", "py": "Wǒ yě hěn xǐhuan tā.", "vi": "Tôi cũng rất thích nó."}]}], "hanzi_chars": ["今", "天", "号", "月", "日", "星", "期", "休", "息", "会", "做", "饭", "面", "条", "饺", "菜", "些", "下", "班", "新", "电", "脑", "真", "好", "看", "喜", "欢", "它"], "grammar": [{"title": "时间的表达（1）· Cách biểu đạt thời gian", "structur e": 2, "title": "2. 判断逻辑正误 · Đúng hay sai", "prompt": "Khi đọc số điện thoại, số 1 thường đọc thành “yāo”. Nhận định này đúng hay sai?", "stem": "读手机号时，数字 “1” 读成 “yāo”。", "stem_py": "Dú shǒujī hào shí, shùzì “1” dú chéng “yāo”.", "options": [{"hz": "对", "py": "duì", "correct": true}, {"hz": "错", "py": "cuò", "correct": false}], "ok_msg": "Chính xác! Đọc số điện thoại đọc từng chữ, số 1 đọc là yāo (tránh nhầm 七 qī).", "bad_msg": "Chưa đúng — số 1 trong số điện thoại đọc là yāo."}, {"type": 3, "title": "3. 选词填空 · Chọn từ điền vào chỗ trống", "prompt": "Chọn từ thích hợp điền vào chỗ trống:", "stem": "我想 ____ 超市买牛奶。", "stem_py": "Wǒ xiǎng ____ chāoshì mǎi niúnǎi.", "options": [{"hz": "去", "py": "qù", "correct": true}, {"hz": "坐", "py": "zuò", "correct": false}, {"hz": "多少", "py": "duōshao", "correct": false}], "ok_msg": "Chính xác! 我想去超市买牛奶 — câu liên động (đi... để mua...).", "bad_msg": "Chưa đúng. Chỗ trống cần động từ 去: 我想去超市买牛奶。"}, {"type": 4, "title": "4. 连词成句 · Sắp xếp câu từ thẻ Pinyin", "prompt": "Nghĩa cần diễn đạt: \"Chúng ta đi taxi đến nhà hàng Tây An.\" — Bấm các mảnh Pinyin theo thứ tự đúng:", "tokens": ["Wǒmen", "zuò", "chūzūchē", "qù", "Xī'ān Fàndiàn", "。"], "correct_order": ["Wǒmen", "zuò", "chūzūchē", "qù", "Xī'ān Fàndiàn", "。"], "ok_msg": "Rất tốt! 我们坐出租车去西安饭店。"}, {"type": 5, "title": "5. 看文本回答 · Đọc đoạn văn trả lời", "prompt": "Đọc đoạn hội thoại rồi trả lời câu hỏi:", "passage_lines": [{"zh": "王一雪：星期天我们去哪儿吃晚饭？", "py": "Wáng Yīxuě: Xīngqītiān wǒmen qù nǎr chī wǎnfàn?"}, {"zh": "刘明：我还想去西安饭店。我们坐出租车去。", "py": "Liú Míng: Wǒ hái xiǎng qù Xī'ān Fàndiàn. Wǒmen zuò chūzūchē qù."}], "question": "Cả nhà đi đến nhà hàng bằng phương tiện gì?", "options": [{"hz": "出租车", "py": "chūzūchē", "correct": true}, {"hz": "牛奶", "py": "niúnǎi", "correct": false}, {"hz": "包子", "py": "bāozi", "correct": false}], "ok_msg": "Chính xác! 坐出租车去 — họ đi bằng taxi.", "bad_msg": "Đọc lại: \"我们坐出租车去\" — đi bằng taxi."}, {"type": 6, "title": "6. 完成对话 · Hoàn thành hội thoại", "prompt : "否定 “不想” · Không muốn", "example": "我不想吃包子。"}, {"item": "连动句 mục đích · Đi... để...", "example": "我去超市买东西。"}, {"item": "连动句 phương thức · Đi bằng...", "example": "我坐出租车去。"}, {"item": "疑问代词 “怎么” · Hỏi cách thức", "example": "我们怎么去？"}], "can_do": [{"label": "询问 · Hỏi", "zh": "你的手机号是多少？", "py": "Nǐ de shǒujī hào shì duōshao?", "vi": "Số điện thoại của bạn là bao nhiêu?"}, {"label": "表达 · Nói mong muốn", "zh": "我想去超市买牛奶。", "py": "Wǒ xiǎng qù chāoshì mǎi niúnǎi.", "vi": "Tôi muốn đi siêu thị mua sữa."}, {"label": "询问 · Hỏi cách thức", "zh": "我们怎么去？", "py": "Wǒmen zěnme qù?", "vi": "Chúng ta đi bằng cách nào?"}, {"label": "回答 · Trả lời phương thức", "zh": "坐出租车去。", "py": "Zuò chūzūchē qù.", "vi": "Đi taxi đi."}], "checklist": ["Tôi có thể hỏi và đọc số điện thoại (đọc từng chữ số, 1 đọc yāo).", "Tôi dùng được 想 / 不想 để nói mong muốn.", "Tôi đặt được câu liên động (mục đích & phương thức) và hỏi bằng 怎么."]}}, "7": {"id": 7, "title_vi": "Tôi tan làm lúc 6 rưỡi tối", "title_zh": "我晚上六点半下班", "can_do": "Sau bài học này, bạn có thể nói giờ giấc (点/分/半, kèm buổi 早上/上午/下午/晚上), dùng 吧 để gợi ý–thương lượng, dùng 呢 để xác nhận sự việc, và đặt đúng vị trí trạng ngữ thời gian/phó từ trước động từ.", "goals": ["时间的表达 · Nghe hiểu và mô tả thời gian diễn ra sự việc (点/分/半 + từ chỉ buổi).", "语气助词 “吧”(1) · Dùng 吧 để đưa ra lời gợi ý, thương lượng nhẹ nhàng.", "语气助词 “呢”(2) · Dùng 呢 để xác nhận/nhấn mạnh một sự thật đang diễn ra.", "状语位置 · Đặt đúng vị trí phó từ (还/也/不) và từ chỉ thời gian làm trạng ngữ (trước động từ)."], "core_patterns": [{"zh": "[buổi] + [số]点([số]分/半)", "py": "...diǎn...fēn/bàn", "vi": "Nói giờ: buổi + giờ phút"}, {"zh": "……吧", "py": "... ba", "vi": "Gợi ý / thương lượng: ...nhé/đi"}, {"zh": "……呢", "py": "... ne", "vi": "Xác nhận sự việc: ...đấy/cơ"}, {"zh": "S + [thời gian/phó từ] + V", "py": "...", "vi": "Trạng ngữ đứng trước động từ"}], "preview_vocab": [{"hz": "现在", "vi": "bây giờ"}, {"hz": "点", "vi": "giờ"}, {"hz": "分", "vi": "phút"}, {"hz": "半", "vi": "rưỡi"}, {"hz": "吧", "vi": "nhé/đi"}, {"hz": "呢", "vi": "đấy/cơ"}, {"hz": "下班", "vi": "tan làm"}], "warmup_type": "matching", "warmup": [{"zh": "八点十五分 · 十二点半 · 晚上六点", "py": "bā diǎn shíwǔ fēn · shí'èr diǎn bàn · wǎnshang liù diǎn", "vi": "8:15 · 12 rưỡi · 6 giờ tối"}, {"zh": "上午十点十分 · 下午三点二十分 · 下午一点四十五分", "py": "shàngwǔ shí diǎn shí fēn · xiàwǔ sān diǎn èrshí fēn · xiàwǔ yì diǎn sìshíwǔ fēn", "vi": "10:10 sáng · 15:20 · 13:45"}], "warmup_preview": [{"zh": "现在几点？", "py": "Xiànzài jǐ diǎn?", "vi": "Bây giờ mấy giờ?"}, {"zh": "我们下午两点见吧。", "py": "Wǒmen xiàwǔ liǎng diǎn jiàn ba.", "vi": "Chiều 2 giờ gặp nhau nhé."}, {"zh": "我在家呢。", "py": "Wǒ zài jiā ne.", "vi": "Mình đang ở nhà nè."}], "texts": [{"num": 1, "title": "打电话 · Hẹn giờ gặp", "role": "Cốt lõi", "focus": "现在几点？ · 早上八点四十 · ……见吧", "scene": "Bạch Gia Nguyệt và Annie đang gọi điện thoại.", "dialogue": [{"speaker": "安妮", "zh": "现在几点？", "py": "Xiànzài jǐ diǎn?", "vi": "Bây giờ là mấy giờ?"}, {"speaker": "白家月", "zh": "早上八点四十。", "py": "Zǎoshang bā diǎn sìshí.", "vi": "8 giờ 40 phút sáng."}, {"speaker": "安妮", "zh": "我上午十点十分有课。", "py": "Wǒ shàngwǔ shí diǎn shí fēn yǒu kè.", "vi": "Sáng nay 10 giờ 10 phút mình có tiết học."}, {"speaker": "白家月", "zh": "好的，我们下午两点见吧。", "py": "Hǎo de, wǒmen xiàwǔ liǎng diǎn jiàn ba.", "vi": "Được thôi, chiều nay 2 giờ chúng ta gặp nhau nhé."}], "tip": "💡 Từ phương vị <b>里</b> khi đứng sau danh từ như 家, 超市, 店 thường đọc thanh nhẹ <b>li</b> (家里, 店里)."}, {"num": 2, "title": "在校园里 · Rủ đi xem phim", "role": "Mở rộng mẫu", "focus": "你去吗？ · 不想去 · 明天呢？ · ……上课呢", "scene": "Trên sân trường, Lý Văn gặp Bạch Gia Nguyệt.", "dialogue": [{"speaker": "李文", "zh": "下午我想去电影院看电影，你去吗？", "py": "Xiàwǔ wǒ xiǎng qù diànyǐngyuàn kàn diànyǐng, nǐ qù ma?", "vi": "Chiều nay mình muốn đi rạp xem phim, bạn đi không?"}, {"speaker": "白家月", "zh": "我不想去，下午还有事。", "py": "Wǒ bù xiǎng qù, xiàwǔ hái yǒu shì.", "vi": "Mình không muốn đi, chiều nay còn có việc bận."}, {"speaker": "李文", "zh": "好的。明天呢？", "py": "Hǎo de. Míngtiān ne?", "vi": "Được rồi. Thế còn ngày mai?"}, {"speaker": "白家月", "zh": "我明天下午两点还要上课呢，四点半下课。", "py": "Wǒ míngtiān xiàwǔ liǎng diǎn hái yào shàngkè ne, sì diǎn bàn xiàkè.", "vi": "Chiều mai 2 giờ mình vẫn còn phải lên lớp đấy, 4 giờ rưỡi mới tan học."}]}, {"num": 3, "title": "打电话 · Nhờ mua đồ", "role": "Tái sử dụng", "focus": "你在哪儿呢？ · 我在家呢 · 六点半下班 · ……买些菜吧", "scene": "Vương Nhất Tuyết ở văn phòng gọi điện thoại cho Lưu Minh.", "dialogue": [{"speaker": "王一雪", "zh": "喂，你在哪儿呢？", "py": "Wéi, nǐ zài nǎr ne?", "vi": "Alo, anh đang ở đâu thế?"}, {"speaker": "刘明", "zh": "我在家呢。", "py": "Wǒ zài jiā ne.", "vi": "Anh đang ở nhà nè."}, {"speaker": "王一雪", "zh": "我晚上六点半下班。", "py": "Wǒ wǎnshang liù diǎn bàn xiàbān.", "vi": "Em tối 6 giờ rưỡi mới tan ca."}, {"speaker": "刘明", "zh": "我八点去医院上班。", "py": "Wǒ bā diǎn qù yīyuàn shàngbān.", "vi": "Tối 8 giờ anh đi bệnh viện đi làm."}, {"speaker": "王一雪", "zh": "好的，你去店里买些菜吧。", "py": "Hǎo de, nǐ qù diàn lǐ mǎi xiē cài ba.", "vi": "Được thôi, anh ra cửa hàng mua ít rau/món ăn nhé."}, {"speaker": "刘明", "zh": "好，我十分钟后去。", "py": "Hǎo, wǒ shí fēnzhōng hòu qù.", "vi": "Được, 10 phút nữa anh đi."}]}], "hanzi_chars": ["现", "在", "点", "早", "上", "午", "分", "课", "下", "见", "吧", "影", "院", "看", "事", "呢", "半", "家", "里", "晚", "班", "店", "菜", "钟", "后"], "grammar": [{"title": "时间的表达（2）· Cách biểu đạt thời gian", "structure": "giờ chẵn: 数+点　·　giờ lẻ: 数+点+数+分　·　rưỡi: 数+点+半　·　dưới 10 phút thêm 零　·　từ chỉ buổi đứng TRƯỚC mốc giờ", "exp": "Nói giờ: 点 (giờ), 分 (phút), 半 (rưỡi). Phút dưới 10 đọc thêm 零 (líng). Các từ chỉ buổi 早上/上午/中午/下午/晚上 luôn đứng trước mốc giờ cụ thể.", "examples": [{"zh": "中午十二点", "py": "zhōngwǔ shí'èr diǎn", "vi": "12 giờ trưa"}, {"zh": "下午两点半", "py": "xiàwǔ liǎng diǎn bàn", "vi": "2 giờ rưỡi chiều"}, {"zh": "晚上九点十分", "py": "wǎnshang jiǔ diǎn shí fēn", "vi": "9 giờ 10 phút tối"}]}, {"title": "语气助词 “吧”(1) · Trợ từ ngữ khí 吧", "structure": "Câu trần thuật + 吧", "exp": "吧 đặt cuối câu trần thuật để biểu thị lời đề nghị, gợi ý hoặc thương lượng một cách nhẹ nhàng, lịch sự.", "examples": [{"zh": "我们下午两点见面吧。", "py": "Wǒmen xiàwǔ liǎng diǎn jiànmiàn ba.", "vi": "Chúng ta gặp nhau lúc 2 giờ chiều nhé."}, {"zh": "你去超市买点东西吧。", "py": "Nǐ qù chāoshì mǎi diǎn dōngxi ba.", "vi": "Bạn đi siêu thị mua ít đồ đi."}]}, {"title": "副词、时间词作状语的位置 · Vị trí trạng ngữ", "structure": "主语 + [时间 / 副词] + 动词 (+宾语)", "exp": "Phó từ (还/也/不) và từ/cụm chỉ thời gian khi làm trạng ngữ thường đứng TRƯỚC động từ vị ngữ hoặc tính từ.", "examples": [{"zh": "我不想去。", "py": "Wǒ bù xiǎng qù.", "vi": "Tôi không muốn đi. (不 trước 想去)"}, {"zh": "妹妹下午两点上课。", "py": "Mèimei xiàwǔ liǎng diǎn shàngkè.", "vi": "Em gái lên lớp lúc 2 giờ chiều. (thời gian trước 上课)"}, {"zh": "她上午十点半上课呢。", "py": "Tā shàngwǔ shí diǎn bàn shàngkè ne.", "vi": "Cô ấy học lúc 10 rưỡi sáng đấy."}]}, {"title": "语气助词 “呢”(2) · Trợ từ ngữ khí 呢", "structure": "主语 + 谓语 + 呢", "exp": "呢 đặt cuối câu khẳng định để nhấn mạnh, xác nhận một sự thực hoặc trạng thái đang diễn ra, làm câu nói tự nhiên, mềm mại hơn.", "examples": [{"zh": "我明天下午两点还要上课呢。", "py": "Wǒ míngtiān xiàwǔ liǎng diǎn hái yào shàngkè ne.", "vi": "Chiều mai 2 giờ tôi vẫn còn phải đi học đấy."}, {"zh": "妹妹会做两个菜呢。", "py": "Mèimei huì zuò liǎng gè cài ne.", "vi": "Em gái biết nấu hai món ăn cơ đấy."}, {"zh": "李文晚上还要工作呢。", "py": "Lǐ Wén wǎnshang hái yào gōngzuò ne.", "vi": "Lý Văn tối vẫn còn phải làm việc đấy."}]}], "exercises": [{"type": 1, "title": "1. 找不同类词 · Chọn từ khác loại", "prompt": "Trong 4 từ sau, từ nào KHÔNG chỉ thời gian?", "options": [{"hz": "早上", "py": "zǎoshang", "correct": false}, {"hz": "下午", "py": "xiàwǔ", "correct": false}, {"hz": "电影院", "py": "diànyǐngyuàn", "correct": true}, {"hz": "晚上", "py": "wǎnshang", "correct": false}], "ok_msg": "Chính xác! 电影院 (rạp chiếu phim) là địa điểm, còn lại chỉ buổi trong ngày.", "bad_msg": "Chưa đúng. 电影院 là nơi chốn, khác nhóm với 早上/下午/晚上."}, {"type": 2, "title": "2. 判断逻辑正误 · Đúng hay sai", "prompt": "Từ chỉ buổi (早上/下午/晚上) đứng TRƯỚC mốc giờ. Nhận định này đúng hay sai?", "stem": "“晚上” 放在 “六点半” 在家呢。", "py": "Wǒ zài jiā ne.", "correct": true}, {"hz": "我们下午两点见吧。", "py": "Wǒmen xiàwǔ liǎng diǎn jiàn ba.", "correct": false}, {"hz": "现在几点？", "py": "Xiànzài jǐ diǎn?", "correct": false}], "ok_msg": "Chính xác! Trả lời 你在哪儿呢 bằng: 我在家呢 (dùng 呢 xác nhận).", "bad_msg": "Chưa đúng. Câu hỏi 你在哪儿呢？ cần trả lời nơi chốn: 我在家呢。"}], "recall": [{"hz": "现在", "py": "xiànzài", "vi": "bây giờ"}, {"hz": "点", "py": "diǎn", "vi": "giờ"}, {"hz": "分", "py": "fēn", "vi": "phút"}, {"hz": "半", "py": "bàn", "vi": "rưỡi"}, {"hz": "上午", "py": "shàngwǔ", "vi": "buổi sáng"}, {"hz": "下午", "py": "xiàwǔ", "vi": "buổi chiều"}, {"hz": "晚上", "py": "wǎnshang", "vi": "buổi tối"}, {"hz": "吧", "py": "ba", "vi": "nhé/đi"}, {"hz": "呢", "py": "ne", "vi": "đấy/cơ"}, {"hz": "见", "py": "jiàn", "vi": "gặp"}, {"hz": "下班", "py": "xiàbān", "vi": "tan làm"}, {"hz": "上课", "py": "shàngkè", "vi": "lên lớp"}], "final_use": {"intro": "Ghép lại thành một màn gọi điện hẹn giờ hoàn chỉnh, dùng cách nói giờ + 吧 (gợi ý) + 呢 (xác nhận).", "dialogue": [{"who": "A", "zh": "喂，你在哪儿呢？", "py": "Wéi, nǐ zài nǎr ne?"}, {"who": "B", "zh": "我在家呢。现在几点？", "py": "Wǒ zài jiā ne. Xiànzài jǐ diǎn?"}, {"who": "A", "zh": "下午两点。我们三点见吧。", "py": "Xiàwǔ liǎng diǎn. Wǒmen sān diǎn jiàn ba."}, {"who": "B", "zh": "好的，我三点还要上课呢，四点见吧。", "py": "Hǎo de, wǒ sān diǎn hái yào shàngkè ne, sì diǎn jiàn ba."}], "task": "Thay bằng lịch thật của bạn: nói mấy giờ bạn tan học/tan làm (点/半 + buổi), rủ bạn gặp nhau bằng 吧, và xác nhận một việc đang bận bằng 呢. Đọc to cả đoạn."}}, "8": {"id": 8, "title_vi": "Bố tôi cũng làm việc ở bệnh viện", "title_zh": "我爸爸也在医院工作", "can_do": "Sau bài học này, bạn có thể mô tả vị trí bằng danh từ phương vị (上/下/里/外/前/后), dùng giới từ 在 + địa điểm + động từ để nói nơi diễn ra hành động, và dùng 能/不能 để nói khả năng/điều kiện.", "goals": ["方位词 · Nghe hiểu và mô tả địa điểm, vị trí bằng danh từ phương vị (上/下/里/外/前/后).", "介词 “在” · Dùng 在 + địa điểm + động từ để biểu thị nơi diễn ra hành động.", "能愿动词 “能” · Nắm cách dùng 能 (khả năng i đơn giản về giá cả hàng hóa.", "形容词谓语句 · Nắm cách dùng câu vị ngữ tính từ (không cần 是).", "疑问代词 “怎么样” · Nắm cách dùng 怎么样 để hỏi tình trạng/ý kiến.", "文化 · Nhận biết đơn vị và cách biểu đạt tiền tệ (人民币: 元/角/分, khẩu ngữ 块/毛)."], "core_patterns": [{"zh": "(这个)多少钱(一个)？", "py": "duōshao qián (yí gè)?", "vi": "Hỏi giá"}, {"zh": "数 + 块 + (数) — vd 三块五", "py": "... kuài ...", "vi": "Nói giá khẩu ngữ"}, {"zh": "S + (很/真/非常/不) + 形容词", "py": "...", "vi": "Câu vị ngữ tính từ"}, {"zh": "(这个) + 怎么样？", "py": "... zěnmeyàng?", "vi": "Hỏi ý kiến/nhận xét"}], "preview_vocab": [{"hz": "多少钱", "vi": "bao nhiêu tiền"}, {"hz": "块", "vi": "đồng (tệ)"}, {"hz": "便宜", "vi": "rẻ"}, {"hz": "贵", "vi": "đắt"}, {"hz": "怎么样", "vi": "thế nào"}, {"hz": "衣服", "vi": "quần áo"}, {"hz": "苹果", "vi": "quả táo"}], "warmup_type": "matching", "warmup": [{"zh": "衣服 · 便宜 · 苹果", "py": "yīfu · piányi · píngguǒ", "vi": "quần áo · rẻ · quả táo"}, {"zh": "穿 · 杯子 · 商店", "py": "chuān · bēizi · shāngdiàn", "vi": "mặc · cái cốc · cửa hàng"}], "warmup_preview": [{"zh": "多少钱一个？", "py": "Duōshao qián yí gè?", "vi": "Bao nhiêu tiền một cái?"}, {"zh": "这儿的苹果真便宜！", "py": "Zhèr de píngguǒ zhēn piányi!", "vi": "Táo ở đây rẻ thật!"}, {"zh": "这件衣服怎么样？", "py": "Zhè jiàn yīfu zěnmeyàng?", "vi": "Chiếc áo này thế nào?"}], "texts": [{"num": 1, "title": "在小店 · Mua cốc", "role": "Cốt lõi", "focus": "有...吗？ · 多少钱一个？ · ...块钱一个 · 我买这个吧", "scene": "Trong một cửa hàng nhỏ, Vương Nhất Tuyết đang mua cốc.", "dialogue": [{"speaker": "王一雪", "zh": "请问，有杯子吗？", "py": "Qǐngwèn, yǒu bēizi ma?", "vi": "Xin hỏi, có cốc không?"}, {"speaker": "售货员", "zh": "有，杯子在这边。", "py": "Yǒu, bēizi zài zhèbiān.", "vi": "Có chứ, cốc ở phía bên này."}, {"speaker": "王一雪", "zh": "多少钱一个？", "py": "Duōshao qián yí gè?", "vi": "Bao nhiêu tiền một cái?"}, {"speaker": "售货员", "zh": "这些五块钱一个，那些十块钱一个。", "py": "Zhèxiē wǔ kuài qián yí gè, nàxiē shí kuài qián yí gè.", "vi": "Những cái này 5 tệ một cái, những cái kia 10 tệ một cái."}, {"speaker": "王一雪", "zh": "我买这个吧。", "py": "Wǒ
