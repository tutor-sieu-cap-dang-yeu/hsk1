:root { --han-font: 'HanKai', 'KaiTi', 'STKaiti', serif; }

/* Chinese character font (楷 Khải thư · Ma Shan Zheng, SIL OFL) — Hán tự only */
.d-ruby .rhz, .d-ruby .rp,
.rhz, .d-zh, .stroke-zh, .hz,
.recall-card .recall-zh, .recall-card > div:first-child,
.big, .cc-hz, .q-prompt .big { font-family: var(--han-font); }
:root {
  --forest: #013220; --moss: #006D6F; --teal: #007A74;
  --mint: #D8BFD8; --sage: #F5F5DC; --sand: #FFFAF0; --shell: #FFF5EE; --white: #FFFAFA;
  --blue: #2563EB; --blue-light: #EFF6FF;
  --amber: #D97706; --amber-light: #FFFBEB;
  --red: #DC2626; --red-light: #FEF2F2; --green-success: #16A34A; --green-light: #F0FDF4;
  --text-dark: #013220; --text-mid: #006D6F; --text-soft: #5F8A80;
  --plum: #645078; --cal-head: #5F7A63;
  --border: #E3DED0;
  --shadow-sm: 0 1px 3px rgba(1,50,32,.08);
  --shadow-md: 0 4px 16px rgba(1,50,32,.12);
  --shadow-lg: 0 8px 32px rgba(1,50,32,.16);
  --radius: 12px; --radius-sm: 8px; --radius-lg: 20px;
  --t1: #c0392b; --t2: #d19a00; --t3: #1f8a4c; --t4: #2657c9; --t5: #8a8f99;
  font-size: 16px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  color: var(--text-dark);
  line-height: 1.6;
  background: var(--sand);
}
a { color: inherit; text-decoration: none; }

/* App Shell */
.app-shell { display: flex; min-height: 100vh; }

/* Sidebar */
.sidebar {
  width: 270px;
  flex-shrink: 0;
  background: var(--forest);
  color: var(--white);
  position: fixed;
  top: 0;
  left: 0;
  height: 100vh;
  display: flex;
  flex-direction: column;
  z-index: 100;
  transition: transform .25s ease;
}
.brand {
  padding: 20px 20px 14px;
  border-bottom: 1px solid rgba(255,255,255,.1);
}
.level-badge {
  display: inline-block;
  background: rgba(216,191,216,.2);
  color: var(--mint);
  border: 1px solid rgba(216,191,216,.3);
  font-size: 10px;
  font-weight: 800;
  letter-spacing: .5px;
  padding: 3px 9px;
  border-radius: 99px;
  text-transform: uppercase;
}
.brand h1 { font-size: 16px; font-weight: 800; margin-top: 8px; color: #fff; line-height: 1.3; }
.brand .cat { font-size: 12px; color: var(--mint); opacity: .85; margin-top: 2px; }

/* Section Tabs */
.sec-tabs { display: flex; gap: 2px; padding: 10px 12px 0; border-bottom: 1px solid rgba(255,255,255,.1); }
.sec-tab {
  flex: 1;
  text-align: center;
  font-size: 12px;
  font-weight: 700;
  padding: 8px 4px;
  color: rgba(255,255,255,.65);
  border-radius: 8px 8px 0 0;
  cursor: pointer;
  transition: all .2s;
}
.sec-tab.active { background: rgba(216,191,216,.18); color: #fff; border-bottom: 2px solid var(--mint); }
.sec-tab:hover:not(.active) { color: #fff; }

.nav { flex: 1; overflow-y: auto; padding: 8px 0 10px; }
.nav-list { display: none; }
.nav-list.active { display: block; }
.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 18px;
  font-size: 13px;
  font-weight: 500;
  color: rgba(255,255,255,.75);
  cursor: pointer;
  border-left: 3px solid transparent;
  transition: all .2s;
}
.nav-item:hover { background: rgba(216,191,216,.08); color: #fff; }
.nav-item.active {
  background: rgba(216,191,216,.15);
  color: #fff;
  border-left-color: var(--mint);
  font-weight: 700;
}
.nav-num {
  width: 24px;
  height: 24px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(255,255,255,.1);
  border-radius: 6px;
  font-size: 11px;
  font-weight: 800;
}
.nav-item.active .nav-num { background: var(--mint); color: var(--forest); }
.nav-txt { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav-count { font-size: 11px; color: rgba(216,191,216,.7); }

.progress-wrap { padding: 12px 20px; border-top: 1px solid rgba(255,255,255,.1); }
.progress-wrap .lbl { font-size: 11px; color: rgba(255,255,255,.7); margin-bottom: 6px; display: flex; justify-content: space-between; }
.progress-track { height: 6px; background: rgba(255,255,255,.1); border-radius: 99px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--mint); width: 0; transition: width .5s ease; }

/* Main Content Area */
.main { flex: 1; margin-left: 270px; min-width: 0; }
.topbar {
  display: none;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  background: var(--forest);
  color: #fff;
  position: sticky;
  top: 0;
  z-index: 90;
}
.hamburger { font-size: 22px; cursor: pointer; background: none; border: none; color: #fff; line-height: 1; }
.topbar .tt { font-size: 15px; font-weight: 700; }

/* Hero */
.hero {
  background: linear-gradient(135deg, var(--forest), var(--moss), var(--teal));
  color: #fff;
  padding: 36px 48px;
}
.hero .meta { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.hero .meta span {
  background: rgba(255,255,255,.15);
  color: #fff;
  font-size: 12px;
  font-weight: 600;
  padding: 4px 12px;
  border-radius: 99px;
}
.hero h2 { font-size: 28px; font-weight: 800; line-height: 1.25; }
.hero .zh { font-size: 22px; font-weight: 700; color: var(--mint); margin-top: 6px; }
.hero .sub-h { font-size: 14px; opacity: .92; margin-top: 12px; max-width: 680px; }
.hero-actions { margin-top: 16px; display: flex; gap: 10px; flex-wrap: wrap; }
.btn-hero-practice {
  background: var(--mint);
  color: var(--forest);
  font-weight: 800;
  padding: 9px 18px;
  border-radius: var(--radius-sm);
  border: none;
  cursor: pointer;
  font-size: 13px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: all .2s;
}
.btn-hero-practice:hover { background: #e8d4e8; transform: translateY(-1px); }

/* Toolbar */
.toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 12px;
  padding: 14px 48px;
  border-bottom: 1px solid var(--border);
  background: var(--white);
  position: sticky;
  top: 0;
  z-index: 80;
}
.btn {
  padding: 8px 16px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-weight: 700;
  border: none;
  cursor: pointer;
  transition: all .2s;
  font-family: inherit;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.btn-primary { background: var(--forest); color: #fff; }
.btn-primary:hover { background: var(--moss); transform: translateY(-1px); }
.btn-outline { background: transparent; color: var(--forest); border: 1.5px solid var(--border); }
.btn-outline:hover { border-color: var(--teal); background: var(--sage); }
.btn-outline.on { border-color: var(--moss); background: var(--sage); }
.spacer { flex: 1; }
.legend { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; font-size: 11px; color: var(--text-soft); }
.legend .tone { display: inline-flex; align-items: center; gap: 4px; }
.legend .dot { width: 10px; height: 10px; border-radius: 50%; }

/* Lesson Subnav Pills */
.lesson-layout { display: flex; align-items: flex-start; gap: 0; }
.lesson-content-col { flex: 1; min-width: 0; }
.subnav-bar {
  flex: 0 0 210px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 16px;
  background: var(--shell);
  border-right: 1px solid var(--border);
  position: sticky;
  top: 76px;
  align-self: flex-start;
  z-index: 40;
}
.subnav-pill {
  font-size: 12.5px;
  font-weight: 700;
  padding: 9px 14px;
  border-radius: var(--radius-sm);
  background: var(--white);
  border: 1px solid var(--border);
  color: var(--text-mid);
  cursor: pointer;
  white-space: normal;
  text-align: left;
  transition: all .15s;
}
.subnav-pill:hover { background: var(--sage); border-color: var(--teal); }
.subnav-pill.active { background: var(--forest); color: var(--mint); border-color: var(--forest); }
/* Warmup card grid (2 cột) */
.wu-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-bottom: 6px; }
.wu-card { display: flex; gap: 12px; background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
.wu-icon { flex: 0 0 46px; width: 46px; height: 46px; border-radius: 12px; background: var(--sage); display: flex; align-items: center; justify-content: center; font-size: 22px; }
.wu-body { flex: 1; min-width: 0; }

/* 方位词 — thẻ từ chỉ vị trí (SVG hộp) + filter + 3 cấu trúc + ví dụ cột */

  padding: 7px 12px;

  font-weight: 600;

"structure": "Chủ từ + động từ + túc từ · S + V + O", "explanation": "Tiếng Trung về cơ bản có trật tự Chủ ngữ + Vị ngữ + Tân ngữ (S + V + O). Ví dụ 我叫陈天中: 我 (chủ ngữ) + 叫 (vị ngữ) + 陈天中 (tân ngữ).", "examples": [{"zh": "我叫陈天中。", "py": "Wǒ jiào Chén Tiānzhōng.", "vi": "Tôi tên là Trần Thiên Trung.", "rb": [["Wǒ", "我"], ["jiào", "叫"], ["Chén", "陈"], ["Tiān", "天"], ["zhōng", "中"], ["", "。"]]}, {"zh": "你叫什么名字？", "py": "Nǐ jiào shénme míngzi?", "vi": "Bạn tên là gì?", "rb": [["Nǐ", "你"], ["jiào", "叫"], ["shén", "什"], ["me", "么"], ["míng", "名"], ["zi", "字"], ["", "？"]]}, {"zh": "我是学生。", "py": "Wǒ shì xuésheng.", "vi": "Tôi là học sinh.", "rb": [["Wǒ", "我"], ["shì", "是"], ["xué", "学"], ["sheng", "生"], ["", "。"]]}], "tip": "Mẹo: đọc lớn 3 câu ví dụ theo đúng thứ tự S → V → O để tạo phản xạ."}, {"lesson": 3, "title": "是 (shì) · Câu chữ 是", "structure": "Khẳng định: Chủ từ + 是 + …　·　Phủ định: Chủ từ + 不是 + …", "explanation": "是 (shì) = \"là\", nối chủ từ với tên gọi/danh tính, quốc tịch/quê quán, hoặc nghề nghiệp/vai trò. Cấu trúc: Chủ từ + 是 + [Tên / Quốc tịch / Nghề nghiệp]. Phủ định: thêm 不 trước 是 → 不是 (bú shì – không phải là).", "pairs": [{"aff": {"parts": [{"py": "Wǒ", "hz": "我"}, {"py": "shì", "hz": "是"}, {"py": "Fǎguó rén", "hz": "法国人。"}], "vi": "Tôi là người Pháp."}, "neg": {"parts": [{"py": "Wǒ", "hz": "我"}, {"py": "bú shì", "hz": "不是"}, {"py": "Fǎguó rén", "hz": "法国人。"}], "vi": "Tôi không phải là người Pháp."}}, {"aff": {"parts": [{"py": "Tā", "hz": "她"}, {"py": "shì", "hz": "是"}, {"py": "Zhōngwén", "hz": "中文"}, {"py": "lǎoshī", "hz": "老师。"}], "vi": "Cô ấy là giáo viên tiếng Trung."}, "neg": {"parts": [{"py": "Tā", "hz": "她"}, {"py": "bú shì", "hz": "不是"}, {"py": "Zhōngwén", "hz": "中文"}, {"py": "lǎoshī", "hz": "老师。"}], "vi": "Cô ấy không phải là giáo viên tiếng Trung."}}, {"aff": {"parts": [{"py": "Wǒ", "hz": "我"}, {"py": "lǎoshī", "hz": "老师"}, {"py": "shì", "hz": "是"}, {"py": "Fǎguó rén", "hz": "法国人。"}], "vi": "Giáo viên của tôi là người Pháp."}, "neg": {"parts": [{"py": "Wǒ", "hz": "我"}, {"py": "lǎoshī", "hz": "老师"}, {"py": "bú shì", "hz": "不是"}, {"py": "Fǎguó rén", "hz": "法国人。"}], "vi": "Giáo viên của tôi không phải là người Pháp."}}]}, {"layout": "accordion", "title": "Trợ từ kết cấu 的 (de) — Dịch là “của”", "banner": {"lead": "Cấu trúc cốt lõi", "rows": ["[Chủ sở hữu / Chi tiết phụ · <b>B</b>] &nbsp;+&nbsp; 的 (de) &nbsp;+&nbsp; [Cái chính · <b>A</b>]"]}, "intro_html": "<div style=\"background:var(--sage); border:1px solid var(--border); border-radius:var(--radius-sm); padding:14px 16px; margin-bottom:12px; line-height:1.65;\"><p style=\"margin:0 0 10px;\">Trợ từ kết cấu <b>的 (de)</b> là từ phụ đóng vai trò làm <b>cầu nối ngữ pháp</b>, dùng để liên kết người sở hữu hoặc đặc điểm mô tả với đối tượng chính trong câu. Từ này giúp thể hiện mối quan hệ sở hữu (dịch là “của”) hoặc làm rõ tính chất của sự vật, con người đi sau nó.</p><div style=\"padding-top:10px; border-top:1px dashed var(--border); font-weight:700; color:var(--forest);\">Khi muốn nói <b>“A CỦA B”</b>, người Trung Quốc nói ngược lại thành <b>“B 的 A”</b>.</div></div>", "acc_label": "Xem lưu ý & ví dụ chi tiết", "full_short": {"head": "⚠️ Lưu ý quan trọng:", "note": "Khi nói về <b>người thân trong gia đình</b> hoặc <b>người có mối quan hệ cực kỳ thân thiết</b>, bạn có thể <b>lược bỏ chữ 的 (de)</b> cho tự nhiên.", "full": {"label": "Nói đầy đủ", "py": [{"t": "Wǒ"}, {"t": "de", "hl": true}, {"t": "jiějie"}], "hz": [{"t": "我"}, {"t": "的", "hl": true}, {"t": "姐姐"}], "vi": [{"t": "Chị"}, {"t": "của", "hl": true}, {"t": "tôi"}]}, "short": {"label": "Nói rút gọn", "py": [{"t": "Wǒ"}, {"t": "jiějie"}], "hz": [{"t": "我"}, {"t": "姐姐"}], "vi": [{"t": "Chị tôi"}]}}, "breakdown": {"hint": "Phần ví dụ bên dưới", "rows": [{"tag": "B (Phụ)", "zh": "白家月", "vi": "Bạch Gia Nguyệt"}, {"tag": "A (Chính)", "zh": "中文老师", "vi": "Giáo viên tiếng Trung"}], "explain": "<b>Giải thích:</b> Bạch Gia Nguyệt &nbsp;<span style=\"color:var(--blue); font-weight:800;\">的 (de)</span>&nbsp; Giáo viên tiếng Trung", "sentence": {"parts": [{"py": "Bái Jiāyuè", "hz": "白家月"}, {"py": "de", "hz": "的"}, {"py": "Zhōngwén", "hz": "中文"}, {"py": "lǎoshī", "hz": "老师"}], "vi": "Giáo viên tiếng Trung của Bạch Gia Nguyệt"}}, "tip": "💡 <b>Quy tắc ngược</b>: muốn nói “A của B” thì tiếng Trung nói “B 的 A”. Ví dụ 白家月的中文老师 = giáo viên tiếng Trung <b>của</b> Bạch Gia Nguyệt.", "lesson": 3, "explanation": "的 là trợ từ kết cấu nối B (chủ sở hữu / chi tiết phụ) với A (đối tượng chính): “A của B” → tiếng Trung nói “B 的 A”.", "structure": "[Chủ sở hữu · B] + 的 (de) + [Cái chính · A]"}, {"lesson": 3, "title": "“吗” 是非问句 · Câu hỏi Có/Không với 吗", "structure": "Câu trần thuật + 吗？", "explanation": "吗 là trợ từ ngữ khí đặt ở cuối câu trần thuật để biến thành câu hỏi Có/Không, không đổi trật tự từ.", "examples": [{"zh": "你工作忙吗？", "py": "Nǐ gōngzuò máng ma?", "vi": "Công việc của bạn bận không?", "rb": [["Nǐ", "你"], ["gōng", "工"], ["zuò", "作"], ["máng", "忙"], ["ma", "吗"], ["", "？"]]}, {"zh": "我工作很忙。", "py": "Wǒ gōngzuò hěn máng.", "vi": "Công việc của tôi rất bận. (trả lời khẳng định)", "rb": [["Wǒ", "我"], ["gōng", "工"], ["zuò", "作"], ["hěn", "很"], ["máng", "忙"], ["", "。"]]}, {"zh": "我不太忙。", "py": "Wǒ bú tài máng.", "vi": "Tôi không bận lắm. (trả lời phủ định)", "rb": [["Wǒ", "我"], ["bú", "不"], ["tài", "太"], ["máng", "忙"], ["", "。"]]}]}, {"lesson": 4, "title": "“有”字句（1）· Câu chữ 有", "structure": "主语 + 有 + 宾语　(phủ định: 主语 + 没有 + 宾语)", "explanation": "有 biểu thị sự sở hữu / có người hoặc vật. Phủ định dùng 没有 (méiyǒu). ⚠️ Không dùng 不有 để phủ định 有.", "examples": [{"zh": "她有二十个学生。", "py": "Tā yǒu èrshí gè xuésheng.", "vi": "Cô ấy có 20 học sinh.", "rb": [["Tā", "她"], ["yǒu", "有"], ["èr", "二"], ["shí", "十"], ["gè", "个"], ["xué", "学"], ["sheng", "生"], ["", "。"]]}, {"zh": "她有一个姐姐。", "py": "Tā yǒu yí gè jiějie.", "vi": "Cô ấy có một người chị gái.", "rb": [["Tā", "她"], ["yǒu", "有"], ["yí", "一"], ["gè", "个"], ["jiě", "姐"], ["jie", "姐"], ["", "。"]]}, {"zh": "我没有姐姐。", "py": "Wǒ méiyǒu jiějie.", "vi": "Tôi không có chị gái.", "rb": [["Wǒ", "我"], ["méi", "没"], ["yǒu", "有"], ["jiě", "姐"], ["jie", "姐"], ["", "。"]]}]}, {"lesson": 4, "title": "数字的表达 · Cách biểu đạt số", "structure": "Số hàng chục + 十 + Số hàng đơn vị　·　bỏ trống hàng giữa → dùng 零", "explanation": "Số 0–10: 零一二三四五六七八九十. Số 11–99: hàng chục + 十 + hàng đơn vị (二十二 = 二+十+二 = 22). Số 100–9999: 一百 (100), 二百零八 (208 — dùng 零 nối khi hàng giữa trống), 一千 (1000), 一千五百二十八 (1528).", "examples": [{"zh": "二十二", "py": "èrshí'èr", "vi": "22 = 20 + 2", "rb": [["èr", "二"], ["shí", "十"], ["'èr", "二"]]}, {"zh": "二百零八", "py": "èrbǎi líng bā", "vi": "208 (dùng 零 nối)", "rb": [["èr", "二"], ["bǎi", "百"], ["líng", "零"], ["bā", "八"]]}, {"zh": "一千五百二十八", "py": "yìqiān wǔbǎi èrshí'bā", "vi": "1528", "rb": [["yì", "一"], ["qiān", "千"], ["wǔ", "五"], ["bǎi", "百"], ["èr", "二"], ["shí", "十"], ["'bā", "八"]]}], "note": "⭐ 二 vs 两: 二 dùng trong số đếm/số thứ tự (十二, 第二); 两 dùng trước lượng từ khi chỉ số lượng cụ thể (两个人, 两个学生, 两口人). Quy tắc: <b>二 + số/thứ tự</b>, <b>两 + lượng từ + danh từ</b>."}, {"lesson": 4, "title": "语气助词 “呢” · Trợ từ ngữ khí 呢", "structure": "A……，B呢？", "explanation": "呢 đặt cuối câu để hỏi lại đối phương về thông tin vừa được đề cập (A nói về mình → hỏi lại B).", "examples": [{"zh": "我有两个哥哥，你呢？", "py": "Wǒ yǒu liǎng gè gēge, nǐ ne?", "vi": "Tôi có hai anh trai, còn bạn?", "rb": [["Wǒ", "我"], ["yǒu", "有"], ["liǎng", "两"], ["gè", "个"], ["gē", "哥"], ["ge", "哥"], ["", "，"], ["nǐ", "你"], ["ne", "呢"], ["", "？"]]}, {"zh": "我叫白家月，你呢？", "py": "Wǒ jiào Bái Jiāyuè, nǐ ne?", "vi": "Tôi tên Bạch Gia Nguyệt, còn bạn?", "rb": [["Wǒ", "我"], ["jiào", "叫"], ["Bái", "白"], ["Jiā", "家"], ["yuè", "月"], ["", "，"], ["nǐ", "你"], ["ne", "呢"], ["", "？"]]}, {"zh": "我是中国人，你呢？", "py": "Wǒ shì Zhōngguórén, nǐ ne?", "vi": "Tôi là người Trung Quốc, còn bạn?", "rb": [["Wǒ", "我"], ["shì", "是"], ["Zhōng", "中"], ["guó", "国"], ["rén", "人"], ["", "，"], ["nǐ", "你"], ["ne", "呢"], ["", "？"]]}]}, {"lesson": 4, "title": "名量词和名量结构 · Lượng từ & cấu trúc Số + Lượng từ + Danh từ", "structure": "数词 + 量词 + 名词 (Số từ + Lượng từ + Danh từ)", "explanation": "Khi biểu đạt số lượng người/vật, cần lượng từ phù hợp sau số từ. Bài này: 个 (lượng từ chung — 两个学生), 口 (thành viên gia đình — 四口人).", "examples": [{"zh": "四口人", "py": "sì kǒu rén", "vi": "4 người trong gia đình", "rb": [["sì", "四"], ["kǒu", "口"], ["rén", "人"]]}, {"zh": "两个学生", "py": "liǎng gè xuésheng", "vi": "2 học sinh", "rb": [["liǎng", "两"], ["gè", "个"], ["xué", "学"], ["sheng", "生"]]}]}, {"lesson": 4, "title": "年龄的问法 · Cách hỏi tuổi", "structure": "几岁 (trẻ nhỏ) · 多大 (người trẻ/bạn bè) · 多大年纪 (lịch sự/người lớn tuổi)", "explanation": "Hỏi tuổi phải chọn cách theo đối tượng: 👶 trẻ nhỏ → 几岁; 🧑 người trẻ/bạn bè → 多大; 👴 người lớn tuổi/lịch sự → 多大年纪.", "examples": [{"zh": "你今年几岁？", "py": "Nǐ jīnnián jǐ suì?", "vi": "Cháu năm nay mấy tuổi?", "rb": [["Nǐ", "你"], ["jīn", "今"], ["nián", "年"], ["jǐ", "几"], ["suì", "岁"], ["", "？"]]}, {"zh": "你今年多大？", "py": "Nǐ jīnnián duō dà?", "vi": "Bạn năm nay bao nhiêu tuổi?", "rb": [["Nǐ", "你"], ["jīn", "今"], ["nián", "年"], ["duō", "多"], ["dà", "大"], ["", "？"]]}, {"zh": "您今年多大年纪？", "py": "Nín jīnnián duō dà niánjì?", "vi": "Ông/bà năm nay bao nhiêu tuổi rồi?", "rb": [["Nín", "您"], ["jīn", "今"], ["nián", "年"], ["duō", "多"], ["dà", "大"], ["nián", "年"], ["jì", "纪"], ["", "？"]]}]}, {"lesson": 5, "title": "时间的表达（1）· Cách biểu đạt thời gian", "structure": "年 Năm → 月 Tháng → 日/号 Ngày → 星期 Thứ", "explanation": "Tiếng Trung biểu thị thời gian theo thứ tự từ lớn đến nhỏ: Năm → Tháng → Ngày → Thứ. 12 tháng = số + 月 (一月...十二月). Các thứ = 星期 + số (星期一...星期六), riêng Chủ nhật là 星期日 / 星期天.", "examples": [{"zh": "1992年5月16日 星期六", "py": "yī jiǔ jiǔ èr nián wǔ yuè shíliù rì xīngqīliù", "vi": "Thứ Bảy, ngày 16 tháng 5 năm 1992.", "rb": [["", "1"], ["", "9"], ["", "9"], ["", "2"], ["nián", "年"], ["", "5"], ["yuè", "月"], ["", "1"], ["", "6"], ["rì", "日"], ["", " "], ["xīng", "星"], ["qī", "期"], ["liù", "六"]]}, {"zh": "2024年10月22日 星期二", "py": "èr líng èr sì nián shí yuè èrshí'èr rì xīngqī'èr", "vi": "Thứ Ba, ngày 22 tháng 10 năm 2024.", "rb": [["", "2"], ["", "0"], ["", "2"], ["", "4"], ["nián", "年"], ["", "1"], ["", "0"], ["yuè", "月"], ["", "2"], ["", "2"], ["rì", "日"], ["", " "], ["xīng", "星"], ["qī", "期"], ["èr", "二"]]}]}, {"lesson": 5, "title": "名词谓语句 · Câu vị ngữ danh từ", "structure": "主语 + 名词性短语 (Chủ ngữ + cụm danh từ làm vị ngữ, không cần 是)", "explanation": "Một số câu tiếng Trung dùng danh từ/cụm danh từ trực tiếp làm vị ngữ, không cần 是. Thường dùng để nói ngày tháng, thứ, tuổi tác, thời gian.", "examples": [{"zh": "今天5月1号。", "py": "Jīntiān wǔ yuè yī hào.", "vi": "Hôm nay là ngày 1 tháng 5.", "rb": [["Jīn", "今"], ["tiān", "天"], ["", "5"], ["yuè", "月"], ["", "1"], ["hào", "号"], ["", "。"]]}, {"zh": "我妹妹12岁。", "py": "Wǒ mèimei shí'èr suì.", "vi": "Em gái tôi 12 tuổi.", "rb": [["Wǒ", "我"], ["mèi", "妹"], ["mei", "妹"], ["", "1"], ["", "2"], ["suì", "岁"], ["", "。"]]}, {"zh": "今天星期一。", "py": "Jīntiān xīngqīyī.", "vi": "Hôm nay là thứ Hai.", "rb": [["Jīn", "今"], ["tiān", "天"], ["xīng", "星"], ["qī", "期"], ["yī", "一"], ["", "。"]]}]}, {"lesson": 5, "title": "能愿动词 “会” · Động từ năng nguyện 会", "structure": "主语 + 会 + 动词 (+宾语)　·　phủ định: 主语 + 不会 + 动词　·　hỏi: ... + 会 + 动词 + 吗？", "explanation": "会 đứng trước động từ để biểu thị biết làm / có khả năng làm một việc nhờ học tập, rèn luyện. Phủ định dùng 不会 (đọc bú huì).", "examples": [{"zh": "你会做饭吗？", "py": "Nǐ huì zuòfàn ma?", "vi": "Bạn biết nấu ăn không?", "rb": [["Nǐ", "你"], ["huì", "会"], ["zuò", "做"], ["fàn", "饭"], ["ma", "吗"], ["", "？"]]}, {"zh": "我会做面条儿。", "py": "Wǒ huì zuò miàntiáor.", "vi": "Tôi biết làm mì sợi.", "rb": [["Wǒ", "我"], ["huì", "会"], ["zuò", "做"], ["miàn", "面"], ["tiáo", "条"], ["r", "儿"], ["", "。"]]}, {"zh": "我不会做菜。", "py": "Wǒ bú huì zuò cài.", "vi": "Tôi không biết nấu ăn.", "rb": [["Wǒ", "我"], ["bú", "不"], ["huì", "会"], ["zuò", "做"], ["cài", "菜"], ["", "。"]]}], "note": "⚠️ 不会 đọc là <b>bú huì</b> (不 đứng trước thanh 4 → đọc thành thanh 2)."}, {"lesson": 6, "title": "能愿动词 “想” · Động từ năng nguyện 想", "structure": "主语 + 想 + 动词　(phủ định: 主语 + 不想 + 动词)", "explanation": "想 đứng trước động từ để biểu thị mong muốn hoặc dự định thực hiện một hành động. Phủ định dùng 不想.", "examples": [{"zh": "我想去超市。", "py": "Wǒ xiǎng qù chāoshì.", "vi": "Tôi muốn đi siêu thị.", "rb": [["Wǒ", "我"], ["xiǎng", "想"], ["qù", "去"], ["chāo", "超"], ["shì", "市"], ["", "。"]]}, {"zh": "我哥哥不想休息。", "py": "Wǒ gēge bù xiǎng xiūxi.", "vi": "Anh trai tôi không muốn nghỉ ngơi.", "rb": [["Wǒ", "我"], ["gē", "哥"], ["ge", "哥"], ["bù", "不"], ["xiǎng", "想"], ["xiū", "休"], ["xi", "息"], ["", "。"]]}]}, {"lesson": 6, "title": "连动句（1）· Câu liên động", "structure": "① mục đích: 主语 + 动词1 + 宾语1 + 动词2 + 宾语2　·　② phương thức: 主语 + 坐/骑/开 + 交通工具 + 去/来/到 + 地点", "explanation": "Vị ngữ do hai hay nhiều cụm động từ tạo thành, các hành động có quan hệ mục đích hoặc phương thức. Thứ tự động từ = thứ tự thực hiện.", "examples": [{"zh": "我想去超市买东西。", "py": "Wǒ xiǎng qù chāoshì mǎi dōngxi.", "vi": "Đi siêu thị nhằm mục đích mua đồ.", "rb": [["Wǒ", "我"], ["xiǎng", "想"], ["qù", "去"], ["chāo", "超"], ["shì", "市"], ["mǎi", "买"], ["dōng", "东"], ["xi", "西"], ["", "。"]]}, {"zh": "我们去西安饭店吃晚饭。", "py": "Wǒmen qù Xī'ān Fàndiàn chī wǎnfàn.", "vi": "Đi nhà hàng Tây An để ăn tối.", "rb": [["Wǒ", "我"], ["men", "们"], ["qù", "去"], ["Xī", "西"], ["'ān", "安"], ["Fàn", "饭"], ["diàn", "店"], ["chī", "吃"], ["wǎn", "晚"], ["fàn", "饭"], ["", "。"]]}, {"zh": "我们坐出租车去西安饭店。", "py": "Wǒmen zuò chūzūchē qù Xī'ān Fàndiàn.", "vi": "Chúng ta đi taxi đến nhà hàng Tây An (phương thức).", "rb": [["Wǒ", "我"], ["men", "们"], ["zuò", "坐"], ["chū", "出"], ["zū", "租"], ["chē", "车"], ["qù", "去"], ["Xī", "西"], ["'ān", "安"], ["Fàn", "饭"], ["diàn", "店"], ["", "。"]]}]}, {"lesson": 6, "title": "疑问代词 “怎么” · Đại từ nghi vấn 怎么", "structure": "主语 + 怎么 + 动词？", "explanation": "怎么 đặt trước động từ để hỏi về cách thức / phương thức thực hiện hành động.", "examples": [{"zh": "我们怎么去？", "py": "Wǒmen zěnme qù?", "vi": "Chúng ta đi bằng cách nào?", "rb": [["Wǒ", "我"], ["men", "们"], ["zěn", "怎"], ["me", "么"], ["qù", "去"], ["", "？"]]}, {"zh": "她怎么去超市？", "py": "Tā zěnme qù chāoshì?", "vi": "Cô ấy đi siêu thị bằng cách nào?", "rb": [["Tā", "她"], ["zěn", "怎"], ["me", "么"], ["qù", "去"], ["chāo", "超"], ["shì", "市"], ["", "？"]]}]}, {"lesson": 7, "title": "时间的表达（2）· Cách biểu đạt thời gian", "structure": "giờ chẵn: 数+点　·　giờ lẻ: 数+点+数+分　·　rưỡi: 数+点+半　·　dưới 10 phút thêm 零　·　từ chỉ buổi đứng TRƯỚC mốc giờ", "explanation": "Nói giờ: 点 (giờ), 分 (phút), 半 (rưỡi). Phút dưới 10 đọc thêm 零 (líng). Các từ chỉ buổi 早上/上午/中午/下午/晚上 luôn đứng trước mốc giờ cụ thể.", "examples": [{"zh": "中午十二点", "py": "zhōngwǔ shí'èr diǎn", "vi": "12 giờ trưa", "rb": [["zhōng", "中"], ["wǔ", "午"], ["shí", "十"], ["'èr", "二"], ["diǎn", "点"]]}, {"zh": "下午两点半", "py": "xiàwǔ liǎng diǎn bàn", "vi": "2 giờ rưỡi chiều", "rb": [["xià", "下"], ["wǔ", "午"], ["liǎng", "两"], ["diǎn", "点"], ["bàn", "半"]]}, {"zh": "晚上九点十分", "py": "wǎnshang jiǔ diǎn shí fēn", "vi": "9 giờ 10 phút tối", "rb": [["wǎn", "晚"], ["shang", "上"], ["jiǔ", "九"], ["diǎn", "点"], ["shí", "十"], ["fēn", "分"]]}]}, {"lesson": 7, "title": "语气助词 “吧”(1) · Trợ từ ngữ khí 吧", "structure": "Câu trần thuật + 吧", "explanation": "吧 đặt cuối câu trần thuật để biểu thị lời đề nghị, gợi ý hoặc thương lượng một cách nhẹ nhàng, lịch sự.", "examples": [{"zh": "我们下午两点见面吧。", "py": "Wǒmen xiàwǔ liǎng diǎn jiànmiàn ba.", "vi": "Chúng ta gặp nhau lúc 2 giờ chiều nhé.", "rb": [["Wǒ", "我"], ["men", "们"], ["xià", "下"], ["wǔ", "午"], ["liǎng", "两"], ["diǎn", "点"], ["jiàn", "见"], ["miàn", "面"], ["ba", "吧"], ["", "。"]]}, {"zh": "你去超市买点东西吧。", "py": "Nǐ qù chāoshì mǎi diǎn dōngxi ba.", "vi": "Bạn đi siêu thị mua ít đồ đi.", "rb": [["Nǐ", "你"], ["qù", "去"], ["chāo", "超"], ["shì", "市"], ["mǎi", "买"], ["diǎn", "点"], ["dōng", "东"], ["xi", "西"], ["ba", "吧"], ["", "。"]]}]}, {"lesson": 7, "title": "副词、时间词作状语的位置 · Vị trí trạng ngữ", "structure": "主语 + [时间 / 副词] + 动词 (+宾语)", "explanation": "Phó từ (还/也/不) và từ/cụm chỉ thời gian khi làm trạng ngữ thường đứng TRƯỚC động từ vị ngữ hoặc tính từ.", "examples": [{"zh": "我不想去。", "py": "Wǒ bù xiǎng qù.", "vi": "Tôi không muốn đi. (不 trước 想去)", "rb": [["Wǒ", "我"], ["bù", "不"], ["xiǎng", "想"], ["qù", "去"], ["", "。"]]}, {"zh": "妹妹下午两点上课。", "py": "Mèimei xiàwǔ liǎng diǎn shàngkè.", "vi": "Em gái lên lớp lúc 2 giờ chiều. (thời gian trước 上课)", "rb": [["Mèi", "妹"], ["mei", "妹"], ["xià", "下"], ["wǔ", "午"], ["liǎng", "两"], ["diǎn", "点"], ["shàng", "上"], ["kè", "课"], ["", "。"]]}, {"zh": "她上午十点半上课呢。", "py": "Tā shàngwǔ shí diǎn bàn shàngkè ne.", "vi": "Cô ấy học lúc 10 rưỡi sáng đấy.", "rb": [["Tā", "她"], ["shàng", "上"], ["wǔ", "午"], ["shí", "十"], ["diǎn", "点"], ["bàn", "半"], ["shàng", "上"], ["kè", "课"], ["ne", "呢"], ["", "。"]]}]}, {"lesson": 7, "title": "语气助词 “呢”(2) · Trợ từ ngữ khí 呢", "structure": "主语 + 谓语 + 呢", "explanation": "呢 đặt cuối câu khẳng định để nhấn mạnh, xác nhận một sự thực hoặc trạng thái đang diễn ra, làm câu nói tự nhiên, mềm mại hơn.", "examples": [{"zh": "我明天下午两点还要上课呢。", "py": "Wǒ míngtiān xiàwǔ liǎng diǎn hái yào shàngkè ne.", "vi": "Chiều mai 2 giờ tôi vẫn còn phải đi học đấy.", "rb": [["Wǒ", "我"], ["míng", "明"], ["tiān", "天"], ["xià", "下"], ["wǔ", "午"], ["liǎng", "两"], ["diǎn", "点"], ["hái", "还"], ["yào", "要"], ["shàng", "上"], ["kè", "课"], ["ne", "呢"], ["", "。"]]}, {"zh": "妹妹会做两个菜呢。", "py": "Mèimei huì zuò liǎng gè cài ne.", "vi": "Em gái biết nấu hai món ăn cơ đấy.", "rb": [["Mèi", "妹"], ["mei", "妹"], ["huì", "会"], ["zuò", "做"], ["liǎng", "两"], ["gè", "个"], ["cài", "菜"], ["ne", "呢"], ["", "。"]]}, {"zh": "李文晚上还要工作呢。", "py": "Lǐ Wén wǎnshang hái yào gōngzuò ne.", "vi": "Lý Văn tối vẫn còn phải làm việc đấy.", "rb": [["Lǐ", "李"], ["Wén", "文"], ["wǎn", "晚"], ["shang", "上"], ["hái", "还"], ["yào", "要"], ["gōng", "工"], ["zuò", "作"], ["ne", "呢"], ["", "。"]]}]}, {"layout": "accordion", "title": "方位词 · Danh từ chỉ phương vị", "banner": {"rows": ["<div style=\"text-align:center; font-family:Georgia,'Times New Roman',serif; padding:4px 0;\"><span sty div><div class=\"fwx-hz\" style=\"color:var(--forest)\">小猫。</div></div><div class=\"fwx-vi\">Ngoài phòng có một con mèo nhỏ.</div></div><div class=\"fwx-item\"><div class=\"fwx-grid\" style=\"grid-template-columns:repeat(5,auto)\"><div class=\"fwx-py\" style=\"color:var(--forest)\">Yǐzi</div><div class=\"fwx-py\" style=\"color:#e03131\">xià</div><div class=\"fwx-py\" style=\"color:var(--forest)\">yǒu</div><div class=\"fwx-py\" style=\"color:var(--forest)\">yì běn</div><div class=\"fwx-py\" style=\"color:var(--forest)\">shū</div><div class=\"fwx-hz\" style=\"color:var(--forest)\">椅子</div><div class=\"fwx-hz\" style=\"color:#e03131\">下</div><div class=\"fwx-hz\" style=\"color:var(--forest)\">有</div><div class=\"fwx-hz\" style=\"color:var(--forest)\">一本</div><div class=\"fwx-hz\" style=\"color:var(--forest)\">书。</div></div><div class=\"fwx-vi\">Dưới ghế có một cuốn sách.</div></div><div class=\"fwx-item\"><div class=\"fwx-grid\" style=\"grid-template-columns:repeat(5,auto)\"><div class=\"fwx-py\" style=\"color:var(--forest)\">Xuéxiào</div><div class=\"fwx-py\" style=\"color:#e03131\">qián</div><div class=\"fwx-py\" style=\"color:var(--forest)\">yǒu</div><div class=\"fwx-py\" style=\"color:var(--forest)\">yì jiā</div><div class=\"fwx-py\" style=\"color:var(--forest)\">diànyǐngyuàn</div><div class=\"fwx-hz\" style=\"color:var(--forest)\">学校</div><div class=\"fwx-hz\" style=\"color:#e03131\">前</div><div class=\"fwx-hz\" style=\"color:var(--forest)\">有</div><div class=\"fwx-hz\" style=\"color:var(--forest)\">一家</div><div class=\"fwx-hz\" style=\"color:var(--forest)\">电影院。</div></div><div class=\"fwx-vi\">Trước trường học có một rạp chiếu phim.</div></div></div>", "lesson": 8, "structure": "Danh từ + 上 / 下 / 里 / 外 / 前 / 后", "explanation": "Danh từ chỉ phương vị (上/下/里/外/前/后) đứng SAU danh từ để chỉ rõ vị trí không gian của người/vật."}, {"lesson": 8, "title": "介词 “在” · Giới từ 在", "structure": "主语 + 在 + 地方 + 动词 + 宾语", "explanation": "Giới từ 在 kết hợp danh từ chỉ nơi chốn, đứng TRƯỚC động từ chính làm trạng ngữ, biểu thị địa điểm diễn ra hành động.", "examples": [{"zh": "我爸爸在医院工作。", "py": "Wǒ bàba zài yīyuàn gōngzuò.", "vi": "Bố tôi làm việc ở bệnh viện.", "rb": [["Wǒ", "我"], ["bà", "爸"], ["ba", "爸"], ["zài", "在"], ["yī", "医"], ["yuàn", "院"], ["gōng", "工"], ["zuò", "作"], ["", "。"]]}, {"zh": "我在学校吃午饭。", "py": "Wǒ zài xuéxiào chī wǔfàn.", "vi": "Tôi ăn trưa ở trường.", "rb": [["Wǒ", "我"], ["zài", "在"], ["xué", "学"], ["xiào", "校"], ["chī", "吃"], ["wǔ", "午"], ["fàn", "饭"], ["", "。"]]}, {"zh": "妹妹在家学习中文。", "py": "Mèimei zài jiā xuéxí Zhōngwén.", "vi": "Em gái học tiếng Trung ở nhà.", "rb": [["Mèi", "妹"], ["mei", "妹"], ["zài", "在"], ["jiā", "家"], ["xué", "学"], ["xí", "习"], ["Zhōng", "中"], ["wén", "文"], ["", "。"]]}]}, {"lesson": 8, "title": "能愿动词 “能” · Động từ năng nguyện 能", "structure": "主语 + 能 + 动词　(phủ định: 主语 + 不能 + 动词)", "explanation": "能 đứng trước động từ, biểu thị khả năng hoặc điều kiện khách quan cho phép thực hiện hành động. Phủ định dùng 不能.", "examples": [{"zh": "下午两点你能到吗？", "py": "Xiàwǔ liǎng diǎn nǐ néng dào ma?", "vi": "Chiều 2 giờ bạn có thể đến không?", "rb": [["Xià", "下"], ["wǔ", "午"], ["liǎng", "两"], ["diǎn", "点"], ["nǐ", "你"], ["néng", "能"], ["dào", "到"], ["ma", "吗"], ["", "？"]]}, {"zh": "我不能去买菜，我现在有事呢。", "py": "Wǒ bù néng qù mǎi cài, wǒ xiànzài yǒu shì ne.", "vi": "Tôi không thể đi mua rau, bây giờ tôi có việc bận rồi.", "rb": [["Wǒ", "我"], ["bù", "不"], ["néng", "能"], ["qù", "去"], ["mǎi", "买"], ["cài", "菜"], ["", "，"], ["wǒ", "我"], ["xiàn", "现"], ["zài", "在"], ["yǒu", "有"], ["shì", "事"], ["ne", "呢"], ["", "。"]]}]}, {"lesson": 9, "title": "存现句（1）· Câu tồn hiện", "structure": "地点 + 有 + 人 / 物", "explanation": "Câu tồn hiện dùng để miêu tả tại một địa điểm cụ thể CÓ sự hiện diện của người hoặc vật, thường dùng 有.", "examples": [{"zh": "学校前边有一家电影院。", "py": "Xuéxiào qiánbian yǒu yì jiā diànyǐngyuàn.", "vi": "Phía trước trường học có một rạp chiếu phim.", "rb": [["Xué", "学"], ["xiào", "校"], ["qián", "前"], ["bian", "边"], ["yǒu", "有"], ["yì", "一"], ["jiā", "家"], ["diàn", "电"], ["yǐng", "影"], ["yuàn", "院"], ["", "。"]]}, {"zh": "桌子上有一本书。", "py": "Zhuōzi shàng yǒu yì běn shū.", "vi": "Trên bàn có một cuốn sách.", "rb": [["Zhuō", "桌"], ["zi", "子"], ["shàng", "上"], ["yǒu", "有"], ["yì", "一"], ["běn", "本"], ["shū", "书"], ["", "。"]]}, {"zh": "椅子上有一只小猫。", "py": "Yǐzi shang yǒu yì zhī xiǎomāo.", "vi": "Trên ghế có một con mèo nhỏ.", "rb": [["Yǐ", "椅"], ["zi", "子"], ["shang", "上"], ["yǒu", "有"], ["yì", "一"], ["zhī", "只"], ["xiǎo", "小"], ["māo", "猫"], ["", "。"]]}]}, {"lesson": 9, "title": "时间 + 地点 的顺序 · Thứ tự Thời gian + Địa điểm", "structure": "主语 + 时间 + 在 + 地点 + 动词 + 宾语", "explanation": "Khi thời gian và địa điểm cùng làm trạng ngữ, THỜI GIAN đứng trước ĐỊA ĐIỂM. Nhớ: Thời gian → Địa điểm → Động từ.", "examples": [{"zh": "我明天上午在学校学习。", "py": "Wǒ míngtiān shàngwǔ zài xuéxiào xuéxí.", "vi": "Sáng mai tôi học ở trường.", "rb": [["Wǒ", "我"], ["míng", "明"], ["tiān", "天"], ["shàng", "上"], ["wǔ", "午"], ["zài", "在"], ["xué", "学"], ["xiào", "校"], ["xué", "学"], ["xí", "习"], ["", "。"]]}, {"zh": "安妮下午在家学习中文。", "py": "Ānnī xiàwǔ zài jiā xuéxí Zhōngwén.", "vi": "Chiều nay Annie học tiếng Trung ở nhà.", "rb": [["ān", "安"], ["nī", "妮"], ["xià", "下"], ["wǔ", "午"], ["zài", "在"], ["jiā", "家"], ["xué", "学"], ["xí", "习"], ["zhōng", "中"], ["wén", "文"], ["", "。"]]}, {"zh": "弟弟白天在家看电视。", "py": "Dìdi báitiān zài jiā kàn diànshì.", "vi": "Ban ngày em trai ở nhà xem tivi.", "rb": [["Dì", "弟"], ["di", "弟"], ["bái", "白"], ["tiān", "天"], ["zài", "在"], ["jiā", "家"], ["kàn", "看"], ["diàn", "电"], ["shì", "视"], ["", "。"]]}]}, {"lesson": 9, "title": "表示序数的 “第” · Tiền tố 第 (số thứ tự)", "structure": "第 + 数词 + [量词] + 名词", "explanation": "Thêm 第 trước số từ để biểu thị thứ tự: thứ nhất, thứ hai, thứ ba...", "examples": [{"zh": "第一本书", "py": "dì-yī běn shū", "vi": "cuốn sách thứ nhất", "rb": [["dì", "第"], ["yī", "一"], ["běn", "本"], ["shū", "书"]]}, {"zh": "第二个学生", "py": "dì-èr ge xuéshēng", "vi": "học sinh thứ hai", "rb": [["dì", "第"], /* AUDIO & SYNTHESIS */
const AUDIO_BASE = "https://static.xiehanzi.com/word_audios/";
let zhVoice = null;
function pickVoice() {
  if (window.speechSynthesis) {
    const vs = speechSynthesis.getVoices();
    zhVoice = vs.find(v => /zh(-|_)?(CN)?/i.test(v.lang)) || vs.find(v => /zh/i.test(v.lang)) || null;
  }
}
if (window.speechSynthesis) {
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;
}
function speak(text) {
  if (!window.speechSynthesis) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-CN';
    u.rate = 0.85;
    if (zhVoice) u.voice = zhVoice;
    speechSynthesis.speak(u);
  } catch(e) {}
}
function playAudio(text) {
  const clean = text.replace(/[，。！？、\s]/g, '');
  const a = new Audio(AUDIO_BASE + encodeURIComponent(clean) + ".mp3");
  let done = false;
  a.addEventListener('playing', () => done = true);
  a.addEventListener('error', () => { if (!done) speak(clean); });
  const p = a.play();
  if (p && p.catch) p.catch(() => { if (!done) speak(clean); });
  setTimeout(() => { if (!done) speak(clean); }, 1200);
}

/* PINYIN COLORING */
const TONE_MARKS = {'\u0304': 1, '\u0301': 2, '\u030c': 3, '\u0300': 4};
function sylTone(syl) {
  for (const ch of syl.normalize('NFD')) if (TONE_MARKS[ch]) return TONE_MARKS[ch];
  return 5;
}
function colorPy(pyStr) {
  if (!pyStr) return '';
  return pyStr.trim().split(/\s+/).map(s => `<span class="tone${sylTone(s)}">${s}</span>`).join(' ');
}
/* Ruby: render precomputed per-character [pinyin, hanzi] pairs (field rb).
   Falls back to plain zh+py stacking if rb is absent. */
function rubyZh(rb, zh, py) {
  if (Array.isArray(rb) && rb.length) {
    let out = '<span class="d-ruby">';
    for (const pair of rb) {
      const s = pair[0] || '';
      const ch = pair[1] || '';
      const optCls = pair[2] === 'opt' ? ' opt' : (pair[2] === 'hl' ? ' rz-hl' : '');
      if (s) {
        // any character that carries a pinyin (Han OR digit/latin) gets pinyin stacked above
        const cls = `tone${sylTone(s)}`;
        out += `<span class="rz${optCls}"><span class="rpy ${cls}">${s}</span><span class="rhz">${ch}</span></span>`;
      } else if (/[\u4e00-\u9fff]/.test(ch)) {
        out += `<span class="rz${optCls}"><span class="rpy"></span><span class="rhz">${ch}</span></span>`;
      } else if (ch === ' ') {
        out += '<span class="rp">&nbsp;</span>';
      } else {
        out += `<span class="rp">${ch}</span>`;
      }
    }
    out += '</span>';
    return out;
  }
  // fallback: stacked
  return `<div class="d-zh">${zh}</div><div class="d-py py-row">${colorPy(py)}</div>`;
}

/* S + V + O breakdown data (câu → thành phần Chủ/động/túc từ). Dùng cho điểm ngữ pháp
   基本语序 · Trật tự từ cơ bản, hiển thị ví dụ theo bố cục cột chức năng. */
const SVO_MAP = {
  "我叫陈天中。": [
    { label: "Chủ từ", py: "Wǒ", hz: "我" },
    { label: "động từ", py: "jiào", hz: "叫" },
    { label: "túc từ", py: "Chén Tiānzhōng", hz: "陈天中。" }
  ],
  "你叫什么名字？": [
    { label: "Chủ từ", py: "Nǐ", hz: "你" },
    { label: "động từ", py: "jiào", hz: "叫" },
    { label: "túc từ", py: "shénme míngzi", hz: "什么名字？" }
  ],
  "我是学生。": [
    { label: "Chủ từ", py: "Wǒ", hz: "我" },
    { label: "động từ", py: "shì", hz: "是" },
    { label: "túc từ", py: "xuésheng", hz: "学生。" }
  ]
};
/* Render 1 ví dụ theo bố cục 2 panel: trái = câu (pinyin/Hán/nghĩa), phải = lưới cột
   căn Hán tự dưới nhãn chức năng. Trả về '' nếu câu không có trong SVO_MAP. */
function svoDemo(ex, withAudio) {
  const parts = SVO_MAP[ex.zh];
  if (!parts) return '';
  const cols = parts.length * 2 - 1;
  const pyLine = parts.map(p => p.py).join(' ');
  const hzLine = parts.map(p => p.hz).join(' ');
  let labelRow = '', wordRow = '';
  parts.forEach((p, i) => {
    if (i > 0) { labelRow += '<div class="svo-plus">+</div>'; wordRow += '<div class="svo-gap"></div>'; }
    labelRow += `<div class="svo-label">${p.label}</div>`;
    wordRow += `<div class="svo-word">${p.hz}</div>`;
  });
  const audio = withAudio ? `<button class="icon-audio svo-s-audio" onclick="playAudio('${ex.zh}')">🔊</button>` : '';
  return `
    <div class="svo-demo">
      <div class="svo-sentence">
        ${audio}
        <div class="svo-s-py">${pyLine}</div>
        <div class="svo-s-hz">${hzLine}</div>
        <div class="svo-s-vi">${ex.vi || ''}</div>
      </div>
      <div class="svo-panel">
        <div class="svo-grid" style="grid-template-columns:repeat(${cols},auto)">
          ${labelRow}${wordRow}
        </div>
      </div>
    </div>`;
}
/* True khi điểm ngữ pháp là 基本语序 · Trật tự từ cơ bản (S + V + O) */
function isSvoPoint(g) { return !!(g && /S \+ V \+ O/.test(g.title || '')); }

/* Contrast-pair layout (khẳng định ↔ phủ định). Mỗi câu = mảng parts [{py,hz}];
   render pinyin (trên) căn cột trên Hán tự (dưới), rồi nghĩa tiếng Việt. Dùng cho các
   điểm ngữ pháp có cặp đối lập (vd 是/不是). Bật bằng field `pairs:[{aff,neg}]`. */
function contrastBlock(s) {
  const cols = s.parts.length;
  let pyRow = '', hzRow = '';
  s.parts.forEach(p => { pyRow += `<div class="cpair-py">${p.py}</div>`; hzRow += `<div class="cpair-hz">${p.hz}</div>`; });
  return `<div class="cpair-block">
    <div class="cpair-grid" style="grid-template-columns:repeat(${cols},auto)">${pyRow}${hzRow}</div>
    <div class="cpair-vi">${s.vi || ''}</div>
  </div>`;
}
function contrastPairs(pairs) {
  if (!Array.isArray(pairs) || !pairs.length) return '';
  return `<div class="cpair-wrap">${pairs.map(pr => `<div class="cpair-row">${contrastBlock(pr.aff)}${contrastBlock(pr.neg)}</div>`).join('')}</div>`;
}
/* 的 — khối "Nói đầy đủ / Nói rút gọn": mỗi token có cờ hl để tô xanh 的/de/của */
function deTok(arr) { return (arr || []).map(t => t.hl ? `<span class="de-hl">${t.t}</span>` : `<span>${t.t}</span>`).join(' '); }
function deCol(c) {
  return `<div class="dfs-col">
    <div class="dfs-label">${c.label}</div>
    <div class="dfs-py">${deTok(c.py)}</div>
    <div class="dfs-hz">${deTok(c.hz)}</div>
    <div class="dfs-vi">→ ${deTok(c.vi)}</div>
  </div>`;
}
function deFullShort(d) {
  if (!d) return '';
  return `<div class="de-note-box">
    ${d.head ? `<div class="de-note-head">${d.head}</div>` : ''}
    ${d.note ? `<div class="de-note-text">${d.note}</div>` : ''}
    <div class="dfs-wrap">${deCol(d.full)}${deCol(d.short)}</div>
  </div>`;
}
/* 的 — bảng phân vai B/A (trái) + câu ví dụ căn cột (phải, dùng lại contrastBlock) */
function deBreakdown(d) {
  if (!d) return '';
  const rows = (d.rows || []).map(r => `<div class="dbk-row">
    <div class="dbk-tag">${r.tag}</div>
    <div class="dbk-arrow">→</div>
    <div class="dbk-zh">${r.zh}</div>
    <div class="dbk-arrow">→</div>
    <div class="dbk-vi">${r.vi}</div>
  </div>`).join('');
  return `${d.hint ? `<div class="de-hint">${d.hint}</div>` : ''}
  <div class="dbk-wrap">
    <div class="dbk-left">
      ${rows}
      ${d.explain ? `<div class="dbk-explain">${d.explain}</div>` : ''}
    </div>
    <div class="dbk-right">${d.sentence ? contrastBlock(d.sentence) : ''}</div>
  </div>`;
}
/* Lịch thời gian — lưới thẻ 3 tầng: pinyin (nhỏ) · Hán tự (lớn, tím) · nghĩa (vừa) */
function timeCalendar(tc) {
  if (!tc) return '';
  const cell = (x) => `<div class="tcal-cell${x.wide ? ' wide' : ''}"><div class="tcal-py">${x.py}</div><div class="tcal-hz">${x.hz}</div><div class="tcal-vi">${x.vi}</div></div>`;
  const months = (tc.months || []).map(cell).join('');
  const days = (tc.days || []).map(cell).join('');
  return `<div class="tcal-wrap">
    <div class="tcal-head">${tc.months_label || 'THÁNG'}</div>
    <div class="tcal-grid tcal-months">${months}</div>
    <div class="tcal-head" style="margin-top:24px;">${tc.days_label || 'THỨ TRONG TUẦN'}</div>
    <div class="tcal-grid tcal-days">${days}</div>
    ${tc.note ? `<div class="tcal-note"><div class="info-box">${tc.note}</div></div>` : ''}
  </div>`;
}

/* SIDEBAR & NAVIGATION */
function buildNav() {
  const nl = document.getElementById('nav-lessons');
  nl.innerHTML = '';
  DATA.lessons.forEach((l, idx) => {
    const item = document.createElement('div');
    item.className = 'nav-item' + (l.id === currentLessonId ? ' active' : '');
    item.onclick = () => selectLesson(l.id);
    item.innerHTML = `<span class="nav-num">${l.id}</span>
      <div class="nav-txt">${l.tv}</div>
      <span class="nav-count">${l.words.length} từ</span>`;
    nl.appendChild(item);
  });

  const nt = document.getElementById('nav-topics');
  nt.innerHTML = '';
  DATA.topics.forEach((tp, idx) => {
    const item = document.createElement('div');
    item.className = 'nav-item';
    item.onclick = () => selectTopic(tp.slug);
    item.innerHTML = `<span class="nav-num">${idx + 1}</span>
      <div class="nav-txt">${tp.title}</div>
      <span class="nav-count">${tp.words.length}</span>`;
    nt.appendChild(item);
  });

  const ng = document.getElementById('nav-grammar');
  ng.innerHTML = '';
  const item = document.createElement('div');
  item.className = 'nav-item active';
  item.onclick = selectGrammar;
  item.innerHTML = `<span class="nav-num">★</span>
    <div class="nav-txt">Toàn bộ ${DATA.grammar.length} Ngữ pháp</div>
    <span class="nav-count">${DATA.grammar.length}</span>`;
  ng.appendChild(item);

  updateProgress();
}

function switchTab(sec) {
  currentSec = sec;
  document.querySelectorAll('.sec-tab').forEach(t => t.classList.toggle('active', t.dataset.sec === sec));
  document.querySelectorAll('.nav-list').forEach(l => l.classList.remove('active'));
  document.getElementById('nav-' + sec).classList.add('active');

  if (sec === 'lessons') selectLesson(currentLessonId);
  else if (sec === 'topics') selectTopic(DATA.topics[0].slug);
  else if (sec === 'grammar') selectGrammar();
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('backdrop').classList.toggle('show');
}

function selectLesson(id) {
  currentLessonId = id;
  document.querySelectorAll('#nav-lessons .nav-item').forEach((item, idx) => {
    item.classList.toggle('active', DATA.lessons[idx].id === id);
  });
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('backdrop').classList.remove('show');
  renderLesson(id);
}

function selectTopic(slug) {
  currentTopicSlug = slug;
  document.querySelectorAll('#nav-topics .nav-item').forEach((item, idx) => {
    item.classList.toggle('active', DATA.topics[idx].slug === slug);
  });
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('backdrop').classList.remove('show');
  renderTopic(slug);
}

function selectGrammar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('backdrop').classList.remove('show');
  renderGrammarAll();
}

/* PROGRESS TRACKING */
function toggleLearned(hz) {
  if (learnedWords.has(hz)) learnedWords.delete(hz);
  else learnedWords.add(hz);
  updateProgress();
}
function updateProgress() {
  const l = DATA.lessons.find(x => x.id === currentLessonId);
  if (!l) return;
  const total = l.words.length;
  let count = 0;
  l.words.forEach(w => { if (learnedWords.has(w.hz)) count++; });
  const pct = total ? Math.round(count / total * 100) : 0;
  document.getElementById('progText').textContent = `${count}/${total} · ${pct}%`;
  document.getElementById('progFill').style.width = pct + '%';
}

/* HANZI WRITER HELPERS */
const writers = {};
function initWriter(id, char) {
  if (writers[id]) return writers[id];
  const el = document.getElementById(id);
  if (!el) return null;
  el.innerHTML = '';
  writers[id] = HanziWriter.create(id, char, {
    width: 100,
    height: 100,
    padding: 4,
    showOutline: true,
    strokeAnimationSpeed: 1,
    delayBetweenStrokes: 200,
    strokeColor: '#013220',
    radicalColor: '#006D6F',
    outlineColor: '#E3DED0',
    drawingColor: '#007A74'
  });
  return writers[id];
}
function writerAction(id, char, act) {
  const w = initWriter(id, char);
  if (!w) return;
  if (act === 'animate') w.animateCharacter();
  else if (act === 'quiz') w.quiz();
  else { w.showOutline(); w.hideCharacter(); }
}

/* MODAL WRITER FOR MULTI-CHAR WORDS */
function cjkChars(str) { return Array.from(str).filter(c => /[\u3400-\u9FFF]/.test(c)); }
function openWriterModal(hz, py, vi) {
  document.getElementById('mZh').textContent = hz;
  document.getElementById('mPy').textContent = py;
  document.getElementById('mVi').textContent = vi;
  const row = document.getElementById('writerRow');
  row.innerHTML = '';
  const chars = cjkChars(hz);
  chars.forEach((c, idx) => {
    const d = document.createElement('div');
    d.className = 'writer-cell';
    d.id = `m-wc-${idx}`;
    row.appendChild(d);
    initWriter(`m-wc-${idx}`, c);
  });
  document.getElementById('mAnimate').onclick = () => { chars.forEach((c, idx) => writerAction(`m-wc-${idx}`, c, 'animate')); };
  document.getElementById('mQuiz').onclick = () => { chars.forEach((c, idx) => writerAction(`m-wc-${idx}`, c, 'quiz')); };
  document.getElementById('mReset').onclick = () => { chars.forEach((c, idx) => writerAction(`m-wc-${idx}`, c, 'reset')); };
  document.getElementById('modalBack').classList.add('show');
}
function closeWriterModal() { document.getElementById('modalBack').classList.remove('show'); }
document.getElementById('modalBack').onclick = (e) => { if (e.target === document.getElementById('modalBack')) closeWriterModal(); };

/* EXERCISES HELPERS */
function checkChoiceEx(btn, exi, oi) {
  const ex = (window.currentExercises || [])[exi] || {};
  const opt = (ex.options || [])[oi] || {};
  const isOk = !!opt.correct;
  const fb = document.getElementById('fb-ex-' + exi);
  const grp = btn.parentElement;
  grp.querySelectorAll('.choice-chip').forEach(c => c.style.pointerEvents = 'none');
  if (isOk) {
    btn.classList.add('correct');
    fb.className = 'fb ok';
    fb.textContent = '✓ ' + (ex.ok_msg || '');
  } else {
    btn.classList.add('wrong');
    fb.className = 'fb bad';
    fb.textContent = '✗ ' + (ex.bad_msg || '');
  }
}

function resetChoiceEx(exi) {
  const grp = document.getElementById('chips-ex-' + exi);
  if (grp) {
    grp.querySelectorAll('.choice-chip').forEach(c => {
      c.classList.remove('correct', 'wrong');
      c.style.pointerEvents = '';
    });
  }
  const fb = document.getElementById('fb-ex-' + exi);
  if (fb) { fb.className = 'fb'; fb.textContent = ''; }
}

const orderingState = {};
function initOrderingEx(exi, tokens, correctOrder) {
  orderingState[exi] = { picked: [], correctOrder: correctOrder, tokens: tokens };
  const tbox = document.getElementById(`tokens-ex-${exi}`);
  if (!tbox) return;
  tbox.innerHTML = '';
  const shuffled = tokens.slice().sort(() => Math.random() - 0.5);
  shuffled.forEach((tok, pos) => {
    const c = document.createElement('div');
    c.className = 'token-chip';
    c.textContent = tok;
    c.onclick = () => {
      if (!c.classList.contains('used')) {
        orderingState[exi].picked.push({ tok, pos });
        c.classList.add('used');
        renderOrderingZone(exi);
      }
    };
    tbox.appendChild(c);
  });
  renderOrderingZone(exi);
}
function renderOrderingZone(exi) {
  const z = document.getElementById(`zone-ex-${exi}`);
  if (!z) return;
  z.innerHTML = '';
  orderingState[exi].picked.forEach((p, i) => {
    const s = document.createElement('span');
    s.className = 'answer-slot';
    s.textContent = p.tok;
    s.onclick = () => {
      orderingState[exi].picked.splice(i, 1);
      const chips = document.querySelectorAll(`#tokens-ex-${exi} .token-chip`);
      chips.forEach(c => { if (c.textContent === p.tok && c.classList.contains('used')) c.classList.remove('used'); });
      renderOrderingZone(exi);
    };
    z.appendChild(s);
  });
}
function checkOrderingEx(exi) {
  const st = orderingState[exi];
  const fb = document.getElementById(`fb-ex-${exi}`);
  const user = st.picked.map(p => p.tok).join(' ');
  const target = st.correctOrder.join(' ');
  if (user === target) {
    fb.className = 'fb ok';
    fb.innerHTML = '✓ Chính xác! Rất tốt.';
  } else {
    fb.className = 'fb bad';
    fb.innerHTML = `✗ Chưa đúng. Đáp án: <b>${target}</b>`;
  }
}
function resetOrderingEx(exi) {
  const st = orderingState[exi];
  initOrderingEx(exi, st.tokens, st.correctOrder);
  const fb = document.getElementById(`fb-ex-${exi}`);
  if (fb) fb.style.display = 'none';
}

function scoreBar(st) {
  return `<div class="pr-scorebar">
    <span class="stat">Đúng: <b>${st.correct}</b></span>
    <span class="stat">Tổng: <b>${st.total}</b></span>
    <span class="stat">Độ chính xác: <b>${st.total ? Math.round(st.correct / st.total * 100) : 0}%</b></span>
  </div>`;
}

function renderPractice() {
  const L = DATA.lessons[prLessonIdx];
  const words = L.words;
  const sb = DATA.sentences[String(L.id)];
  prBody.innerHTML = '';

  if (prMode === 'type') return renderPrType(words);
  if (prMode === 'listen') return renderPrListen(words);
  if (prMode === 'tone') return renderPrTone(words);
  if (prMode === 'match') return renderPrMatch(words);
  if (prMode === 'choice') return renderPrChoice(sb, words);
  if (prMode === 'order') return renderPrOrder(sb);
  if (prMode === 'qa') return renderPrQA(sb);
}

function stripTones(s) { return s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, ' ').trim().toLowerCase(); }
function pyPlain(parts) { return parts.map(p => stripTones(p[0])).join(' '); }

function renderPrType(words) {
  const items = words.slice().sort(() => Math.random() - 0.5).slice(0, 10);
  const st = { correct: 0, total: 0 };
  const wrap = document.createElement('div');
  wrap.innerHTML = scoreBar(st) + '<p class="pr-empty" style="padding:0 0 10px; font-size:13px; color:var(--text-soft)">Nhìn chữ Hán, gõ <b>pinyin không dấu</b> rồi nhấn Enter.</p>';
  const sc = wrap.querySelector('.pr-scorebar');

  items.forEach(w => {
    const q = document.createElement('div');
    q.className = 'pr-q';
    q.innerHTML = `
      <div class="q-prompt"><span class="big">${w.hz}</span>
      </div>
      <input class="pr-input" placeholder="gõ pinyin không dấu, vd: ni hao">
      <div class="fb"></div>
    `;
    const inp = q.querySelector('input'), fb = q.querySelector('.fb');
    let done = false;
    inp.addEventListener('keydown', e => {
      if (e.key !== 'Enter' || done) return;
      const ans = stripTones(inp.value), corr = pyPlain(w.py);
      st.total++; done = true; inp.disabled = true;
      if (ans === corr) {
        st.correct++; inp.classList.add('ok'); fb.className = 'fb ok';
        fb.textContent = '✓ Chính xác: ' + w.py.map(p => p[0]).join(' ');
      } else {
        inp.classList.add('bad'); fb.className = 'fb bad';
        fb.textContent = '✗ Đáp án: ' + w.py.map(p => p[0]).join(' ') + ' (' + corr + ')';
      }
      sc.outerHTML = scoreBar(st);
    });
    wrap.appendChild(q);
  });
  prBody.appendChild(wrap);
}

function renderPrListen(words) {
  const items = words.slice().sort(() => Math.random() - 0.5).slice(0, 10);
  const st = { correct: 0, total: 0 };
  const wrap = document.createElement('div');
  wrap.innerHTML = scoreBar(st) + '<p class="pr-empty" style="padding:0 0 10px; font-size:13px; color:var(--text-soft)">Nhìn nghĩa tiếng Việt, gõ <b>chữ Hán</b> tương ứng rồi nhấn Enter.</p>';
  const sc = wrap.querySelector('.pr-scorebar');

  items.forEach(w => {
    const q = document.createElement('div');
    q.className = 'pr-q';
    q.innerHTML = `
      <div class="q-prompt"><span class="big pr-vi-lower" style="color:var(--forest); font-weight:700;">${w.vi}</span>
      </div>
      <input class="pr-input" placeholder="gõ chữ Hán tương ứng">
      <div class="fb"></div>
    `;
    const inp = q.querySelector('input'), fb = q.querySelector('.fb');
    let done = false;
    inp.addEventListener('keydown', e => {
      if (e.key !== 'Enter' || done) return;
      st.total++; done = true; inp.disabled = true;
      if (inp.value.trim() === w.hz) {
        st.correct++; inp.classList.add('ok'); fb.className = 'fb ok';
        fb.textContent = '✓ ' + w.hz + ' · ' + w.py.map(p => p[0]).join(' ');
      } else {
        inp.classList.add('bad'); fb.className = 'fb bad';
        fb.textContent = '✗ Đáp án: ' + w.hz + ' · ' + w.py.map(p => p[0]).join(' ');
      }
      sc.outerHTML = scoreBar(st);
    });
    wrap.appendChild(q);
  });
  prBody.appendChild(wrap);
}

function renderPrMatch(words) {
  const pool = words.slice().sort(() => Math.random() - 0.5).slice(0, 6);
  const st = { correct: 0, total: pool.length };
  const wrap = document.createElement('div');
  wrap.innerHTML = scoreBar(st) + '<p class="pr-empty" style="padding:0 0 10px; font-size:13px; color:var(--text-soft)">Bấm 1 ô Pinyin, rồi bấm ô Chữ Hán tương ứng.</p>';
  const grid = document.createElement('div'); grid.className = 'pr-match';
  const cP = document.createElement('div'), cV = document.createElement('div');
  cP.innerHTML = '<div class="col-h">Pinyin</div>'; cV.innerHTML = '<div class="col-h">Chữ Hán</div>';

  const pinyins = pool.slice().sort(() => Math.random() - 0.5);
  const hanzis = pool.slice().sort(() => Math.random() - 0.5);

  pinyins.forEach(w => {
    const t = document.createElement('div'); t.className = 'pr-mtile';
    t.dataset.hz = w.hz; t.textContent = w.py.map(p => p[0]).join(' ');
    cP.appendChild(t);
  });
  hanzis.forEach(w => {
    const t = document.createElement('div'); t.className = 'pr-mtile';
    t.dataset.hz = w.hz; t.textContent = w.hz;
    cV.appendChild(t);
  });

  grid.append(cP, cV); wrap.appendChild(grid);
  const fb = document.createElement('div'); fb.className = 'fb'; wrap.appendChild(fb);
  prBody.appendChild(wrap);

  const sc = wrap.querySelector('.pr-scorebar');
  let target = null;
  grid.querySelectorAll('.pr-mtile').forEach(tile => {
    tile.onclick = () => {
      if (tile.classList.contains('done')) return;
      const isColP = tile.parentElement === cP;
      if (isColP) {
        target = tile.dataset.hz;
        cP.querySelectorAll('.pr-mtile').forEach(x => x.classList.remove('pick'));
        tile.classList.add('pick');
      } else {
        if (!target) { fb.className = 'fb bad'; fb.textContent = 'Hãy chọn ô Pinyin bên trái trước.'; return; }
        if (tile.dataset.hz === target) {
          tile.classList.add('done');
          const pTile = cP.querySelector(`.pr-mtile[data-hz="${target}"]`);
          if (pTile) { pTile.classList.remove('pick'); pTile.classList.add('done'); }
          st.correct++; sc.outerHTML = scoreBar(st);
          fb.className = 'fb ok'; fb.textContent = '✓ Đúng!';
          target = null;
        } else {
          fb.className = 'fb bad'; fb.textContent = '✗ Chưa đúng, hãy thử lại.';
        }
      }
    };
  });
}

function renderPrChoice(sb, words) {
  if (!sb || !sb.sents || !sb.sents.length) {
    prBody.innerHTML = '<div style="text-align:center; padding:30px; color:var(--text-soft)">Bài này sử dụng các bài tập trong mục 综合练习.</div>';
    return;
  }
  const items = sb.sents.slice().sort(() => Math.random() - 0.5).slice(0, 5);
  const st = { correct: 0, total: 0 };
  const wrap = document.createElement('div');
  wrap.innerHTML = scoreBar(st) + '<p class="pr-empty" style="padding:0 0 10px; font-size:13px; color:var(--text-soft)">Chọn từ đúng để điền vào chỗ trống:</p>';
  const sc = wrap.querySelector('.pr-scorebar');

  items.forEach(s => {
    const q = document.createElement('div'); q.className = 'pr-q';
    const blanked = s.zh.replace(s.blank, '____');
    const others = words.filter(w => w.hz !== s.blank).sort(() => Math.random() - 0.5).slice(0, 2).map(w => w.hz);
    const choices = [s.blank, ...others].sort(() => Math.random() - 0.5);

    q.innerHTML = `
      <div class="q-prompt"><span class="big">${blanked}</span><span class="py">${s.py}</span>
      </div>
      <div class="chip-group"></div>
      <div class="fb"></div>
    `;
    const cwrap = q.querySelector('.chip-group'), fb = q.querySelector('.fb');
    let done = false;

    choices.forEach(c => {
      const b = document.createElement('button'); b.className = 'choice-chip'; b.textContent = c;
      b.onclick = () => {
        if (done) return;
        done = true; st.total++;
        if (c === s.blank) {
          b.classList.add('correct'); st.correct++; fb.className = 'fb ok'; fb.textContent = '✓ ' + s.zh;
        } else {
          b.classList.add('wrong'); fb.className = 'fb bad'; fb.textContent = '✗ Đáp án: ' + s.blank + ' → ' + s.zh;
        }
        cwrap.querySelectorAll('.choice-chip').forEach(x => x.style.pointerEvents = 'none');
        sc.outerHTML = scoreBar(st);
      };
      cwrap.appendChild(b);
    });
    wrap.appendChild(q);
  });
  prBody.appendChild(wrap);
}

function renderPrOrder(sb) {
  if (!sb || !sb.sents || !sb.sents.length) {
    prBody.innerHTML = '<div style="text-align:center; padding:30px; color:var(--text-soft)">Bài này sử dụng phần sắp xếp câu trong mục 综合练习.</div>';
    return;
  }
  const items = sb.sents.slice().sort(() => Math.random() - 0.5).slice(0, 4);
  const st = { correct: 0, total: 0 };
  const wrap = document.createElement('div');
  wrap.innerHTML = scoreBar(st) + '<p class="pr-empty" style="padding:0 0 10px; font-size:13px; color:var(--text-soft)">Bấm các mảnh Pinyin theo đúng thứ tự để tạo câu:</p>';
  const sc = wrap.querySelector('.pr-scorebar');

  items.forEach(s => {
    const q = document.createElement('div'); q.className = 'pr-q';
    const segs = s.segs;
    const order = segs.map((_, i) => i).sort(() => Math.random() - 0.5);

    q.innerHTML = `
      <div class="answer-zone"></div>
      <div class="token-container"></div>
      <div style="display:flex; gap:8px; margin-top:6px;">
        <button class="btn btn-primary btn-chk" style="padding:5px 12px; font-size:12px;">Kiểm tra</button>
        <button class="btn btn-outline btn-rst" style="padding:5px 12px; font-size:12px;">Làm lại</button>
      </div>
      <div class="fb"></div>
    `;
    const line = q.querySelector('.answer-zone'), tokBox = q.querySelector('.token-container'), fb = q.querySelector('.fb');

    let picked = [];
    function render() {
      tokBox.innerHTML = '';
      order.forEach((segIdx, pos) => {
        const used = picked.includes(pos);
        const b = document.createElement('div'); b.className = 'token-chip' + (used ? ' used' : '');
        b.textContent = segs[segIdx][1];
        b.onclick = () => { if (!used) { picked.push(pos); render(); } };
        tokBox.appendChild(b);
      });
      line.innerHTML = '';
      picked.forEach((pos, slotOrder) => {
        const segIdx = order[pos];
        const sp = document.createElement('span'); sp.className = 'answer-slot'; sp.textContent = segs[segIdx][1];
        sp.onclick = () => { picked.splice(slotOrder, 1); render(); };
        line.appendChild(sp);
      });
    }
    render();

    q.querySelector('.btn-rst').onclick = () => { picked = []; fb.style.display = 'none'; render(); };
    let done = false;
    q.querySelector('.btn-chk').onclick = () => {
      if (done) return;
      const chosen = picked.map(pos => order[pos]);
      const correct = segs.map((_, i) => i);
      const ok = chosen.length === correct.length && chosen.every((v, i) => v === correct[i]);
      st.total++;
      if (ok) {
        done = true; st.correct++; fb.className = 'fb ok';
        fb.innerHTML = '✓ ' + s.zh + ' · ' + segs.map(x => x[1]).join(' ');
      } else {
        fb.className = 'fb bad';
        fb.innerHTML = '✗ Đáp án: ' + segs.map(x => x[1]).join(' ') + ' → ' + s.zh;
      }
      sc.outerHTML = scoreBar(st);
    };
    wrap.appendChild(q);
  });
  prBody.appendChild(wrap);
}

function renderPrTone(words) {
  const items = words.slice().sort(() => Math.random() - 0.5).slice(0, 8);
  const st = { correct: 0, total: 0 };
  const wrap = document.createElement('div');
  wrap.innerHTML = scoreBar(st) + '<p class="pr-empty" style="padding:0 0 10px; font-size:13px; color:var(--text-soft)">Chọn thanh điệu cho từng âm tiết:</p>';
  const sc = wrap.querySelector('.pr-scorebar');

  items.forEach(w => {
    const q = document.createElement('div'); q.className = 'pr-q';
    const syls = w.py.map(p => p[0]);
    let row = '<div style="display:flex; gap:10px; margin:8px 0;">';
    syls.forEach((s, i) => {
      row += `<div style="display:flex; flex-direction:column; gap:4px; align-items:center;">
        <span style="font-size:14px; font-style:italic;">${stripTones(s)}</span>
        <select data-i="${i}" style="padding:4px 8px; border-radius:6px; border:1px solid var(--border);">
          <option value="0">?</option><option value="1">1 ¯</option><option value="2">2 ´</option><option value="3">3 ˇ</option><option value="4">4 \`</option><option value="5">Nhẹ</option>
        </select>
      </div>`;
    });
    row += '</div>';

    q.innerHTML = `
      <div class="q-prompt"><span class="big">${w.hz}</span>
      </div>
      ${row}
      <div style="margin-top:6px;"><button class="btn btn-outline chk" style="padding:4px 10px; font-size:12px;">Kiểm tra</button></div>
      <div class="fb"></div>
    `;
    const fb = q.querySelector('.fb');
    let done = false;

    q.querySelector('.chk').onclick = () => {
      if (done) return;
      done = true; st.total++;
      let ok = true;
      const sels = q.querySelectorAll('select');
      sels.forEach((sel, i) => {
        const want = w.py[i][1], got = +sel.value;
        if (got !== want) ok = false;
        sel.disabled = true;
      });
      if (ok) {
        st.correct++; fb.className = 'fb ok'; fb.textContent = '✓ ' + w.py.map(p => p[0]).join(' ');
      } else {
        fb.className = 'fb bad'; fb.textContent = '✗ Đáp án: ' + w.py.map(p => p[0]).join(' ');
      }
      sc.outerHTML = scoreBar(st);
    };
    wrap.appendChild(q);
  });
  prBody.appendChild(wrap);
}

function renderPrQA(sb) {
  if (!sb || !sb.qa || !sb.qa.length) {
    prBody.innerHTML = '<div style="text-align:center; padding:30px; color:var(--text-soft)">Bài này sử dụng các bài tập trong mục 综合练习.</div>';
    return;
  }
  const pairs = sb.qa.slice(0, 4);
  const st = { correct: 0, total: pairs.length };
  const wrap = document.createElement('div');
  wrap.innerHTML = scoreBar(st) + '<p class="pr-empty" style="padding:0 0 10px; font-size:13px; color:var(--text-soft)">Bấm 1 câu hỏi bên trái, rồi bấm câu trả lời đúng bên phải (hán tự + pinyin):</p>';
  const sc = wrap.querySelector('.pr-scorebar');

  const grid = document.createElement('div'); grid.className = 'pr-match';
  const cQ = document.createElement('div'), cA = document.createElement('div');
  cQ.innerHTML = '<div class="col-h">Câu hỏi</div>'; cA.innerHTML = '<div class="col-h">Trả lời</div>';

  pairs.forEach((p, i) => {
    const t = document.createElement('div'); t.className = 'pr-mtile'; t.dataset.i = i;
    t.innerHTML = `<div style="font-weight:700; color:var(--forest);">${p.q_zh}</div><div class="tone-py" style="font-size:11px; color:var(--text-soft);">${colorPy(p.q_py)}</div>`;
    cQ.appendChild(t);
  });
  pairs.slice().sort(() => Math.random() - 0.5).forEach(p => {
    const origIdx = pairs.indexOf(p);
    const t = document.createElement('div'); t.className = 'pr-mtile'; t.dataset.i = origIdx;
    t.innerHTML = `<div style="font-weight:700; color:var(--forest);">${p.a_zh}</div><div class="tone-py" style="font-size:11px; color:var(--text-soft);">${colorPy(p.a_py)}</div>`;
    cA.appendChild(t);
  });

  grid.append(cQ, cA); wrap.appendChild(grid);
  const fb = document.createElement('div'); fb.className = 'fb'; wrap.appendChild(fb);
  prBody.appendChild(wrap);

  let pickQ = null;
  cQ.querySelectorAll('.pr-mtile').forEach(t => {
    t.onclick = () => {
      cQ.querySelectorAll('.pr-mtile').forEach(x => x.classList.remove('pick'));
      t.classList.add('pick');
      pickQ = t.dataset.i;
    };
  });
  cA.querySelectorAll('.pr-mtile').forEach(t => {
    t.onclick = () => {
      if (pickQ === null) { fb.className = 'fb bad'; fb.textContent = 'Hãy chọn câu hỏi bên trái trước.'; return; }
      if (t.dataset.i === pickQ) {
        t.classList.add('done');
        const qTile = cQ.querySelector(`.pr-mtile[data-i="${pickQ}"]`);
        if (qTile) { qTile.classList.remove('pick'); qTile.classList.add('done'); }
        st.correct++; sc.outerHTML = scoreBar(st);
        fb.className = 'fb ok'; fb.textContent = '✓ Đúng!';
        pickQ = null;
      } else {
        fb.className = 'fb bad'; fb.textContent = '✗ Chưa đúng, hãy thử lại.';
      }
    };
  });
}

/* PINYIN TOGGLE */
function togglePinyin() {
  pinyinVisible = !pinyinVisible;
  document.querySelectorAll('.py-row').forEach(el => {
    el.style.display = pinyinVisible ? '' : 'none';
  });
  document.getElementById('btnTogglePy')?.classList.toggle('on', !pinyinVisible);
}

/* SCROLL HELPER */
function scrollToSec(section, pill) {
  // Level-2 navigation: target the section of the CURRENT lesson only.
  const el = document.getElementById(`lesson-${currentLessonId}-${section}`);
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  // active state for the lesson subnav (independent from sidebar active state)
  if (pill) {
    document.querySelectorAll('#lessonSubnav .subnav-pill').forEach(p => p.classList.remove('active'));
    pill.classList.add('active');
  }
}

/* INITIALIZATION */
window.addEventListener('DOMContentLoaded', () => {
  buildNav();
  renderLesson(1);
});
